<!-- ===== MESELE ATÖLYESİ (simülasyon) — sablon.html'den ayrı deneme parçası ===== -->
<style>
.atl{max-width:860px;margin:0 auto;padding:4px 16px 120px}
.atl h2{margin:18px 0 4px}
.atl .lead{color:var(--muted);margin:0 0 12px}
.seg{display:flex;gap:4px;background:#efe8d8;border:1px solid var(--line);border-radius:12px;padding:4px;margin:8px 0 12px;max-width:420px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 10px;font-weight:600;color:var(--muted);font-size:.92rem}
.seg button.on{background:var(--card);color:var(--green);box-shadow:0 1px 3px rgba(40,30,10,.12)}
.hazir{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.hz{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;box-shadow:var(--shadow)}
.hz b{display:block;color:var(--green);font-size:.95rem}
.hz span{font-family:var(--ar);font-size:1.12rem;display:block;direction:rtl;text-align:right;margin-top:2px}
.hz small{color:var(--muted);font-size:.78rem}
.hz.cz{border-color:#cfe0d6;background:#f6faf7}
details.agrp{margin:10px 0;border:1px solid var(--line);border-radius:12px;background:#fbf8f1;padding:0 10px}
details.agrp summary{cursor:pointer;padding:11px 4px;font-weight:700;color:var(--green)}
details.agrp summary small{color:var(--muted);font-weight:400;margin-left:6px}
details.agrp .hazir{padding:0 0 10px}
.vgrp{margin:10px 0 4px;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:0;border:1px solid var(--line);background:var(--card);border-radius:999px;overflow:hidden}
.chip .cb{border:0;background:transparent;padding:6px 10px 6px 12px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;text-align:left}
.chip .cb .a{font-family:var(--ar);font-size:1.05rem}.chip .cb .t{font-size:.72rem;color:var(--muted)}
.chip.on{border-color:var(--green);background:var(--green-soft)}
.chip .n{min-width:22px;text-align:center;font-weight:700;color:var(--green)}
.chip .pm{border:0;background:transparent;width:30px;height:40px;font-size:1.1rem;color:var(--green)}
.terike{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.terike input{width:150px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:1rem}
.steps5{display:flex;gap:4px;margin:14px 0 10px;flex-wrap:wrap}
.steps5 span{font-size:.76rem;padding:4px 10px;border-radius:999px;background:#efe8d8;color:var(--muted);font-weight:600}
.steps5 span.on{background:var(--green);color:#fff}.steps5 span.ok{background:var(--green-soft);color:var(--green)}
.gorev{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:8px 0 12px;box-shadow:var(--shadow)}
.gorev b{color:var(--green)}
.tablo{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0 6px}
table.at{border-collapse:collapse;font-family:var(--sans);direction:ltr;margin:4px 0}
table.at td{border:1.5px solid #3b4a42;padding:4px 6px;text-align:center;min-width:52px;height:42px;background:#fff;vertical-align:middle}
table.at td.nb{border:0;background:transparent}
table.at td.vc{font-family:var(--ar);font-size:1.22rem;direction:rtl;text-align:right;min-width:100px;white-space:nowrap;padding:4px 10px}
table.at td.pc{border:0;background:transparent;text-align:left;min-width:96px}
table.at tr.ust td{border:0;background:transparent;height:auto;font-size:.74rem;color:var(--gold);font-weight:700}
table.at tr.alt td{border:0;background:transparent;height:auto;font-size:.74rem;color:var(--muted);padding-top:2px}
table.at input{width:56px;padding:6px 4px;border:1px solid #c9c1ad;border-radius:7px;text-align:center;font-size:1rem;font-weight:700;background:#fffdf6}
table.at td.mh input{border-color:var(--green);color:var(--green)}
table.at select{padding:6px 4px;border:1px solid #c9c1ad;border-radius:7px;font-size:.95rem;background:#fffdf6;max-width:110px}
table.at .dogru{background:var(--green-soft)!important;border-color:var(--green)!important}
table.at .yanlis{background:var(--red-soft)!important;border-color:var(--red)!important}
table.at .sabit{font-weight:700}
table.at s{color:var(--red);opacity:.7;margin-right:4px}
table.at .arp{font-family:var(--ar);font-size:1.1rem}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn2{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;color:var(--green)}
.btn2.ana{background:var(--green);color:#fff;border-color:var(--green)}
.geri{margin:8px 0;padding:10px 14px;border-radius:10px;font-size:.93rem;line-height:1.55}
.geri.ok{background:var(--green-soft);border-left:4px solid var(--green)}
.geri.no{background:var(--red-soft);border-left:4px solid var(--red)}
.geri ul{margin:6px 0 0;padding-left:18px}
.tur{display:flex;gap:6px;flex-wrap:wrap}
.tur button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600}
.tur button.sec{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.sonuc{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:6px}
.sonuc th,.sonuc td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
.sonuc td.a{font-family:var(--ar);font-size:1.1rem}
.ipucu{font-size:.88rem;color:var(--muted);margin:4px 0 0}
.anlat ol{margin:8px 0 4px;padding-left:20px}.anlat ol>li{margin:0 0 10px;line-height:1.55}.anlat ul{margin:4px 0 0;padding-left:18px}.anlat li li{margin:2px 0}
.geri ul{line-height:1.6}
@media (max-width:560px){
  table.at td{min-width:44px;padding:3px 4px;height:40px}
  table.at td.vc{min-width:78px;font-size:1.1rem;padding:3px 6px}
  table.at input{width:46px;font-size:.95rem}
  table.at select{max-width:92px;font-size:.9rem}
  table.at td.pc{min-width:88px}
}
</style>
<script>
/*MOTOR*/
const HAZIR = [
  {ad: 'Mesele 1', g: {zevce: 1, ibn: 1, bint: 1}},
  {ad: 'Mesele 2', g: {zevc: 1, um: 1, eb: 1}},
  {ad: 'Mesele 3', g: {zevce: 1, bint: 2, eb: 1, um: 1}},
  {ad: 'Mesele 4', g: {zevce: 1, um: 1, bint: 2, ahS: 12, uhtS: 1}, t: 600, n: 'Terike: 600 dinar'},
  {ad: 'Mesele 5', g: {zevc: 1, um: 1, uhtS: 2, uhtU: 2}},
  {ad: 'Mesele 6', g: {zevce: 1, bint: 1, um: 1}},
  {ad: 'Mesele 7', g: {zevc: 1, um: 1, ahU: 2, ahS: 1}},
  {ad: 'Mesele 8', g: {bint: 1, uhtS: 1, amS: 1}},
];
const GRUPLAR = [['Eşler', ['zevc', 'zevce']], ['Usul', ['eb', 'cedd', 'um', 'ceddeU', 'ceddeB']], ['Fürû', ['ibn', 'bint', 'ibnIbn', 'bintIbn']],
  ['Kardeşler', ['ahS', 'uhtS', 'ahB', 'uhtB', 'ahU', 'uhtU']], ['Kardeş çocukları ve amcalar', ['ibnAhS', 'ibnAhB', 'amS', 'amB', 'ibnAmS', 'ibnAmB']]];
const IPUCU = {
  zevc: 'Ölenin fürûu (çocuğu ya da oğlunun çocuğu) var mı?', zevce: 'Ölenin fürûu (çocuğu ya da oğlunun çocuğu) var mı?',
  eb: 'Ölenin erkek fürûu mu var, yalnız kız fürûu mu, yoksa hiç fürûu yok mu?',
  cedd: 'Önce baba var mı diye bak; yoksa dede babanın hallerini alır.',
  um: 'Fürû var mı? Birden fazla kardeş var mı? Baba ve eşlerden biri birlikte mi?',
  ceddeU: 'Anne var mı? Birden fazla nene var mı?', ceddeB: 'Anne var mı? Baba var mı?',
  ibn: 'Oğul kimin yanında asabe olur?', bint: 'Oğul var mı? Kız tek mi, birden fazla mı?',
  ibnIbn: 'Ölenin oğlu var mı?', bintIbn: 'Oğul var mı? Kaç kız var? Oğlun oğlu var mı?',
  ahS: 'Ölenin erkek fürûu, babası ya da dedesi var mı?', uhtS: 'Erkek fürû, baba, dede var mı? Öz erkek kardeş var mı? Kız ya da oğlun kızı var mı? Kaç tane?',
  ahB: 'Erkek fürû, baba, dede, öz erkek kardeş var mı? Kız kardeşler asabe maa’l-gayr mı?', uhtB: 'Öz kız kardeş kaç tane, nasıl pay alıyor? Baba bir erkek kardeş var mı? Kız ya da oğlun kızı var mı?',
  ahU: 'Fürû ya da erkek usul var mı? Anne bir kardeşler kaç kişi?', uhtU: 'Fürû ya da erkek usul var mı? Anne bir kardeşler kaç kişi?',
};
const ipucu = k => IPUCU[k] || 'Cihet, derece, kuvvet: bu varisten daha önde bir asabe var mı?';
const HALLER = ['1/2', '1/4', '1/8', '2/3', '1/3', '1/6', '1/6+ع', 'ع', '1/3 الباقي', 'م'];
/* ---- alıştırmalar: ünitelerdeki (KITAP_AL) ve tablolardaki (ALIS) ---- */
const atlKayit = () => { try { return JSON.parse(localStorage.getItem('fr_atl') || '{}'); } catch (e) { return {}; } };
const atlYaz = (id, v) => { try { const k = atlKayit(); if (k[id] !== 'tam') k[id] = v; localStorage.setItem('fr_atl', JSON.stringify(k)); } catch (e) {} };
function cozulebilir(v) { const {g, bilinmeyen} = cevir(v); if (bilinmeyen.length || !Object.keys(g).length) return null; try { return coz(g).destek ? g : null; } catch (e) { return null; } }
let _ALL = null;
function tumAlis() {
  if (_ALL) return _ALL;
  const kat = g => { const k = Object.keys(g);
    if (k.some(x => /^cedde|^ebUm/.test(x))) return 'Neneler';
    if (k.some(x => ['bintIbn', 'ibnIbn', 'ibn3', 'bint3', 'ibn4', 'bint4', 'bintBint', 'ibnBint'].includes(x))) return 'Oğlun çocukları';
    if (k.some(x => /^(ah|uht|ibnAh|am|ibnAm)/.test(x))) return 'Kardeşler ve amcalar';
    return 'Eşler, anne-baba ve çocuklar'; };
  const out = [];
  (typeof KITAP_AL !== 'undefined' ? KITAP_AL : []).forEach((x, i) => { const g = cozulebilir(x.v); if (g) out.push({id: 'k' + i, v: x.v, g, n: x.n, grup: (x.u + 1) + '. ünite · ' + UNITELER[x.u].t, ad: (x.u + 1) + '. ünite alıştırması'}); });
  let no = 0;
  (typeof ALIS !== 'undefined' ? ALIS : []).forEach((v, i) => { const g = cozulebilir(v); if (g) { no++; out.push({id: 't' + i, v, g, grup: kat(g), ad: 'Alıştırma ' + no}); } });
  return (_ALL = out);
}
function alisAc(id, sinavda) {
  const x = tumAlis().find(a => a.id === id); if (!x) return;
  A.g = Object.assign({}, x.g); A.terike = ''; A.ad = x.ad; A.alisId = id; if (!sinavda) A.sinav = null; kur(true);
  if (curView !== 'atolye') go('atolye'); else atolye();
}
function atlAcV(btn) { const v = btn.getAttribute('data-v'); const x = tumAlis().find(a => a.id[0] === 'k' && a.v === v); if (x) alisAc(x.id); }
function siradaki() { const k = atlKayit(), x = tumAlis().find(a => !k[a.id]) || tumAlis()[0]; alisAc(x.id); }
function sinavBasla() {
  const L = shuffle(tumAlis().map(a => a.id)).slice(0, 5);
  A.sinav = {ids: L, i: 0, sonuc: []}; alisAc(L[0], true);
}
let A = {mod: 'hazir', g: {}, terike: '', r: null, adim: 0, tur: null, hal: {}, cev: {}, ok: {}};
const esc2 = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const say = v => { if (v === '-' || v === '–' || v === '' || v == null) return 0; return String(v).split('+').reduce((t, x) => t + (+x || 0), 0); };

function atolye() {
  const el = document.getElementById('app');
  if (!A.r) {
    el.innerHTML = `<div class="atl">
      <h2>Mesele Atölyesi</h2>
      <p class="lead">Varisleri seç, mesele tablosunu adım adım kendin doldur: önce haller, sonra meseleyi kaçtan kuracağın (mahreç) ve sihâmlar, sonra mesele türü ve tashih. Her adımda kontrol et; takılırsan ipucuna bak.</p>
      <div class="seg"><button class="${A.mod === 'hazir' ? 'on' : ''}" onclick="A.mod='hazir';atolye()">Kitaptaki meseleler</button><button class="${A.mod === 'alis' ? 'on' : ''}" onclick="A.mod='alis';atolye()">Alıştırmalar</button><button class="${A.mod === 'kur' ? 'on' : ''}" onclick="A.mod='kur';atolye()">Kendin kur</button></div>
      ${A.sinav && A.sinav.bitti ? sinavSonuc() : ''}
      ${A.mod === 'alis' ? alisListe() : A.mod === 'hazir' ? `<div class="hazir">${HAZIR.map((h, i) => `<button class="hz" onclick="hazirAc(${i})"><b>${esc2(h.ad)}</b><span>${Object.entries(h.g).map(([k, n]) => VAR[k].a + (n > 1 ? ` (${n})` : '')).join(' ، ')}</span>${h.n ? `<small>${esc2(h.n)}</small>` : ''}</button>`).join('')}</div>`
      : `${GRUPLAR.map(([ad, ks]) => `<div class="vgrp">${ad}</div><div class="chips">${ks.map(k => { const n = A.g[k] || 0; return `<span class="chip ${n ? 'on' : ''}"><button class="cb" onclick="ekle('${k}',1)"><span class="a">${VAR[k].a}</span><span class="t">${VAR[k].t}</span></button>${n ? `<button class="pm" onclick="ekle('${k}',-1)" aria-label="Azalt">−</button><span class="n">${n}</span><button class="pm" onclick="ekle('${k}',1)" aria-label="Artır">+</button>` : ''}</span>`; }).join('')}</div>`).join('')}
        <div class="terike"><label for="trk">Terike (isteğe bağlı):</label><input id="trk" inputmode="decimal" placeholder="ör. 600" value="${esc2(A.terike)}" oninput="A.terike=this.value"></div>
        <div class="btns"><button class="btn2 ana" onclick="kur()" ${Object.keys(A.g).length ? '' : 'disabled'}>Meseleyi kur →</button>${Object.keys(A.g).length ? '<button class="btn2" onclick="A.g={};atolye()">Temizle</button>' : ''}</div>`}
    </div>`;
    return;
  }
  ciz();
}
function alisListe() {
  const L = tumAlis(), k = atlKayit(), bitti = L.filter(a => k[a.id]).length, tam = L.filter(a => k[a.id] === 'tam').length;
  const SIRA = ['Eşler, anne-baba ve çocuklar', 'Oğlun çocukları', 'Neneler', 'Kardeşler ve amcalar'];
  const gruplar = [...new Set(L.map(a => a.grup))].sort((x, y) => (SIRA.indexOf(x) + 1 || parseInt(x) + 10) - (SIRA.indexOf(y) + 1 || parseInt(y) + 10));
  return `<div class="gorev"><b>${bitti} / ${L.length}</b> alıştırma çözüldü${tam ? ` · ${tam} tanesi hiç yardım almadan` : ''}.
      <div class="btns" style="margin-bottom:0"><button class="btn2 ana" onclick="siradaki()">Sıradaki alıştırma →</button><button class="btn2" onclick="sinavBasla()">Sınav: rastgele 5 mesele</button></div>
      <p class="ipucu">Sınavda ipucu ve “çözümü göster” yoktur; her mesele için kaç denemede çözdüğün puanlanır.</p></div>
    ${gruplar.map(gr => `<details class="agrp" ${gr === 'Eşler, anne-baba ve çocuklar' ? 'open' : ''}><summary>${esc2(gr)} <small>${L.filter(a => a.grup === gr && k[a.id]).length} / ${L.filter(a => a.grup === gr).length}</small></summary>
      <div class="hazir">${L.filter(a => a.grup === gr).map(a => `<button class="hz ${k[a.id] ? 'cz' : ''}" onclick="alisAc('${a.id}')"><b>${k[a.id] === 'tam' ? '✓ ' : k[a.id] ? '◐ ' : ''}${esc2(a.ad)}</b><span>${esc2(a.v)}</span>${a.n ? `<small>${esc2(a.n)}</small>` : ''}</button>`).join('')}</div></details>`).join('')}`;
}
function sinavSonuc() {
  const S = A.sinav, puan = S.sonuc.reduce((t, x) => t + x.p, 0);
  return `<div class="gorev"><b>Sınav sonucu: ${puan} / ${S.sonuc.length * 4}</b><ul>${S.sonuc.map((x, i) => `<li>${i + 1}. ${esc2(x.ad)}: ${x.hata ? `${x.hata} yanlış deneme` : 'ilk denemede'} · ${x.p} puan</li>`).join('')}</ul><p class="ipucu">Her mesele 4 puan; her yanlış deneme 1 puan düşürür.</p>
    <div class="btns"><button class="btn2 ana" onclick="sinavBasla()">Yeni sınav</button><button class="btn2" onclick="A.sinav=null;atolye()">Kapat</button></div></div>`;
}
function ekle(k, d) {
  const n = Math.max(0, Math.min(VAR[k].m, (A.g[k] || 0) + d));
  if (n) A.g[k] = n; else delete A.g[k];
  if (d > 0 && k === 'zevc') delete A.g.zevce; if (d > 0 && k === 'zevce') delete A.g.zevc;
  atolye();
}
function hazirAc(i) { A.g = Object.assign({}, HAZIR[i].g); A.terike = HAZIR[i].t ? String(HAZIR[i].t) : ''; A.ad = HAZIR[i].ad; A.alisId = null; A.sinav = null; kur(); }
function kur(kendi) {
  if (!kendi && A.mod === 'kur') { A.alisId = null; A.sinav = null; }
  A.kaydedildi = false; A.r = coz(A.g); A.adim = 1; A.tur = null; A.tashih = false; A.yardim = {}; A.hataSay = 0; A.hal = {}; A.cev = {}; A.ok = {}; A.geri = '';
  if (!A.ad) A.ad = 'Kendi meselen';
  atolye();
}
function yeni() { A.r = null; A.ad = null; A.g = {}; A.terike = ''; if (A.sinav && !A.sinav.bitti) A.sinav = null; atolye(); }

/* ---- adımlar ----
   1 haller · 2 mahreç ve sihâm · 3 mesele türü (avl/red) · 4 tashih · 5 sonuç */
function sutunlar() {
  const r = A.r, cols = [{id: 'c1', m: r.mahrec, v: s => s.ilk, ad: ''}];
  if ((A.adim > 3 || (A.adim === 3 && A.tur === r.tur)) && r.tur === 'reddiye') cols.push({id: 'c2', m: r.mahrec2, v: s => s.s2, ad: 'red'});
  if ((A.adim > 4 || (A.adim === 4 && A.tashih)) && r.cuz > 1) cols.push({id: 'c3', m: r.mahrec3, v: s => s.sonS, ad: 'tashih', ust: A.adim === 4 ? 'CUZ' : '× ' + r.cuz});
  return cols;
}
function hucre(col, s, i) {
  const v = col.v(s);
  const adimOf = {c1: 2, c2: 3, c3: 4};
  if (A.adim < adimOf[col.id] && col.id !== 'c1') return '';   // henüz sırası gelmeyen sütun boş durur
  const aktifSut = (col.id === 'c1' && A.adim <= 2) || (col.id === 'c2' && A.adim === 3) || (col.id === 'c3' && A.adim === 4);
  if (v === '^' && !aktifSut) return null;   // birleşik (çözülmüş sütunda)
  const id = col.id + '-' + i;
  const aktif = (col.id === 'c1' && A.adim <= 2) || (col.id === 'c2' && A.adim === 3) || (col.id === 'c3' && A.adim === 4);
  if (v === '-' && !aktif) return `<span class="sabit">–</span>`;
  if (aktif) return `<input id="${id}" inputmode="numeric" value="${esc2(A.cev[id] ?? '')}" oninput="A.cev['${id}']=this.value" aria-label="sihâm">`;
  return `<span class="sabit">${esc2(v)}</span>`;
}
function ciz() {
  const r = A.r, cols = sutunlar(), sat = r.satir;
  const aktifId = A.adim <= 2 ? 'c1' : A.adim === 3 ? 'c2' : A.adim === 4 ? 'c3' : '';
  const span = cols.map(c => { const sp = {}; let top = -1; if (A.adim <= ({c1: 2, c2: 3, c3: 4})[c.id]) return sp; sat.forEach((s, i) => { if (c.v(s) === '^' && top >= 0) { sp[top] = (sp[top] || 1) + 1; sp[i] = 0; } else top = i; }); return sp; });
  const cl = (id) => A.ok[id] === true ? 'dogru' : A.ok[id] === false ? 'yanlis' : '';
  const ters = [...cols.keys()].reverse();
  const mh = c => {
    const id = c.id + '-m', aktif = (c.id === 'c1' && A.adim <= 2) || (c.id === 'c2' && A.adim === 3) || (c.id === 'c3' && A.adim === 4);
    let ic = aktif ? `<input id="${id}" inputmode="numeric" value="${esc2(A.cev[id] ?? '')}" oninput="A.cev['${id}']=this.value" aria-label="mahreç">` : (A.adim > (c.id === 'c1' ? 2 : c.id === 'c2' ? 3 : 4) ? `<b>${c.m}</b>` : '');
    if (c.id === 'c1' && r.tur === 'avliye' && (A.adim > 3 || (A.adim === 3 && A.tur === 'avliye'))) {
      const aid = 'avl-m';
