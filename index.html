olmalı,"},{"k":"n","n":4,"x":"Öz kardeş olmalı."},{"k":"ar","a":"أَسْمَاؤُهَا: الْيَمِّيَّةُ، وَالْحَجَرِيَّةُ، وَالْحِمَارِيَّةُ","x":""},{"k":"ar","a":"سَبَبُ التَّسْمِيَةِ: قَوْلُ الْإِخْوَةِ الْأَشِقَّاءِ لِعُمَرَ: هَبْ أَنَّ أَبَانَا حَجَرًا فِي الْيَمِّ أَوْ حِمَارًا، أَلَسْنَا أَبْنَاءَ أُمٍّ وَاحِدَةٍ؟ فَأَفْتَى عُمَرُ بْنُ الْخَطَّابِ بَعْدَ ذَلِكَ بِتَشْرِيكِ الثُّلُثِ بَيْنَ الْإِخْوَةِ لِأُمٍّ وَبَيْنَ الْإِخْوَةِ الْأَشِقَّاءِ، وَوَافَقَهُ زَيْدُ بْنُ ثَابِتٍ","x":""},{"k":"ar","a":"شُرُوطُهَا: ١- أَنْ يَكُونَ أَوْلَادُ الْأُمِّ اثْنَيْنِ فَأَكْثَرَ. ٢- أَنْ يَكُونَ فِي الْمَسْأَلَةِ أُمٌّ أَوْ جَدَّةٌ. ٣- أَنْ يَكُونَ بَيْنَ الْأَشِقَّاءِ ذَكَرٌ، فَلَوْ كَانُوا إِنَاثًا وَرِثْنَ بِالْفَرْضِ وَبَطَلَ الِاشْتِرَاكُ. ٤- أَنْ يَكُونَ فِي الْمَسْأَلَةِ الزَّوْجُ","x":""},{"k":"d","t":"Müştereke (Yemmiyye, Haceriyye, Himâriyye)","x":"Koca, anne veya nene, birden fazla anne bir kardeş ve öz erkek kardeşin bulunduğu mesele. Hz. Ömer önce öz kardeşi asabe yaptı (ona bir şey kalmadı), itiraz üzerine üçte birde ortak etti."}]}],"ht":[{"s":0,"x":"Baba: erkek fürû ile 1/6; yalnız kız fürû ile 1/6 + kalan; fürû yoksa asabe olarak kalanın tamamı."},{"s":1,"x":"Dedenin ilk üç hali babanınki gibidir; dördüncü hali: baba ile mahcub olur. Uzak dede yakın dede ile düşer."},{"s":2,"x":"Koca: fürû yoksa 1/2, fürû varsa 1/4. Yalnız farz ile varis olur."},{"s":3,"x":"Karı: fürû yoksa 1/4, fürû varsa 1/8; birden fazla karı bu payı eşit paylaşır."},{"s":3,"x":"Ölüm hastalığında bâin talakla boşanan kadın: Şâfiî’ye göre varis olmaz; Hanefî’ye göre iddet içinde, Hanbelî’ye göre evlenmedikçe, Mâlikî’ye göre evlense bile varis olur."},{"s":4,"x":"Anne bir kardeşler: tek ise 1/6, birden fazla ise 1/3 (erkek-kız eşit); fürû (mutlak) ve erkek usul (baba, dede) ile düşer."},{"s":4,"x":"Anne ile düşmezler (vasıta kaidesinin istisnası); kadın vasıtasıyla ulaştıkları halde varis olurlar; kız ile düşerler."},{"s":5,"x":"Müştereke: Hanefî ve Hanbelîlere göre öz kardeş asabedir ve bir şey alamaz; Şâfiî ve Mâlikîlere göre anne bir kardeşlerle 1/3’te eşit ortak olur."},{"s":5,"x":"Müşterekenin 4 şartı: koca, anne veya nene, iki veya daha fazla anne bir kardeş, öz kardeşler arasında bir erkek."}],"oz":null},{"t":"Kırk Hal (2): Anne, Nene, Kız Kardeşler, Kız ve Oğlun Kızı","intro":"Annenin üç hali ve Ömeriyye (Ğarrâveyn) meselesi; sahih ve fasid nene ve neneyi hacbeden kaideler; öz ve baba bir kız kardeşlerin halleri; kız, oğlun kızı ve tekmiletü’s-sülüseyn.","s":[{"h":"Anne","b":[{"k":"n","n":1,"x":"Fürû veya birden fazla kardeş varsa 1/6 alır. «السُّدُسُ مَعَ وُجُودِ الْفَرْعِ أَوْ تَعَدُّدِ الْإِخْوَةِ»"},{"k":"p","x":"Ölen kişinin fürûu varsa anne 1/6 alır. Aynı şekilde ölen kişinin birden fazla kardeşi varsa anne 1/6 alır. Bu kardeşlerin erkek veya kız olması, anne bir, baba bir veya anne baba bir olmaları arasında bir fark yoktur. Hatta bu birden fazla kardeş bir meselede mahcub olsa dahi yine de annenin payını 1/6'ya düşürürler. Ancak mahrum olsalar payı etkilemezler."},{"k":"n","n":2,"x":"Fürû veya birden fazla kardeş yoksa 1/3 alır. «الثُّلُثُ مَعَ عَدَمِ وُجُودِ الْفَرْعِ أَوْ تَعَدُّدِ الْإِخْوَةِ»"},{"k":"ar","a":"﴿وَلِأَبَوَيْهِ لِكُلِّ وَاحِدٍ مِنْهُمَا السُّدُسُ مِمَّا تَرَكَ إِنْ كَانَ لَهُ وَلَدٌ فَإِنْ لَمْ يَكُنْ لَهُ وَلَدٌ وَوَرِثَهُ أَبَوَاهُ فَلِأُمِّهِ الثُّلُثُ فَإِنْ كَانَ لَهُ إِخْوَةٌ فَلِأُمِّهِ السُّدُسُ﴾","x":"Delil"},{"k":"n","n":3,"x":"Anne, baba ve eş ile bir arada bulunursa kalanın 1/3'ünü alır. «ثُلُثُ الْبَاقِي مَعَ وُجُودِ الْأَبِ وَالزَّوْجِ أَوِ الزَّوْجَةِ»"},{"k":"p","x":"Bir meselede anne baba artı karı veya kocadan biri bulunursa anne kalanın 1/3'ünü alır. Mesele çözülürken önce eşe payı verilir. Eşin payı verildikten sonra geriye kalanın üçte biri anneye verilir."},{"k":"ms","m":["6"],"t":"","top":[],"r":[{"v":"زوج","p":"1/2","s":["3"],"tl":""},{"v":"أم","p":"1/3","s":["2"],"tl":""},{"v":"عم","p":"ع","s":["1"],"tl":""}],"alt":[],"c":""},{"k":"ms","m":["6"],"t":"","top":[],"r":[{"v":"أم","p":"1/6","s":["1"],"tl":""},{"v":"أب","p":"1/6+ع","s":["1+1"],"tl":""},{"v":"بنت","p":"1/2","s":["3"],"tl":""}],"alt":[],"c":""},{"k":"ms","m":["6"],"t":"","top":[],"r":[{"v":"أم","p":"1/6","s":["1"],"tl":""},{"v":"ابن","p":"ع","s":["5"],"tl":""}],"alt":[],"c":""}]},{"h":"Ömeriyye (Ğarrâveyn) Meselesi","b":[{"k":"p","x":"Annenin bu üçüncü haline «غَرَّاوَيْن» veya «عُمَرِيَّتَيْن» denir. Bu şekilde isimlendirilmesinin sebebi Hz. Ömer'in bu meselede bu şekilde hüküm vermesindendir."},{"k":"p","x":"Bir meselenin Ömeriyye olabilmesi için o meselede anne baba artı eşlerden birinin olması gerekir. Bu da baba ile dede arasındaki farklardan bir tanesidir. Zira bir meselede dede artı anne ve eşlerden birisi olursa bütün fakihlere göre bu mesele Ömeriyye meselesi olmaz. Sadece İbn Mes'ûd ve Hanefilerden Ebû Yûsuf bu konuda dedeyi de baba gibi görmüştür. Yani bir meselede dede ve anne eşlerden birisi ile bulunursa bu mesele Ömeriyye olur."},{"k":"p","x":"İbn Kudâme'ye göre Hz. Ömer'in bu ictihadına Osman b. Affân, Zeyd b. Sâbit, İbn Mes'ûd, Hz. Ali, Hz. Hasan, Süfyân es-Sevrî, İmam Mâlik ve İmam Şâfiî tâbi olmuştur. Ancak İbn Abbas her iki meselede de anneye üçte birin tamamını vermiştir. Zira ona göre Allah Kur’an-ı Kerim'de çocuk ve birden fazla kardeş olmayınca anneye 1/3 vermiştir. Burada da çocuk ve birden fazla kardeş yoktur. Dolayısıyla anneye 1/3 verilmelidir."},{"k":"ar","a":"قَالَ ابْنُ قُدَامَةَ رَحِمَهُ اللَّهُ: هَاتَانِ الْمَسْأَلَتَانِ تُسَمَّيَانِ الْعُمَرِيَّتَيْنِ، لِأَنَّ عُمَرَ بْنَ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُ قَضَى فِيهِمَا بِهَذَا الْقَضَاءِ، فَتَبِعَهُ فِي ذَلِكَ عُثْمَانُ بْنُ عَفَّانَ، وَزَيْدُ بْنُ ثَابِتٍ، وَابْنُ مَسْعُودٍ، وَرُوِيَ ذَلِكَ عَنْ عَلِيٍّ، وَبِهِ قَالَ الْحَسَنُ، وَالثَّوْرِيُّ، وَمَالِكٌ، وَالشَّافِعِيُّ رَضِيَ اللَّهُ عَنْهُمْ، وَأَصْحَابُ الرَّأْيِ. وَجَعَلَ ابْنُ عَبَّاسٍ ثُلُثَ الْمَالِ كُلِّهِ لِلْأُمِّ فِي الْمَسْأَلَتَيْنِ، لِأَنَّ اللَّهَ تَعَالَى فَرَضَ لَهَا الثُّلُثَ عِنْدَ عَدَمِ الْوَلَدِ وَالْإِخْوَةِ، وَلَيْسَ هَاهُنَا وَلَدٌ وَلَا إِخْوَةٌ","x":""},{"k":"ar","a":"وَخُلَاصَةُ الْأَمْرِ: أَنَّ جُمْهُورَ الصَّحَابَةِ وَالْفُقَهَاءِ لَمْ يَجْعَلُوا الْجَدَّ فِي مَقَامِ الْأَبِ فِي الْغَرَّاوَيْنِ إِلَّا عِنْدَ ابْنِ مَسْعُودٍ وَأَبِي يُوسُفَ صَاحِبِ أَبِي حَنِيفَةَ رَحِمَهُمَا اللَّهُ","x":""},{"k":"d","t":"Ömeriyye / Ğarrâveyn «الْعُمَرِيَّتَان / الْغَرَّاوَان»","x":"Anne ve babanın eşlerden biriyle (karı veya koca) bulunduğu iki mesele: anne, eşe payı verildikten sonra kalanın üçte birini alır. Hz. Ömer böyle hükmettiği için bu adı almıştır."},{"k":"not","x":"Ömeriyye meselesi iki şekilde bozulur: 1. Ölenin fürûu varsa, 2. Birden fazla kardeş varsa."},{"k":"ms","m":["6"],"t":"","top":[],"r":[{"v":"زوج","p":"1/2","s":["3"],"tl":""},{"v":"أب","p":"ع","s":["2"],"tl":""},{"v":"أم","p":"1/3 الباقي","s":["1"],"tl":""}],"alt":[],"c":"Çözüm: Bu mesele Ömeriyye/Ğarrâviyyedir. Anne-baba artı eş olduğu için anne kalanın 1/3’ünü alır. Mesele çözülürken evvela kocanın sehmi olan üçü kocaya veririz. Geriye kalan üçün 1/3’ünü ise anneye veririz. Anne 1/3’ünü aldıktan sonra kalanı asabe olan babaya veririz."},{"k":"ms","m":["12"],"t":"","top":[],"r":[{"v":"زوجة","p":"1/4","s":["3"],"tl":""},{"v":"أخت لأم (3)","p":"م","s":["-"],"tl":""},{"v":"أب","p":"ع","s":["7"],"tl":""},{"v":"أم","p":"1/6","s":["2"],"tl":""}],"alt":[],"c":"Burada kardeşlerin sayısı birden fazla olduğu için mahcub olmalarına rağmen annenin payını etkileyip 1/3’ten 1/6’ya düşürdüler."}]},{"h":"Nene","b":[{"k":"p","x":"İslam miras hukukunda cedde ikiye ayrılır: sahih cedde, fasid cedde."},{"k":"d","t":"Sahih cedde «الْجَدَّةُ الصَّحِيحَة»","x":"Kendisi ile ölen kişi arasına fasid ceddin girmediği nenedir."},{"k":"d","t":"Fasid cedde «الْجَدَّةُ الْفَاسِدَة»","x":"Kendisiyle ölen kişi arasına fasid ceddin girdiği nenedir. Zevi'l-erhamdandır."},{"k":"p","x":"Daha açık bir ifade ile belirtmek gerekirse vefat eden kişinin annesinin babası fasid dededir. Yani zevi'l-erham'dan olduğu için mirastan pay almaz. Bu fasid ceddin annesi ise fasid cedde olur. Bundan sonra ölüye fasid cedde aracılığıyla ulaşan bütün neneler fasid cedde olurlar."},{"k":"ar","a":"الْجَدَّةُ تَنْقَسِمُ إِلَى قِسْمَيْنِ: الْجَدَّةُ الصَّحِيحَةُ وَالْجَدَّةُ الْفَاسِدَةُ. الْجَدَّةُ الصَّحِيحَةُ: كُلُّ أُمٍّ تُدْلِي إِلَى الْمَيِّتِ بِوَاسِطَةِ الْأُمِّ أَوِ الْأَبِ، وَالْجَدَّةُ الْفَاسِدَةُ هِيَ كُلُّ أُمٍّ تُدْلِي إِلَى الْمَيِّتِ بِوَاسِطَةِ ذَكَرٍ بَيْنَ أُنْثَيَيْنِ، وَبِعِبَارَةٍ أُخْرَى الْجَدَّةُ الْفَاسِدَةُ هِيَ كُلُّ أُمٍّ تُدْلِي إِلَى الْمَيِّتِ بِوَاسِطَةِ الْجَدِّ الْفَاسِدِ","x":""},{"k":"p","x":"Konunun daha iyi anlaşılabilmesi için şöyle bir tablo çizebiliriz: anne tarafında fasid dede (annenin babası, «أب الأم») vasıtasıyla ölüye ulaşan anne fasid nenedir."},{"k":"tbl","r":[["Taraf","Nene","Ölüye kimin vasıtasıyla ulaşır","Hükmü"],["**Anne tarafı** «جهة الأم»","«أم الأم» (anneanne)","Anne","Sahih"],["","«أم أم الأم»","Anneanne","Sahih"],["","«أم أب الأم»","Fasid dede (annenin babası)","Fasid"],["**Baba tarafı** «جهة الأب»","«أم الأب» (babaanne)","Baba","Sahih"],["","«أم أم الأب»","Babaanne","Sahih"],["","«أم أب الأب»","Dede (babanın babası)","Sahih"]]},{"k":"h","x":"Sahih nenenin halleri"},{"k":"n","n":1,"x":"Hacbeden yoksa 1/6 alır. «السُّدُسُ إِنْ لَمْ تُحْجَبْ»"},{"k":"n","n":2,"x":"Mahcub olur. «الْحَجْبُ»"},{"k":"p","x":"Delil: «السُّنَّةُ وَالْإِجْمَاعُ»"},{"k":"ar","a":"حَدِيثُ قَبِيصَةَ بْنِ ذُؤَيْبٍ قَالَ: جَاءَتِ الْجَدَّةُ إِلَى أَبِي بَكْرٍ رَضِيَ اللَّهُ عَنْهُ تَسْأَلُهُ عَنْ مِيرَاثِهَا، فَقَالَ: «مَا لَكِ فِي كِتَابِ اللَّهِ شَيْءٌ، وَمَا عَلِمْتُ لَكِ فِي سُنَّةِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ شَيْئًا، فَارْجِعِي حَتَّى أَسْأَلَ النَّاسَ»، فَسَأَلَ، فَقَالَ الْمُغِيرَةُ بْنُ شُعْبَةَ: شَهِدْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَعْطَاهَا السُّدُسَ، فَقَالَ: هَلْ مَعَكَ غَيْرُكَ؟ فَقَامَ مُحَمَّدُ بْنُ مَسْلَمَةَ فَقَالَ مِثْلَهُ، فَأَنْفَذَهُ لَهَا أَبُو بَكْرٍ. ثُمَّ جَاءَتِ الْجَدَّةُ الْأُخْرَى إِلَى عُمَرَ رَضِيَ اللَّهُ عَنْهُ تَسْأَلُهُ، فَقَالَ: «مَا لَكِ فِي كِتَابِ اللَّهِ شَيْءٌ، وَمَا كَانَ الْقَضَاءُ الَّذِي قُضِيَ بِهِ إِلَّا لِغَيْرِكِ، وَمَا أَنَا بِزَائِدٍ فِي الْفَرَائِضِ شَيْئًا، وَلَكِنْ هُوَ ذَلِكَ السُّدُسُ، فَإِنِ اجْتَمَعْتُمَا فَهُوَ بَيْنَكُمَا، وَأَيَّتُكُمَا خَلَتْ بِهِ فَهُوَ لَهَا»","x":""},{"k":"ar","a":"وَقَدْ رَوَى ابْنُ بُرَيْدَةَ عَنْ أَبِيهِ أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ جَعَلَ لِلْجَدَّةِ السُّدُسَ إِذَا لَمْ يَكُنْ دُونَهَا أُمٌّ، وَهَذَا يَدُلُّ عَلَى أَنَّهَا لَا تَرِثُ مَعَهَا شَيْئًا، وَلِأَنَّ الْجَدَّةَ تُدْلِي بِالْأُمِّ فَسَقَطَتْ بِهَا كَسُقُوطِ الْجَدِّ بِالْأَبِ وَابْنِ الِابْنِ بِهِ","x":""},{"k":"h","x":"Nenenin mahcub olması ile ilgili kaideler «الْقَوَاعِدُ لِحَجْبِ الْجَدَّة»"},{"k":"h5","x":"A. İttifak edilen kaideler «مَا اتُّفِقَ عَلَيْهَا الْمَذَاهِبُ»"},{"k":"n","n":1,"x":"Anne bütün neneleri hacbeder. «الْأُمُّ تَحْجُبُ كُلَّ الْجَدَّاتِ»"},{"k":"n","n":2,"x":"Anne tarafından yakın nene uzak neneyi hacbeder. «الْقَرِيبَةُ مِنْ جِهَةِ الْأُمِّ تَحْجُبُ الْبَعِيدَةَ مُطْلَقًا»"},{"k":"h5","x":"B. İhtilaf edilen kaideler «مَا اخْتُلِفَ فِيهَا»"},{"k":"n","n":1,"x":"Cumhura göre baba bütün neneleri hacbeder. Hanbelilere göre baba kendi annesini hacbetmez. Hanbelilere göre baba nasıl ki dört mezhebe göre anneanneyi hacbetmiyorsa aynı şekilde kendi annesini de hacbetmemesi lazım. «الْأَبُ يَحْجُبُ كُلَّ الْجَدَّاتِ عِنْدَ الْجُمْهُورِ، وَأَمَّا عِنْدَ الْحَنَابِلَةِ الْأَبُ لَا يَحْجُبُ أُمَّهُ»"},{"k":"n","n":2,"x":"Hanefi ve Hanbeli mezhebine göre baba tarafından yakın olan nene, anne tarafından uzak olan neneyi hacbeder. Maliki ve Şafiilere göre ise hacbetmez, 1/6'da ortak olurlar. «الْجَدَّةُ الْقَرِيبَةُ مِنْ جِهَةِ الْأَبِ تَحْجُبُ الْجَدَّةَ الْبَعِيدَةَ مِنْ جِهَةِ الْأُمِّ عِنْدَ الْحَنَفِيَّةِ وَالْحَنَابِلَةِ، وَتَكُونَانِ مُشْتَرِكَتَيْنِ فِي السُّدُسِ عِنْدَ الشَّافِعِيَّةِ وَالْمَالِكِيَّةِ»"},{"k":"n","n":3,"x":"Hanefi ve Şafii mezhebine göre yukarıya doğru çıktıkça hangi derecede olursa olsun bütün neneler varis olurlar. Hanbeli mezhebine göre sad  فِي مَجْمُوعِ السِّهَامِ الْمَفْرُوضَةِ عَنْ أَصْلِ الْمَسْأَلَةِ، وَنَقْصٌ فِي نَصِيبِ الْوَرَثَةِ","x":""},{"k":"ms","m":["6 → 7"],"t":"","top":[],"r":[{"v":"زوج","p":"1/2","s":["3"],"tl":""},{"v":"أخت ش (2)","p":"2/3","s":["4"],"tl":""}],"alt":[],"c":"Koca malın 6'da üçünü alacakken 7'de 3'ünü alıyor. Aynı şekilde kız kardeşler de malın 6'da 4'ünü alacakken 7'de 4'ünü alıyor. Yani mesele avliye olunca bütün ashâb-ı ferâizin payı azalıyor."}]},{"h":"Avliyenin Sübutu","b":[{"k":"p","x":"Avliyenin sübutu konusunda iki görüş vardır:"},{"k":"h","x":"1. Cumhurun görüşü"},{"k":"p","x":"İbn Abbas dışındaki sahabelerin tamamı, 4 mezhep imamları, İbn Teymiyye, İbn Kayyim ve alimlerin kâhir ekseriyetine göre avl vardır. Yani mesele avl olunca ashâb-ı ferâizden her birinin sihamı kendi farzı nispetinde azalır."},{"k":"h","x":"2. İbn Abbas’ın görüşü"},{"k":"p","x":"İbn Abbas, Dâvûd ez-Zâhirî, Saîd b. Müseyyeb ve İbn Hazm gibi bazı alimlere göre “avl” yoktur. Böyle bir mesele gelince önce ashâb-ı ferâizden kuvvetli olanlar kendi paylarını alırlar. Ashâb-ı ferâizden zayıf olanlar ise kalanı alırlar. Böylelikle mesele avl olmaktan çıkar."},{"k":"li","x":"Ashâb-ı ferâizden kuvvetli olanlar asabe olmayıp her zaman ashâb-ı ferâiz olanlardır. (karı, koca, anne, nene)"},{"k":"li","x":"Ashâb-ı ferâizden zayıf olanlar ise bazen ashâb-ı ferâiz bazen de asabe bi-gayrihi olanlardır. (kız, oğlun kızı, öz kız kardeş ve baba bir kız kardeş)"},{"k":"ms","m":["6 → 7"],"t":"Cumhur","top":[],"r":[{"v":"زوج","p":"1/2","s":["3"],"tl":""},{"v":"أخت ش (2)","p":"2/3","s":["4"],"tl":""}],"alt":[],"c":"Cumhura göre bu meselede avl vardır. Dolayısıyla ashâb-ı ferâizden olan koca ve kız kardeşlerin sihamları azaldı."},{"k":"ms","m":["2","4"],"t":"İbn Abbas","top":["2"],"r":[{"v":"زوج","p":"1/2","s":["1","2"],"tl":""},{"v":"أخت ش (2)","p":"الباقي","s":["1","2"],"tl":""}],"alt":[],"c":"İbn Abbas’a göre avl olmadığı için önce ashâb-ı ferâizden kuvvetli olana kendi payını verdikten sonra kalanı ashâb-ı ferâizden zayıf olana verdi. Kız kardeşleri asabe gibi değerlendirip onlara kalanı verdiği için mesele avl olmaktan çıktı."},{"k":"sc","q":"Avliye meselesi ilk olarak ne zaman vuku bulmuştur?","x":"Hz. Peygamber ve Hz. Ebûbekir döneminde avl meselesi vuku bulmamıştı. Avl meselesi ilk defa Hz. Ömer döneminde vuku bulmuştur. Birinin vefat ettiği ve geriye sadece kocası ve iki kız kardeşini bıraktığı bir mesele sorulunca Hz. Ömer sahabelerle istişare etti ve avl yaptı. Bütün sahabeler ve sonra gelen alimler Hz. Ömer'in bu görüşü ile amel ettiler. İbn Abbas ise Hz. Ömer'in vefatından sonra ona muhalefet etti."},{"k":"p","x":"Hz. Ömer ile İbn Abbas arasında pratikte şu ihtilaf vardır: Hz. Ömer, payların toplamı mahreçten yüksek çıkıp ashâb-ı ferâizin sihamları azalınca bu azalmayı bütün ashâb-ı ferâize yayıyor. İbn Abbas ise kuvvetli olan ashâb-ı ferâiz ile zayıf olan ashâb-ı ferâiz arasında bir fark koyarak pay azalma faturasını sadece zayıf ashâb-ı ferâize kesiyor."},{"k":"ar","a":"قَالَ ابْنُ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا: أَوَّلُ مَنْ أَعَالَ الْفَرَائِضَ عُمَرُ رَضِيَ اللَّهُ عَنْهُ، لَمَّا الْتَوَتْ (أَيْ كَثُرَتْ) عَلَيْهِ الْفَرَائِضُ وَدَافَعَ بَعْضُهَا بَعْضًا، فَقَالَ رَضِيَ اللَّهُ عَنْهُ: لَا أَدْرِي أَيُّكُمْ قَدَّمَ اللَّهُ وَلَا أَيُّكُمْ أَخَّرَ، وَكَانَ امْرَأً وَرِعًا، فَقَالَ: مَا أَجِدُ شَيْئًا أَوْسَعَ لِي مِنْ أَنْ أَقْسِمَ التَّرِكَةَ عَلَيْكُمْ بِالْحِصَصِ وَأُدْخِلَ عَلَى كُلِّ ذِي حَقٍّ مَا دَخَلَ مِنْ عَوْلِ الْفَرِيضَةِ، وَكَانَ عُمَرُ أَوَّلَ مَنْ أَعَالَ الْمَسَائِلَ","x":""},{"k":"tbl","r":[["","Cumhur (Hz. Ömer)","İbn Abbas"],["**Avl var mı?**","Var","Yok"],["**Eksiklik kime?**","Bütün ashâb-ı ferâize, farzları nispetinde","Yalnız zayıf ashâb-ı ferâize (kız, oğlun kızı, öz ve baba bir kız kardeş)"],["**Kuvvetliler**","—","Karı, koca, anne, nene: paylarını tam alır"]]}]},{"h":"Avledebilen Mahreçler","b":[{"k":"sc","q":"Meseleler kaçtan kaça avledebilir?","x":"[[Meselelerin asılları (mahreçleri) 1, 2, 3, 4, 6, 8, 12, 24'tür. Bunlardan yalnız 6, 12 ve 24 avleder: 6 → 7, 8, 9, 10; 12 → 13, 15, 17; 24 → 27.]]"},{"k":"ar","a":"أُصُولُ الْمَسَائِلِ: ١-٢-٣-٤-٦-٨-١٢-٢٤. ٦ تَعُولُ إِلَى: ٧، ٨، ٩، ١٠. ١٢ تَعُولُ إِلَى: ١٣، ١٥، ١٧. ٢٤ تَعُولُ إِلَى: ٢٧","x":""},{"k":"tbl","r":[["Mahreç","Avledebileceği sayılar"],["**6**","7, 8, 9, 10"],["**12**","13, 15, 17"],["**24**","27"],["**1, 2, 3, 4, 8**","Avletmez"]]}]},{"h":"Avliye Misalleri","b":[{"k":"h","x":"Alıştırmalar"},{"k":"al","v":"زوج ، أخت ش ، أخت لأب","n":""},{"k":"al","v":"زوج ، أخت ش ، أخت لأب ، أم","n":""},{"k":"al","v":"زوج ، أخت ش ، أخت لأب ، أخت لأم ، أم","n":""},{"k":"al","v":"زوج ، بنت (2) ، أم ، أب","n":""},{"k":"al","v":"زوج ، بنت (2) ، أم","n":""},{"k":"al","v":"زوج ، أخت ش ، أخت لأب ، أخت لأم (2) ، أم","n":""},{"k":"al","v":"زوجة ، أخت ش (2) ، أخ لأم (2) ، أم","n":""},{"k":"al","v":"زوجة ، أب ، أم ، بنت (2)","n":""},{"k":"h","x":"Mübâhale meselesi"},{"k":"al","v":"زوج ، أخت ش ، أم","n":"Cumhura ve İbn Abbas'a göre ayrı ayrı çözün."},{"k":"d","t":"Mübâhale meselesi «الْمَسْأَلَةُ الْمُبَاهَلَة»","x":"Koca, öz kız kardeş ve anne meselesi. İbn Abbas bu meselenin (avlsiz) kendi yöntemiyle çözüleceğini iddia etmiş ve meydan okumuştur. Hiç kimse bu konuda kendi karşısına çıkmamıştır."},{"k":"h","x":"Ümmü’l-ferûh"},{"k":"al","v":"زوج ، أم ، أخت ش (2) ، أخت لأم (2)","n":""},{"k":"d","t":"Ümmü’l-ferûh «أُمُّ الْفُرُوخ»","x":"Koca, anne, iki öz kız kardeş ve iki anne bir kız kardeş meselesi. Avliye meselelerinin çoğu bu şekilde gelmektedir. «فُرُوخ» civcivler, «أُمُّ الْفُرُوخ» ise tavuk demektir. Avliye konusunda çok sık karşılaşılan bir mesele olduğu için etrafındaki civcivlerle beraber gelen tavuğa benzetilmiştir."},{"k":"h","x":"Ümmü’l-erâmil"},{"k":"al","v":"جدة (2) ، زوجة (3) ، أخت لأم (4) ، أخت ش (8)","n":""},{"k":"d","t":"Ümmü’l-erâmil / Ümmü’l-benât «أُمُّ الْأَرَامِلِ أَوْ أُمُّ الْبَنَات»","x":"İki nene, üç karı, dört anne bir kız kardeş ve sekiz öz kız kardeş meselesi. Bütün varisler kadın olduğu için bu ad verilmiştir."}]},{"h":"Reddiyenin Tanımı ve Rükünleri","b":[{"k":"p","x":"Kelime manası: “Red” kelime olarak dönmek, rücû etmek anlamına gelir."},{"k":"d","t":"Reddiye","x":"Sihamların toplamının mahreçten az olması sebebiyle ashâb-ı ferâizden her birinin payının artmasıdır. «النَّقْصُ مِنْ مَجْمُوعِ السِّهَامِ مِمَّا يُؤَدِّي إِلَى زِيَادَةِ نَصِيبِ كُلِّ وَاحِدٍ مِنَ الْوَرَثَةِ»"},{"k":"h","x":"Rükünleri"},{"k":"n","n":1,"x":"Taksimattan sonra malın bir kısmının artması. «وُجُودُ فَائِضٍ مِنَ التَّرِكَةِ»"},{"k":"n","n":2,"x":"Ashâb-ı ferâizin bulunması. «وُجُودُ صَاحِبِ الْفَرْضِ»"},{"k":"n","n":3,"x":"Asabenin olmaması. «عَدَمُ وُجُودِ الْعَصَبَةِ»"},{"k":"h","x":"Mezheplerin reddiye hakkındaki görüşleri"},{"k":"n","n":1,"x":"Red yoktur. Artan mal beytülmâle verilir. Bu mütekaddimûn dönemi Şâfiî ve Mâlikîlerin görüşüdür."},{"k":"n","n":2,"x":"Red vardır. Yani taksimattan sonra artan para ashâb-ı ferâize dağıtılır."},{"k":"sc","q":"Mesele red olunca artan para kime dağıtılır? «مَنِ الَّذِي يُرَدُّ عَلَيْهِمْ»","x":"Toplam 12 ashâb-ı ferâiz vardır. Bunlardan karı ve kocanın meyyit ile alakası sebebiyyet (nikâh bağı) olduğu için ikisini çıkarttık. Baba ve dedenin de asabelik yönü olduğu için onlar da istisna edildi. Zaten bir meselede asabe varsa veya baba ve dede herhangi bir durumda ise o meselenin reddiye olması imkansızdır. Geriye 8 sınıf kaldı."},{"k":"ar","a":"١- بِنْت، ٢- بِنْتُ ابْن، ٣- أُخْتٌ شَقِيقَة، ٤- أُخْتٌ لِأَب، ٥- أُخْتٌ لِأُمّ، ٦- أَخٌ لِأُمّ، ٧- أُمّ، ٨- جَدَّة","x":"Red yapılan 8 sınıf"}]},{"h":"Reddiyenin Kısımları ve Çözümü","b":[{"k":"p","x":"Reddiye meselelerinin çözümü reddiyenin kısımlarına göre değişmektedir. Her bir kısmın çözüm şekli farklıdır. Öyleyse evvela reddiyenin kısımlarını ele alalım:"},{"k":"tbl","r":[["«أنواع الرد»","Tek farz «مع فرض واحد»","Birden fazla farz «مع فروض متعددة»"],["**Eşlerden biri yok** «بدون الزوجين»","1. kısım","2. kısım"],["**Eşlerden biri var** «مع وجود أحد الزوجين»","3. kısım","4. kısım"]]},{"k":"h","x":"1. Kısım: eşler olmadan tek farz"},{"k":"ar","a":"النَّوْعُ الْأَوَّلُ: بِدُونِ الزَّوْجَيْنِ مَعَ فَرْضٍ وَاحِدٍ. الضَّابِطُ فِيهِ: فِي هَذِهِ الْحَالَةِ مَجْمُوعُ السِّهَامِ هُوَ أَصْلُ الْمَسْأَلَةِ الْجَدِيدُ، وَالْفَائِضُ يُقَسَّمُ عَلَى الْوَرَثَةِ بِحَسَبِ أَنْصِبَائِهِمْ","x":""},{"k":"not","x":"Bu tür meselelerde meselenin aslı aded-i rüûstur."},{"k":"al","v":"أخت لأب","n":""},{"k":"al","v":"أخت ش (7)","n":""},{"k":"al","v":"جدة (2)","n":""},{"k":"al","v":"بنت (3)","n":""},{"k":"al","v":"أخت لأم ، أخ لأم","n":""},{"k":"al","v":"أخ ش ، أخت ش (2)","n":"Bu mesele reddiye değildir."},{"k":"al","v":"أخ ش (5)","n":"Bu mesele reddiye değildir."},{"k":"dikkat","x":"Son iki mesele tıpkı reddiye gibi çözülse de aslında reddiye meseleleri değildirler. Çünkü içerisinde asabe olan bir mesele reddiye olamaz. (Burada sadece aded-i rüûs benzerliği vardır.)"},{"k":"h","x":"2. Kısım: eşler olmadan birden fazla farz"},{"k":"ar","a":"النَّوْعُ الثَّانِي: بِدُونِ الزَّوْجَيْنِ مَعَ فُرُوضٍ مُتَعَدِّدَةٍ. الضَّابِطُ فِيهِ: أَصْلُ الْمَسْأَلَةِ مَجْمُوعُ السِّهَامِ كَمَا يَكُونُ فِي الْعَوْلِ","x":""},{"k":"not","x":"Bu tür meselelerde sihamların toplamı mahreçtir. Tıpkı avliye meselesinde olduğu gibi. Yani aşağıda vereceğimiz misallerde sihamların toplamı ne ise meselenin aslı odur. Bu yüzden murisin geride bıraktığı para sihamların toplamı olan o sayıya bölünür."},{"k":"al","v":"أخت ش ، أخت لأب ، أخ لأم","n":""},{"k":"al","v":"جدة ، أخت لأم","n":""},{"k":"al","v":"بنت ، بنت ابن","n":""},{"k":"h","x":"3. Kısım: eşlerden biri ve tek farz"},{"k":"ar","a":"النَّوْعُ الثَّالِثُ: مَعَ أَحَدِ الزَّوْجَيْنِ وَفَرْضٍ وَاحِدٍ. وَفِيهِ تُؤَصَّلُ الْمَسْأَلَةُ مِنْ فَرْضِ الزَّوْجِيَّةِ، وَيُعْطَى الْمَوْجُودُ مِنَ الزَّوْجَيْنِ سِهَامَهُ، وَمَا بَقِيَ يَأْخُذُهُ صَاحِبُ الرَّدِّ، فَإِنْ كَانَ فَرْدًا يَأْخُذُ الْكُلَّ، وَإِنْ كَانَ صِنْفًا قَاسَمُوهُ بِالسَّوِيَّةِ عَلَى عَدَدِ رُؤُوسِهِمْ","x":""},{"k":"not","x":"Bu tür meselelerde karı/kocanın payı meselenin aslı yapılır. Ona kendi payı verildikten sonra kalan diğerleri arasında paylaştırılır."},{"k":"ms","m":["4"],"t":"","top":[],"r":[{"v":"زوجة","p":"1/4","s":["1"],"tl":""},{"v":"أخ لأم","p":"1/6","s":["3"],"tl":""}],"alt":[],"c":"Çözümü: Bu mesele çözülürken sırasıyla 3 adım izlendi. 1. Karının payı mahreç yapıldı. 2. Karıya kendi sihamı verildi. 3. Geriye kalan ashâb-ı ferâize verildi."},{"k":"ms","m":["2"],"t":"","top":[],"r":[{"v":"زوج","p":"1/2","s":["1"],"tl":""},{"v":"أخ لأم","p":"1/6","s":["1"],"tl":""}],"alt":[],"c":"Çözümü: 1. Kocanın payı mahreç yapıldı. 2. Kocaya kendi sihamı verildi. 3. Geriye kalan ashâb-ı ferâize verildi. Bu üçüncü kısmın altındaki bütün meseleler bu şekilde çözülecektir."},{"k":"ms","m":["6 → 7"],"t":"Doğru: AVLİYE","top":[],"r":[{"v":"زوج","p":"1/2","s":["3"],"tl":""},{"v":"أخت لأب (2)","p":"2/3","s":["4"],"tl":""}],"alt":[],"c":""},{"k":"dikkat","x":"Koca ve iki baba bir kız kardeş meselesini reddiyenin 3. kısmı gibi çözmek (mahreç 2; kocaya 1, kız kardeşlere 1) hatadır. Çünkü bu reddiye değil avliyedir."},{"k":"not","x":"Klasik eserlerde bir meselenin âdile mi, reddiye mi, avliye mi olduğunu ölçmek için genelde şu yöntem kullanılır: Misalen yukarıda kocanın aldığı pay 1/2'dir. 1/2 bir saatin 30 dakikasına tekabül eder. Kız kardeşin aldığı pay ise 2/3'tür. 2/3 ise bir saatin 40 dakikasına tekabül eder. Bu 30 ve 40 dakikaları topladığımız zaman 70 dakika eder. Bu da meselenin avliye olduğunu göstermektedir. Çünkü 70 dakika ölçü olarak aldığımız bir saatten yani 60 dakikadan daha fazladır. Bir nevi payların toplamı mahreci geçmiş oldu."},{"k":"tbl","r":[["Pay","Dakika (bir saat = 60)"],["1/2","30"],["[[1/3]]","[[20]]"],["2/3","40"],["[[1/4]]","[[15]]"],["[[1/6]]","[[10]]"],["[[1/8]]","[[7,5]]"]]},{"k":"al","v":"زوج ، بنت (2)","n":""},{"k":"al","v":"زوجة ، جدة","n":""},{"k":"al","v":"زوجة ، بنت (7)","n":""},{"k":"al","v":"زوج ، جدة","n":""},{"k":"h","x":"4. Kısım: eşlerden biri ve birden fazla farz"},{"k":"p","x":"«النَّوْعُ الرَّابِعُ: مَعَ أَحَدِ الزَّوْجَيْنِ وَفُرُوضٍ مُتَعَدِّدَةٍ». [[Bu kısımda üç sütun açılır: «عمود الكشف» (keşf), «عمود الزوجية» (zevciyye) ve «عمود الرد» (red).]]"},{"k":"ms","m":["12 → 7","4","8"],"t":"","top":[],"r":[{"v":"زوجة","p":"1/4","s":["3","1","2"],"tl":""},{"v":"جدة","p":"1/6","s":["2 → 1","3","3"],"tl":""},{"v":"أخت لأم","p":"1/6","s":["2 → 1","^","3"],"tl":""}],"alt":["عمود الكشف","عمود الزوجية","عمود الرد"],"c":""},{"k":"steps","x":["Amûdu’l-keşfte normal paylar dağıtılır.","Zevceyn dışındaki ashâb-ı ferâizin payları sadeleştirilir [[(2 → 1, 2 → 1; toplamı 2)]].","Amûdu’z-zevciyye bölümünde, tıpkı reddiyenin üçüncü kısmında olduğu gibi karı/kocanın payı olan (4) mahreç yapılır ve karıya kendi sehmi olan (1) verilir. Kalan (3) ise ashâb-ı ferâiz için yazılır.","Amûdu’l-keşfte ashâb-ı ferâizin aldıkları payların sadeleştirilmiş halinin toplamı olan (2), amûdu’z-zevciyyede mahreç olan (4) ve karının payı olan (1) ile çarpılıp amûdu’r-redde yazılır [[(8 ve 2)]].","Amûdu’l-keşfteki ashâb-ı ferâizin paylarının sadeleştirilmiş hali olan 1’ler amûdu’z-zevciyyede dağıtılması gereken sayı olan (3) ile çarpılır ve çıkan sonuç ashâb-ı ferâizin payı olarak amûdu’r-redde yazılır."]},{"k":"ms","m":["24 → 19","8","32"],"t":"","top":[],"r":[{"v":"زوجة","p":"1/8","s":["3","1","4"],"tl":""},{"v":"بنت","p":"1/2","s":["12 → 3","7","21"],"tl":""},{"v":"أم","p":"1/6","s":["4 → 1","^","7"],"tl":""}],"alt":["عمود الكشف","عمود الزوجية","عمود الرد"],"c":"Kısaca çözümü: İlk etapta karı-koca dışındaki ashâb-ı ferâizin payları sadeleştirilir, sonra toplanır ve çıkan sonuç olan (4) bir kenara yazılır. Zevciyye bölümünde karının payı mahreç yapılır ve kendisine siham olarak (1) verildikten sonra geriye kalan (7) diğer ashâb-ı ferâizin tamamı için yazılır. Keşf bölümünde ashâb-ı ferâizin paylarının sadeleştirilmiş halinin toplamı (4), mahreç olan (8) ve karının payı olan (1) ile çarpılır ve red bölümüne yazılır (4 × 8 = 32, 4 × 1 = 4). Daha sonra sırasıyla kızın payı olan (3), (7) ile çarpılıp 21 olarak kıza verildi. Annenin payı olan (1), (7) ile çarpılıp (7) olarak red bölümünde anneye verildi."},{"k":"d","t":"Amûdu’l-keşf «عَمُودُ الْكَشْف»","x":"Reddiyenin 4. kısmında payların normal dağıtıldığı ve eşler dışındakilerin paylarının sadeleştirildiği ilk sütun."},{"k":"d","t":"Amûdu’z-zevciyye «عَمُودُ الزَّوْجِيَّة»","x":"Eşin payının mahreç yapıldığı, eşe sehminin verilip kalanın diğerlerine ayrıldığı ikinci sütun."},{"k":"d","t":"Amûdu’r-red «عَمُودُ الرَّدّ»","x":"Keşf ve zevciyye sütunlarının çarpılmasıyla bulunan son payların yazıldığı sütun."},{"k":"al","v":"زوجة ، أخت لأم (2) ، جدة","n":""},{"k":"al","v":"زوجة ، بنت (2) ، أم","n":""},{"k":"al","v":"زوجة (2) ، بنت ، أم","n":""},{"k":"al","v":"زوج ، بنت ، بنت ابن","n":""}]}],"ht":[{"s":0,"x":"Avl: sihamların toplamı mahreçten fazladır; bütün ashâb-ı ferâizin payı kendi farzı nispetinde azalır (koca+iki öz kız kardeş: 6 → 7)."},{"s":1,"x":"Avl ilk defa Hz. Ömer döneminde (koca ve iki kız kardeş meselesi) vuku buldu; sahabe ittifak etti, İbn Abbas Hz. Ömer’in vefatından sonra muhalefet etti."},{"s":1,"x":"İbn Abbas’a göre avl yoktur: kuvvetliler (karı, koca, anne, nene) tam alır, eksiklik zayıflara (kız, oğlun kızı, kız kardeşler) düşer."},{"s":2,"x":"Mahreçler: 1, 2, 3, 4, 6, 8, 12, 24. Avledenler: 6 (→7, 8, 9, 10), 12 (→13, 15, 17), 24 (→27)."},{"s":3,"x":"Meşhur avliye meseleleri: Mübâhale (koca, öz kız kardeş, anne), Ümmü’l-ferûh (en sık görülen avliye), Ümmü’l-erâmil (bütün varisler kadın)."},{"s":4,"x":"Reddiyenin rükünleri: artan mal, ashâb-ı ferâiz, asabenin yokluğu. Mütekaddimûn Şâfiî ve Mâlikîlere göre red yoktur, artan beytülmâle gider."},{"s":4,"x":"Red yapılan 8 sınıf: kız, oğlun kızı, öz kız kardeş, baba bir kız kardeş, anne bir kız ve erkek kardeş, anne, nene (eşler, baba ve dede hariç)."},{"s":5,"x":"Reddiyenin 4 kısmı: eşsiz tek farz (mahreç = aded-i rüûs), eşsiz çok farz (mahreç = sihamların toplamı), eşli tek farz (mahreç = eşin payı; kalan diğerine), eşli çok farz (keşf, zevciyye ve red sütunları)."},{"s":5,"x":"İçinde asabe olan mesele reddiye olamaz. Âdile, avliye, reddiye tespiti için “bir saat = 60 dakika” ölçüsü: 1/2 = 30, 2/3 = 40 dk; toplam 60’ı geçerse avliye."}],"oz":null},{"t":"Sulh-Tehârüc ve Münâsaha","intro":"Varislerden birinin mal karşılığında mirastan çekilmesinin dört hali ve çözümleri (قبل / بعد / جامعة bölümleri); miras paylaştırılmadan bir varisin de ölmesi (münâsaha) ve üç hali.","s":[{"h":"Sulh ve Tehârüc","b":[{"k":"d","t":"Sulh","x":"Tarafların mirasın belli bir şekilde paylaştırılması üzerine ittifak edip buna razı olmalarıdır. «اتِّفَاقُ الطَّرَفَيْنِ عَلَى تَقْسِيمِ الْمِيرَاثِ بِالرِّضَاءِ»"},{"k":"d","t":"Tehârüc","x":"Varislerden birinin, bir veya birkaç varis lehine mirastan çekilmesidir. «خُرُوجُ أَحَدٍ مِنَ الْوَرَثَةِ مِنَ التَّرِكَةِ لِغَيْرِهِ»"},{"k":"ar","a":"الصُّلْحُ جَائِزٌ بَيْنَ الْمُسْلِمِينَ إِلَّا صُلْحًا أَحَلَّ حَرَامًا أَوْ حَرَّمَ حَلَالًا","x":"Delil: Hazreti Peygamber'in hadisi şerifi"},{"k":"h","x":"Sulhun 4 çeşidi"},{"k":"p","x":"Konunun daha net anlaşılabilmesi için basit bir örnek üzerinden 4 çeşidi kısaca yazalım: Diyelim ki biri vefat etti ve geriye anne, baba ve iki kız, iki erkek olmak üzere 4 çocuk bıraktı. Çocukların ismi Ahmet, Mehmet, Ayşe ve Fatma'dır. Buna göre:"},{"k":"ar","a":"الْحَالُ الْأَوَّلُ: أَنْ يَخْرُجَ أَحَدُ الْوَرَثَةِ عَنْ نَصِيبِهِ لِآخَرَ مُقَابِلَ مَالِ الْوَارِثِ الْخَاصِّ","x":"Birinci hal: Varislerden Ayşe'nin kendi kardeşi Mehmet'in kendisine miras dışından 1000 dolar vermesi karşılığında onun lehine mirastan çekilmesidir. Bir başka ifade ile Ayşe mirastaki kendi payını Mehmet'e bırakıyor. Mehmet de bunun karşılığında kendisine mirasın dışında kendi cebinden bin dolar veriyor."},{"k":"ar","a":"الْحَالُ الثَّانِي: أَنْ يَخْرُجَ أَحَدٌ مِنَ الْوَارِثِينَ عَنْ نَصِيبِهِ لِبَقِيَّةِ الْوَرَثَةِ عَلَى قَدْرِ نَصِيبِهِمْ مُقَابِلَ مَالٍ يَدْفَعُونَهُ مِنْ خَارِجِ التَّرِكَةِ بِمِقْدَارِ نَصِيبِهِمْ","x":"İkinci hal: Varislerden Ayşe'nin, diğer tüm varislerin kendisine mirastaki payları ölçüsüne göre miras dışından mal vermeleri karşılığında hepsinin lehine mirastaki kendi hakkından vazgeçmesidir. Ayşe diyor ki: “Ben mirastaki hakkımı istemiyorum, tüm varisler kendi aralarında paylaşsınlar. Ancak bütün varisler de mirastaki payları ne kadarsa o ölçüde bana miras dışından mal versinler.”"},{"k":"ar","a":"الْحَالُ الثَّالِثُ: أَنْ يَخْرُجَ أَحَدٌ مِنَ الْوَارِثِينَ عَنْ نَصِيبِهِ لِبَاقِي الْوَرَثَةِ بِالتَّسَاوِي مُقَابِلَ مَالٍ مِنْ خَارِجِ التَّرِكَةِ يَدْفَعُونَهُ لَهُ بِالتَّسَاوِي","x":"Üçüncü hal: Varislerden Ayşe'nin diğer tüm varislerin kendisine eşit miktarda miras dışından mal vermeleri karşılığında, hepsinin lehine mirastaki kendi hakkından vazgeçmesidir. Ayşe diyor ki: “Ben mirastaki hakkımı istemiyorum ama tüm varisler mirastaki kendi paylarına bakılmaksızın eşit derecede bana miras dışından mal versinler.”"},{"k":"ar","a":"الْحَالُ الرَّابِعُ: أَنْ يَخْرُجَ أَحَدٌ مِنَ الْوَارِثِينَ عَنْ نَصِيبِهِ لِلْوَرَثَةِ مُقَابِلَ مَالٍ مِنْ نَفْسِ التَّرِكَةِ","x":"Dördüncü hal: Varislerden Ayşe'nin mirasın bizzat kendisinden belli bir şey almak karşılığında tüm varislerin lehine geri kalan mallardan çekilmesidir. Ayşe diyor ki: “Bana sadece şu bir dönüm araziyi verin, geri kalan mallardaki hakkımdan vazgeçiyorum.”"},{"k":"tbl","r":[["Hal","Kimin lehine çekilir","Karşılığı nereden","Nasıl"],["**1**","Bir varis","Miras dışından","O varisin kendi malından"],["**2**","Bütün varisler","Miras dışından","Varislerin payları ölçüsünde"],["**3**","Bütün varisler","Miras dışından","Varislerden eşit olarak"],["**4**","Bütün varisler","Terikenin kendisinden","Belli bir mal"]]},{"k":"dikkat","x":"Sulh/tehârüc ile taraflar arasında yapılan ittifak alışveriştir. Bu yüzden alışverişte hangi durumlar faizi meydana getiriyorsa sulh konusunda da aynı durumların meydana gelmesi halinde yine faiz söz konusu olur. Mesela Ayşe birinci halde olduğu gibi kardeşi Mehmed'in kendisine 1000 dolar vermesi karşılığında mirastaki payından onun lehine çekilmesi aralarında yaptıkları bir alışveriş hükmündedir. Dolayısıyla Ayşe'nin 1000 dolar karşısında vazgeçtiği şey para olmamalı. Aksi takdirde paranın parayla mübadelesi olur ki burada faiz terettüp eder. Aynı şekilde sulh yapılırken faizin söz konusu olmaması için karşılıklı tebâdül edilen mallar aynı cins olmamalı."}]},{"h":"Birinci Halin Çözümü","b":[{"k":"p","x":"«أَنْ يَخْرُجَ أَحَدُ الْوَرَثَةِ عَنْ نَصِيبِهِ لِآخَرَ مُقَابِلَ مَالِ الْوَارِثِ الْخَاصِّ عَنْ خَارِجِ التَّرِكَةِ»"},{"k":"ornek","x":"Ahmet Efendi vefat etti, geriye Yunus, Hamza, Muhsin ve Fatih isimli 4 kardeş bıraktı. Ahmet Efendinin terikesi ise 4 dönüm arsadır. Muhsin kendisine yüz bin lira vermesi karşılığında mirastan Hamza lehine çekiliyor. Bu durumda mesele nasıl çözülür?"},{"k":"ms","m":["4","4"],"t":"","top":[],"r":[{"v":"أخ (يونس)","p":"ع","s":["1","1"],"tl":""},{"v":"أخ (حمزة)","p":"^","s":["1","2"],"tl":""},{"v":"أخ (محسن)","p":"^","s":["1","-"],"tl":""},{"v":"أخ (فاتح)","p":"^","s":["1","1"],"tl":""}],"alt":["قبل","بعد"],"c":""},{"k":"steps","x":["Mesele önce paylar dağıtılmak suretiyle çözülür. Bu ilk bölüme «قبل» denir.","İkinci bölüme «بعد» denir. Bu bölümde önceki mesele aynen yazılır. Sadece mirastan çekilen kişinin sehmi, lehine çekildiği kişiye yazılır. Mahreç aynı şekilde kalır."]},{"k":"p","x":"Yandaki meselede Muhsin'in payı Hamza'ya yazıldı. Bunun karşılığında Hamza Muhsin'e mirasın dışından 100.000 TL verdi."},{"k":"ornek","x":"Şükûfe hanım vefat etti, geriye amca, anne bir kız kardeş, öz kız kardeş, öz erkek kardeş ve koca bıraktı. Öz kız kardeş kendisine mirasın dışından 100 gram altın vermesi karşılığında öz erkek kardeş lehine mirastan çekilmiştir. Bu durumda mesele nasıl çözülür?"},{"k":"ms","m":["6","18","18 → 6"],"t":"","top":["","3",""],"r":[{"v":"زوج","p":"1/2","s":["3","9","9 → 3"],"tl":""},{"v":"أخ ش","p":"ع","s":["2","4","6 → 2"],"tl":""},{"v":"أخت ش","p":"^","s":["^","2","-"],"tl":""},{"v":"أخت لأم","p":"1/6","s":["1","3","3 → 1"],"tl":""},{"v":"عم","p":"م","s":["-","-","-"],"tl":""}],"alt":["","قبل","بعد → اختصار"],"c":""},{"k":"p","x":"Çözümü: Çözüm olarak yukarıdaki meseleden hiçbir farkı yoktur. Ancak bu meselede ekstra tashih ve sadeleştirme yapılması gerekti."},{"k":"steps","x":["Paylar normal bir şekilde dağıtıldı.","Tashih yapıldı (cüz’ü’s-sehm 3). Bu bölüme «قبل» denir.","Daha sonra «بعد» bölümünde mirastaki hakkından vazgeçen kişinin payı, lehine çekildiği kişiye yazıldı.","Sadeleştirme «اختصار» yapıldı."]}]},{"h":"İkinci Halin Çözümü","b":[{"k":"p","x":"«أَنْ يَخْرُجَ أَحَدٌ مِنَ الْوَارِثِينَ عَنْ نَصِيبِهِ لِبَقِيَّةِ الْوَرَثَةِ مُقَابِلَ مَالٍ يَدْفَعُونَهُ لَهُ مِنْ خَارِجِ التَّرِكَةِ بِمِقْدَارِ نَصِيبِهِمْ»"},{"k":"ornek","x":"Ahmet Efendi vefat etti ve geriye 3 oğul 2 kız bıraktı. Fatma isimli kız, varislerin kendisine kendi miktarlarına göre mal vermeleri karşılığında, kendi miras hakkından çekiliyor. Bu durumda mesele nasıl çözülür?"},{"k":"ms","m":["8","7"],"t":"","top":[],"r":[{"v":"ابن (3)","p":"ع","s":["6","6"],"tl":""},{"v":"بنت (فاطمة)","p":"^","s":["1","-"],"tl":""},{"v":"بنت","p":"^","s":["1","1"],"tl":""}],"alt":["قبل","بعد"],"c":""},{"k":"steps","x":["Önce «قبل» bölümünde paylar normal bir şekilde dağıtılır.","Daha sonra «بعد» bölümünde mirastan çekilen kişinin payı çıkartılır. Geriye kalan sihamların toplamı mahreç yapılır."]},{"k":"p","x":"Kısaca ikinci halin çözümü, «بعد» bölümünde sihamların toplamını mahreç yapmaktır."},{"k":"p","x":"Bu meselede diyelim ki vefat eden kişi geriye 8.000 metrekarelik bir arsa bıraktı. Sulh yapılmadan evvel kızlardan Fatma'ya 1000 metrekare arsa düşüyordu. Fatma kendi 1000 metrekarelik arsasından tüm varisler lehine çekildiği için artık 8000 metrekarelik arsayı «بعد» bölümündeki sihamların toplamı olan 7'ye bölüyoruz ve Fatma dışındaki varislere dağıtıyoruz. Daha sonra Fatma dışındaki varislerin tamamı kendi paylarına göre Fatma'ya para vermeleri gerekiyor. Bunun hesaplaması ise şöyle yapılır:"},{"k":"p","x":"Diyelim ki Fatma’nın diğerleri için vazgeçtiği arsanın fiyatı 5 milyon değerindedir. 5 milyon 7'ye bölünür. Çıkan sayı 714.285'tir. Bu sayı 2 ile çarpılınca her bir oğlun Fatma'ya vermesi gereken paradır. 1 ile çarpılınca Fatma'nın kız kardeşinin kendisine vermesi gereken paradır."},{"k":"ornek","x":"«خَرَجَتِ الزَّوْجَةُ عَنْ نَصِيبِهَا لِكُلِّ الْوَرَثَةِ، كَيْ يُعْطِيَ كُلُّ وَاحِدٍ مِنْهُمْ شَيْئًا مِنَ الْمَالِ عَلَى قَدْرِ نَصِيبِهِمْ»"},{"k":"ms","m":["24","21"],"t":"","top":[],"r":[{"v":"زوجة","p":"1/8","s":["3","-"],"tl":""},{"v":"بنت","p":"1/2","s":["12","12"],"tl":""},{"v":"بنت ابن","p":"1/6","s":["4","4"],"tl":""},{"v":"أم","p":"1/6","s":["4","4"],"tl":""},{"v":"عم","p":"ع","s":["1","1"],"tl":""}],"alt":["قبل","بعد"],"c":""},{"k":"steps","x":["Paylar normal dağıtılır.","Daha sonra «بعد» bölümünde ise sihamların toplamı mahreç yapılır."]}]},{"h":"Üçüncü Halin Çözümü","b":[{"k":"p","x":"«أَنْ يَخْرُجَ أَحَدٌ مِنَ الْوَارِثِينَ عَنْ نَصِيبِهِ لِبَاقِي الْوَرَثَةِ مُقَابِلَ مَالٍ مِنْ خَارِجِ التَّرِكَةِ يَدْفَعُونَهُ لَهُ بِالتَّسَاوِي»"},{"k":"ornek","x":"Ahmet Efendi vefat etti ve geriye baba, anne, bir oğul ve iki kız bıraktı. Daha sonra baba, diğer varislerin kendisine kişi başı 100 dolar vermeleri karşılığında mirastaki kendi payından hepsinin lehine feragat etti. Bu durumda mesele nasıl çözülür?"},{"k":"ms","m":["6","4","24"],"t":"","top":["4","1",""],"r":[{"v":"أب","p":"1/6","s":["1","-","-"],"tl":""},{"v":"أم","p":"1/6","s":["1","1","4+1=5"],"tl":""},{"v":"ابن","p":"ع","s":["2","1","8+1=9"],"tl":""},{"v":"بنت","p":"^","s":["1","1","4+1=5"],"tl":""},{"v":"بنت","p":"^","s":["1","1","4+1=5"],"tl":""}],"alt":["قبل","بعد","جامعة"],"c":""},{"k":"steps","x":["Mesele normal bir şekilde paylar dağıtılarak çözülür.","Daha sonra «بعد» bölümünde mirastan çekilen kişi hariç aded-i rüûsun toplamı mahreç yapılır.","Sonra «جامعة» bölümünde ise «بعد» bölümünün mahreci (4) ile «قبل» bölümündeki mirastan çekilen kişinin sehmi (1) arasında münâsahat konusunda olduğu gibi mukarene yapılır (tebâyün). [[«بعد»ün mahreci «قبل»ün üzerine, çekilenin sehmi «بعد»ün üzerine yazılır; çarpımların toplamı «جامعة»ya geçer.]]"]},{"k":"not","x":"Burada baba mirastaki kendi payından yani söz gelimi bir dönüm arsadan vazgeçmiştir. Bunun karşılığında ise bütün varislerin eşit derecede kendisine miras dışından mal vermelerini istemiştir. Burada baba diğer varislerden kişi başı 100 dolar talep edebileceği gibi direk hepsinden eşit bir şekilde toplamda 750.000 lira şeklinde bir talebi de olabilir."}]},{"h":"Dördüncü Halin Çözümü","b":[{"k":"p","x":"«أَنْ يَخْرُجَ أَحَدٌ مِنَ الْوَارِثِينَ عَنْ نَصِيبِهِ لِلْوَرَثَةِ مُقَابِلَ مَالٍ مِنْ نَفْسِ التَّرِكَةِ»"},{"k":"ornek","x":"Bir kişi vefat etti, geriye mal olarak 7 dönüm arsa ve 1000 dolar para bıraktı. Varisler olarak da koca, öz kız kardeş, anne bir kız kardeş ve anne bıraktı. Anne miras olarak kalan 1000 doların kendisine verilmesi karşılığında mirastaki diğer payından tüm varisler lehine feragat etti. Bu durumda mesele nasıl çözülür?"},{"k":"ms","m":["6 → 8","7"],"t":"","top":[],"r":[{"v":"زوج","p":"1/2","s":["3","3"],"tl":""},{"v":"أخت ش","p":"1/2","s":["3","3"],"tl":""},{"v":"أخت لأم","p":"1/6","s":["1","1"],"tl":""},{"v":"أم","p":"1/6","s":["1","-"],"tl":""}],"alt":["قبل (عولية)","بعد"],"c":""},{"k":"steps","x":["Mesele normal bir şekilde paylar dağıtılarak çözülür [[(mesele 6’dan 8’e avleder)]].","Sonra «بعد» bölümünde ise mirastan çekilen kişi hariç diğerlerinin sihamlarının toplamı mahreç yapılır."]}]},{"h":"Münâsaha","b":[{"k":"p","x":"Kelime manası: İzale etmek, değiştirmek ve nakletmek gibi anlamlara gelir."},{"k":"d","t":"Münâsaha «الْمُنَاسَخَة»","x":"Vefat eden birinin malı henüz paylaştırılmadan evvel başka varis veya varislerin vefat etmesi meselesidir. «هِيَ مَوْتُ إِنْسَانٍ، وَقَبْلَ قِسْمَةِ تَرِكَتِهِ يَمُوتُ أَحَدُ وَرَثَتِهِ أَوْ أَكْثَرُ»"},{"k":"p","x":"Münâsahanın 3 hali vardır."},{"k":"h","x":"Birinci hal"},{"k":"p","x":"İkinci vefat eden kişinin geriye bıraktığı varislerin birinci vefat eden kişinin varislerinin bizzat kendisi olması. Diğer bir ifade ile ilk vefat eden kişinin malı henüz varisler arasında paylaştırılmadan o varislerden birinin vefat etmesi ve geriye kendisine varis olarak sadece birinci vefat eden kişinin varislerinin kalması durumudur."},{"k":"ornek","x":"Ahmet Efendi vefat etti. Geriye üç erkek kardeş ve iki kız kardeş bıraktı. Ahmet Efendi'nin mirası henüz dağıtılmadan kardeşlerden Mehmet de vefat etti. Bu durumda mesele nasıl çözülür?"},{"k":"tbl","r":[["Varis","«قبر أحمد» (8)","«قبر محمد» (6)"],["«أخ (محمد)»","2","«ت» (vefat etti)"],["«أخ»","2","2"],["«أخ»","2","2"],["«أخت»","1","1"],["«أخت»","1","1"]]},{"k":"p","x":"Çözümü: Birinci haldeki münâsahat meselesi çözülürken ilk etapta ilk vefat eden kişinin geriye bıraktığı varisler yazıldı ve aldıkları sihamların toplamı mahreç yapıldı. Bu bölüme, ilk vefat eden kimsenin varislerinin bulunduğu bölüm anlamında «قبر أحمد» yazıldı. 2. bölümde ise 2. vefat eden kişinin isminin hizasına vefat ettiğini gösteren «ت» harfi yazıldı ve paylar birinci bölümdeki gibi dağıtıldı. Böylelikle mesele çözülmüş oldu. Yani ortada 750.000 liralık bir mal varsa bunu 6'ya böleceğiz ve ona göre paylaşım yapacağız."},{"k":"h","x":"İkinci hal"},{"k":"p","x":"İkinci vefat eden kişinin geriye bıraktığı varisler birinci vefat eden kişinin geriye bıraktığı varisler ile aynıdır. Ancak bu varislerin ikinci vefat eden kişiye olan yakınlıkları birinciden farklıdır. Bir diğer ifade ile birinci vefat eden kişinin annesi olan varis, ikinci vefat eden kişinin karısı olması durumudur. Yani burada birinci hal ile ikinci hal arasında tek fark, ikinci halde varislerin bir nevi isimlerinin değişmesidir. Daha önce anne diye yazılan varisin artık zevce diye yazılması gibi..."},{"k":"ornek","x":"Hasan Efendi vefat etti ve geriye baba, anne, bir oğul ve bir kız bıraktı. Daha sonra mal paylaştırılmadan evvel anne vefat etti ve geriye aynı kişiler kaldı. Bu durumda mesele nasıl çözülür?"},{"k":"tbl","r":[["Hasan’a göre","Pay","«قبر حسن» 6","«تصحيح» 18 (× 4)","Anneye göre","Pay","«قبر الأم» 4 (× 3)","«العمود الجامعة» 72"],["«أب»","1/6","1","3","«زوج»","1/4","1","12+3=15"],["«أم»","1/6","1","3","«ت»","","","—"],["«ابن»","ع","4 (oğul ve kız birlikte)","8","«ابن ابن»","ع","2","32+6=38"],["«بنت»","ع","↑","4","«بنت ابن»","ع","1","16+3=19"]]},{"k":"p","x":"Çözümü:"},{"k":"steps","x":["**Birinci adım:** Mevcut varislerin ikinci vefat eden kişiye olan yakınlıklarının karışmaması için evvela bir tablo çizmek gerekir [[(ortada anne; babası koca, oğlu oğlun oğlu, kızı oğlun kızı olur)]].","**İkinci adım:** İlk vefat eden kişinin geriye bıraktığı varisleri yazıp paylarını veriyoruz.","**Üçüncü adım:** Bu meselenin tashihe ihtiyacı olduğu için meseleyi tashih ediyoruz. Şayet burada tashih olmasaydı direk bir sonraki aşamaya geçilecek ve tashih için ekstra bir sütun çizilmeyecekti.","**Dördüncü adım:** İkinci vefat eden kişi olan annenin isminin hizasına “vefat eden kişi” anlamında «ت» harfi yazılıp geriye kalan varisler yazılır ve paylar verilir. Burada en çok dikkat edilmesi gereken şey eski varislerin ikinci vefat eden kişi olan anneye olan yakınlıklarını doğru belirlemektir. Mesela daha önce baba diye yazdığımız kişi şu an koca, daha önce oğul diye yazdığımız kişi oğlun oğlu, kız diye yazdığımız kişi şu an oğlun kızı diye yazıldı.","**Beşinci adım:** İkinci vefat eden kişinin hayattaki sihamı (3) ile kendi kabrinin mahrecine (4) bakılır. 4 ile 3 arasında tebâyün olduğu için herhangi bir işlem yapılmadan çaprazlama olarak sütunların üzerine yazıldılar. Şayet aralarında tevâfuk olmuş olsaydı sadeleştirilir, ondan sonra çaprazlama sütunların üzerine yazılırlardı.","**Altıncı adım:** İlk kabir üzerine yazılan 4 sayısı mahreç ile çarpılır ve câmia bölümüne mahreç olarak yazılır. Bu 4 sayısı ikinci vefat eden kişi olan anne hariç diğerlerinin sihamları ile de çarpılır. Ancak hemen câmia bölümüne yazılmaz; evvela ikinci kabirdeki 3 sayısı da bu varislerin bu bölümdeki sihamları ile çarpılır. İki çarpma işleminin toplamı câmia bölümüne yazılır."]},{"k":"h","x":"Üçüncü hal"},{"k":"p","x":"İkinci vefat eden kişinin yeni varislerinin olma durumudur. Diğer bir ifade ile birinci kabirde yazılan kimselerden farklı olarak ikinci kabirde yeni varislerin bulunmasıdır. Üçüncü halin ikinci hal ile tek farkı ikinci kabirde yeni varislerin bulunmasıdır. Üçüncü halin çözümü ikinci hal ile aynıdır. Üçüncü halde sadece ikinci kabirde eski varislerin yazımından sonra yeni varisler için aşağıda ekstra sütunlar açılır."},{"k":"ornek","x":"Ahmet Efendi öldü. Geriye zevce, anne ve oğul bıraktı. Daha sonra henüz mal paylaştırılmadan anne vefat etti. Geriye koca ve önceki varisleri bıraktı. Bu durumda mal nasıl paylaştırılır?"},{"k":"tbl","r":[["Ahmed’e göre","Pay","«قبر أحمد» 24 (× 1)","Anneye göre","Pay","«قبر الأم» 4 (× 1)","«العمود الجامعة» 24"],["«زوجة»","1/8","3","«غ» «غريب»","","—","3"],["«أم»","1/6","4","«ت»","","","—"],["«ابن»","ع","17","«ابن ابن»","ع","3","20"],["—","","","«زوج» (yeni varis)","1/4","1","1"]]},{"k":"p","x":"Annenin sihamı (4) ile kendi kabrinin mahreci (4) sadeleşti: 4 → 1 ve 4 → 1. «غ»: «غريب» [[(yabancı) demektir; zevce anneye varis değildir.]]"},{"k":"h","x":"Alıştırmalar"},{"k":"ornek","x":"Fatma Hanım vefat etti ve geriye koca, anne ve amca bıraktı. Daha sonra koca vefat etti, geriye başka bir kadından olan iki oğul bıraktı. Bu durumda mal paylaşma nasıl yapılır?"},{"k":"ornek","x":"Âişe hanım vefat etti ve geriye koca, anne ve amca bıraktı. Daha sonra mal paylaştırılmadan koca vefat etti ve geriye baba ve oğul bıraktı. Bu durumda mal paylaşma nasıl yapılır?"}]}],"ht":[{"s":0,"x":"Tehârüc: bir varisin, bir veya birkaç varis lehine mirastan çekilmesi. Delil: «الصُّلْحُ جَائِزٌ بَيْنَ الْمُسْلِمِينَ…»."},{"s":0,"x":"Sulh alışveriş hükmündedir; faize yol açmaması için karşılıklı verilen mallar aynı cinsten olmamalıdır."},{"s":1,"x":"Birinci hal: «قبل» bölümünde mesele normal çözülür; «بعد» bölümünde çekilenin sehmi lehine çekildiği kişiye yazılır, mahreç değişmez."},{"s":2,"x":"İkinci hal: «بعد» bölümünde çekilenin sehmi silinir, kalan sihamların toplamı yeni mahreç olur; diğerleri çekilene paylarına göre öder."},{"s":3,"x":"Üçüncü hal: «بعد» bölümünde mahreç, çekilen hariç kişi sayısıdır (aded-i rüûs); «جامعة» bölümünde münâsahadaki gibi birleştirilir."},{"s":4,"x":"Dördüncü hal: çekilen terikenin kendisinden belli bir mal alır; «بعد» bölümünde onun hariç sihamların toplamı mahreç olur."},{"s":5,"x":"Münâsaha: miras paylaşılmadan bir varisin de ölmesi. Her ölü için bir “kabir” sütunu açılır; ölenin hizasına «ت» yazılır."},{"s":5,"x":"1. hal: ikinci ölünün varisleri birinciyle aynı ve yakınlıkları aynı. 2. hal: aynı kişiler, farklı yakınlık (anne → zevce gibi). 3. hal: ikinci kabirde yeni varisler var."},{"s":5,"x":"İkinci ölünün sihamı ile kendi kabrinin mahreci arasında nispete bakılır (tebâyün: çaprazlama yazılır; tevâfuk: önce sadeleştirilir); çarpımların toplamı «العمود الجامعة»ya yazılır."}],"oz":null},{"t":"Zevi’l-erhâm","intro":"Ashâb-ı ferâiz ve asabe dışındaki kan hısımları: mezheplerin görüşleri, ehlü’l-karâbe, ehlü’t-tenzîl ve ehlü’r-rahim yöntemleri, miras alacakların sırası, genel kaideler ve ehlü’l-karâbenin dört sınıfı.","s":[{"h":"Zevi’l-erhâmın Tanımı","b":[{"k":"d","t":"Zevi’l-erhâm «ذَوُو الْأَرْحَام»","x":"Sözlükte “rahim veya nesep bağıyla birbirine bağlı akrabalar” anlamındaki zevi’l-erhâm (tekili zü’r-rahim / zî-rahim) terkibi, İslâm miras hukukunda ashâb-ı ferâizle asabe gruplarına dahil olmayan kan hısımlarını ifade eder."},{"k":"p","x":"Meselâ anne tarafından dedeler, kızın çocukları, yeğenler, dayı, teyze, hala, anne bir amca bu grupta yer alır. Bunların çoğu, kişinin annesi veya kızı yoluyla kan bağı bulunan akrabalarından oluşmakla birlikte hala gibi erkek tarafından bazı akrabaları da içerir."}]},{"h":"Mezheplerin Görüşleri","b":[{"k":"p","x":"**Miras alır:** Hanefî ve Hanbelîlere göre ve Şâfiî ile Mâlikî mezhebinin müteahhirûn alimlerine göre zevi’l-erhâm miras alır."},{"k":"p","x":"**Miras almaz:** Şâfiî ve Mâlikîlerin mütekaddimûn dönemi alimlerine göre zevi’l-erhâm miras almaz. Zevi’l-erhâmdan önce miras alacak olan sınıflardan hiçbiri yoksa mal beytülmâle kalır."},{"k":"tbl","r":[["«ميراث ذوي الأرحام»","Görüş","Kimler"],["**«القول الشاذ»** (şâz görüş)","«أهل الرحم»","Hasan b. Müyesser ve Şîa’dan Nûh b. Derrâc"],["**«القول المعتمد»** (muteber görüş)","«أهل التنزيل»","Cumhur"],["","«أهل القرابة»","Hanefîler"]]},{"k":"sc","q":"Ehlü’l-karâbe, ehlü’t-tenzîl ve ehlü’r-rahim arasında meselelerin çözümü noktasında nasıl bir fark vardır?","x":"Ehlü’l-karâbe: tıpkı asabelerde olduğu gibi yakın olan uzak olanı hacbeder. Ehlü’t-tenzîl: fürûları silmek suretiyle mesele usule indirgenir; daha sonra usul baz alınarak mesele çözülür. Ehlü’r-rahim: bütün zevi’l-erhâm eşit derecede pay alır; aralarında kız-erkek dahil herhangi bir üstünlük yoktur, dolayısıyla bütün meselelerde mahreç aded-i rüûstur."},{"k":"tbl","r":[["Varisler","«أهل القرابة» (1)","«أهل التنزيل» (6)","«أهل الرحم» (3)"],["«ابن بنت» — «فروع»","1","3 (kızın yerine: 1/2)","1"],["«أب أم» — «أصول»","—","1 (annenin yerine: 1/6)","1"],["«بنت عم» — «عمومة»","—","2 (amcanın yerine: ع)","1"]]},{"k":"d","t":"Ehlü’l-karâbe «أَهْلُ الْقَرَابَة»","x":"Hanefîlerin yöntemi: zevi’l-erhâm arasında asabelerde olduğu gibi yakın olan uzak olanı hacbeder."},{"k":"d","t":"Ehlü’t-tenzîl «أَهْلُ التَّنْزِيل»","x":"Cumhurun yöntemi: her zü’r-rahim, kendisini ölüye bağlayan varisin yerine indirilir (fürû silinip usule gidilir), mesele o varislere göre çözülür."},{"k":"d","t":"Ehlü’r-rahim «أَهْلُ الرَّحِم»","x":"Şâz görüş: bütün zevi’l-erhâm kız-erkek farkı olmadan eşit pay alır; mahreç aded-i rüûstur."},{"k":"sc","q":"Zevi’l-erhâm ne zaman mirastan pay alır?","x":"Zevi’l-erhâm, miras alacak sınıflar arasında son sıradadır. Şayet zevi’l-erhâm da olmazsa mal beytülmâle kalır."}]},{"h":"Miras Alacakların Sıralaması","b":[{"k":"steps","x":["«أصحاب الفرائض» — [[Ashâb-ı ferâiz]]","«العصبة النسبية» — [[Asabe-i nesebiyye]]","«العصبة السببية (المعتق)» — [[Asabe-i sebebiyye (azad eden)]]","«عصبة الولاء السببية (عصبة المعتق const ESER = ESER_T;
// Aynı adla birden çok müellife bağlanan eserler (el-Burhân, Mebâhis, Tefsir Usûlü…) ve bir müellifin birden çok eseri tek sorudan fazla üretilmez
const eserSay = {}; ESER.forEach(r => { const k = norm(r.e); (eserSay[k] ||= new Set()).add(norm(r.m)); });
const ESER_Q = ESER.filter(r => eserSay[norm(r.e)].size === 1 && !/[,;]/.test(r.e)).filter((r, i, a) => a.findIndex(x => norm(x.e) === norm(r.e)) === i);

// Havuz öğesi: {key, u, make()}
const maskTerm = (x, t) => {
  let out = x;
  t.replace(/\(.*?\)/g, '').split(/[\s\-–]+/).filter(w => w.length > 3 && !/^(kur'an|kuran|ayet|âyet)$/i.test(w)).forEach(w => {
    out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '…');
  });
  return out;
};
function pickDistinct(cands, n, keyFn, exclude) {
  const seen = new Set(exclude.map(keyFn)), out = [];
  for (const c of cands) { const k = keyFn(c); if (!seen.has(k)) { seen.add(k); out.push(c); if (out.length === n) break; } }
  return out;
}
const nearFirst = (list, u) => [...shuffle(list.filter(x => x.u === u)), ...shuffle(list.filter(x => Math.abs(x.u - u) <= 2 && x.u !== u)), ...shuffle(list.filter(x => Math.abs(x.u - u) > 2))];
function qTanim(d) {
  const tersi = Math.random() < 0.65;
  const fk = x => norm(x.t);
  if (tersi) {   // tanımı göster, kavramı sor
    const metin = maskTerm(d.x, d.t);
    const cands = nearFirst(TANIM.filter(x => x.id !== d.id && !norm(d.x).includes(norm(x.t))), d.u);
    const dis = pickDistinct(cands, 3, fk, [d]);
    return {key: 'd:' + d.id, u: d.u, s: d.s, long: true, soru: `<small>Aşağıdaki tanım hangi kavrama aittir?</small>${fmt(metin)}`, dogru: d.t, sec: shuffle([d.t, ...dis.map(x => x.t)]), aciklama: `<b>${fmt(d.t)}:</b> ${fmt(d.x)}`};
  }
  const cands = nearFirst(TANIM.filter(x => x.id !== d.id && norm(x.x) !== norm(d.x)), d.u);
  const dis = pickDistinct(cands, 3, x => norm(x.x).slice(0, 60), [d]);
  const kisalt = x => plain(maskTerm(x.x, x.t));
  return {key: 'd:' + d.id, u: d.u, s: d.s, soru: `<small>Hangisi bu kavramın tanımıdır?</small><em>${fmt(d.t)}</em>`, dogru: kisalt(d), sec: shuffle([kisalt(d), ...dis.map(kisalt)]), aciklama: `<b>${fmt(d.t)}:</b> ${fmt(d.x)}`};
}
function qEser(r) {
  const not = r.not ? ` <span style="color:var(--muted)">(${fmt(r.not)})</span>` : '';
  if (Math.random() < 0.6) {   // eseri göster, müellifi sor
    const cands = nearFirst(ESER.filter(x => norm(x.m) !== norm(r.m)), r.u);
    const dis = pickDistinct(cands, 3, x => norm(x.m), [r]);
    return {key: 'e:' + r.id, u: r.u, s: r.s, soru: `<em>${fmt(r.e)}</em> kimin eseridir?`, dogru: r.m, sec: shuffle([r.m, ...dis.map(x => x.m)]), aciklama: `<b>${fmt(r.e)}</b> → ${fmt(r.m)}${not}`};
  }
  // müellifi göster, eseri sor (o müellifin başka eserleri çeldirici olmaz)
  const ayni = new Set(ESER.filter(x => norm(x.m) === norm(r.m)).map(x => norm(x.e)));
  const cands = nearFirst(ESER_Q.filter(x => !ayni.has(norm(x.e))), r.u);
  const dis = pickDistinct(cands, 3, x => norm(x.e), [r]);
  return {key: 'e:' + r.id, u: r.u, s: r.s, soru: `<small>Aşağıdakilerden hangisi bu müellifin eseridir?</small><em>${fmt(r.m)}</em>`, dogru: r.e, sec: shuffle([r.e, ...dis.map(x => x.e)]), aciklama: `<b>${fmt(r.e)}</b> → ${fmt(r.m)}${not}`};
}
function qEl(i) {
  const q = SORULAR[i];
  return {key: 'q:' + i, u: q.u, soru: fmt(q.q), dogru: q.a[0], sec: shuffle(q.a), aciklama: fmt(q.x)};
}
const HAVUZ = [
  ...SORULAR.map((q, i) => ({key: 'q:' + i, u: q.u, make: () => qEl(i)})),
  ...TANIM.map(d => ({key: 'd:' + d.id, u: d.u, make: () => qTanim(d)})),
  ...ESER_Q.map(r => ({key: 'e:' + r.id, u: r.u, make: () => qEser(r)}))
];
function weightedPick(list, n) {
  const w = list.map(x => { const s = stats[x.key]; return s ? 1 + s.bad * 2 - s.ok * .5 : 1.5; });
  const out = [], used = new Set();
  while (out.length < Math.min(n, list.length)) {
    let tot = 0; list.forEach((x, i) => { if (!used.has(i)) tot += Math.max(w[i], .2); });
    let rnd = Math.random() * tot;
    for (let i = 0; i < list.length; i++) { if (used.has(i)) continue; rnd -= Math.max(w[i], .2); if (rnd <= 0) { used.add(i); out.push(list[i]); break; } }
  }
  return out;
}

const VIEWS = () => ({home, atolye, quiz, match, flash, oralView, review, browse, progress, study, unitView, exam});

const navStack = [{view: 'home', arg: null}];
let pendingFocus = null;
function render(view, arg) {
  curView = view; curArg = arg ?? null;

function go(view, arg) {
  const d = (history.state && history.state.d) || 0;

  if (curView === 'quiz' && view !== 'quiz') { st.d = d; navStack[d] = st; try { history.replaceState(st, ''); } catch (e) {} }
  else { st.d = d + 1; navStack.length = d + 1; navStack.push(st); try { history.pushState(st, ''); } catch (e) {} }

}
function goUp(view, arg = null) {
  const d = (history.state && history.state.d) || 0, key = JSON.stringify(arg);

    if (e && e.view === view && JSON.stringify(e.arg ?? null) === key) { try { history.go(k - d); return; } catch (er) { break; } }

/* ---------- test ---------- */
let Q = null;
function quiz(opts = {}) {

  }

  Q = {list: shuffle([...ek, ...weightedPick(kaynak, adet)]).map(x => x.make()), i: 0, dogru: 0, yanlis: [], unit: opts.unit};

}
function renderQ() {

    <div class="q${q.long ? ' long' : ''}">${q.soru}</div>

  </div>`;
}
function answer(el) {
  const q = Q.list[Q.i], secilen = q.sec[+el.dataset.i], ok = secilen === q.dogru;
  document.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (q.sec[+b.dataset.i] === q.dogru) b.classList.add('ok'); });

  $('#exp').innerHTML = `<b>${ok ? 'Doğru.' : 'Yanlış.'}</b> ${q.aciklama}${yer}`;

}
function nextQ() { Q.i++; Q.i < Q.list.length ? renderQ() : quizEnd(); }
function wrongList() {
  const satir = q => q.key[0] === 'q'

/* ---------- eşleştirme ---------- */
let M = null;

  renderM();
}
function renderM() {
  $('#app').innerHTML = `

    <div class="col"><h4>Müellif</h4>${M.right.map(r => `<button class="tile ${M.done.has(r.id) ? 'done' : ''}" id="mr-${r.id}" ${M.done.has(r.id) ? 'disabled' : ''} onclick="mPick(${r.id})">${fmt(r.m)}</button>`).join('')}</div>
  </div>`;

  else { M.hata++; record('e:' + M.sel, false); const el = $('#mr-' + id); el.classList.add('wrong'); setTimeout(() => { el.classList.remove('wrong'); $('#app .bar .count').textContent = `${M.done.size} / ${M.list.length} · ${M.hata} hata`; }, 320); }
}
function mEnd() {
  const sn = Math.round((Date.now() - M.t0) / 1000);

  const hits = src.filter(r => !t || norm(bTab === 'kavram' ? r.t + ' ' + r.x : r.e + ' ' + r.m).includes(t));
  $('#bl').innerHTML = hits.length ? hits.map(r => bTab === 'kavram'
    ? `<button class="row" onclick="toSection(${r.u},${r.s})"><div class="e">${fmt(r.t)}</div><div class="n">${fmt(r.x)}</div><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].s[r.s].h)}</div></button>`
    : `<button class="row" onclick="toSection(${r.u},${r.s})"><div class="e">${fmt(r.e)}</div><div class="n">${fmt(r.m)}${r.not ? ` <span style="color:var(--muted)">(${fmt(r.not)})</span>` : ''}</div><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].s[r.s].h)}</div></button>`).join('')
    : '<p class="empty">Sonuç yok.</p>';
}

/* ---------- ilerleme ---------- */
function progress() {
  const satir = UNITELER.map((u, i) => {
    let ok = 0, bad = 0; unitItems(i).forEach(x => { const s = stats[x.key]; if (s) { ok += s.ok; bad += s.bad; } });
    const p = ok + bad ? Math.round(100 * ok / (ok + bad)) : null;
    return `<div class="meter"><span title="${esc(u.t)}">${i + 1}. ${esc(u.t)}</span><div class="progress"><i style="width:${p ?? 0}%;background:${p === null ? 'transparent' : p >= 70 ? 'var(--green-2)' : p >= 45 ? 'var(--gold)' : 'var(--red)'}"></i></div><span class="count">${p === null ? '—' : '%' + p}</span></div>`;
  }).join('');
  const byKey = {}; HAVUZ.forEach(x => byKey[x.key] = x);
  const zayif = Object.entries(stats).filter(([k, s]) => s.bad > 0 && byKey[k]).sort((a, b) => (b[1].bad - b[1].ok * .5) - (a[1].bad - a[1].ok * .5)).slice(0, 12).map(([k]) => k);
  const etiket = k => { const [t, id] = k.split(':');
    if (t === 'd') return `<b>${fmt(TANIM[id].t)}</b>: ${fmt(TANIM[id].x)}`;
    if (t === 'e') return `<b>${fmt(ESER_Q[id].e)}</b> → ${fmt(ESER_Q[id].m)}`;
    return `${fmt(SORULAR[id].q)} <b>${fmt(SORULAR[id].a[0])}</b>`; };
  const oralN = Object.keys(oral).length, oralOk = Object.values(oral).filter(v => v === 1).length;
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">İlerlemem</h2>
  <div class="card" style="margin-top:14px">${satir}
    <p class="lead" style="font-size:.88rem;margin-top:12px">Çalış bölümü: ${uDone()} / ${UNITELER.length} ünite tamamlandı.<br>Konu tekrarı: ${oralN} bölüm çalışıldı, ${oralOk} tanesini bildin.</p></div>
  <div class="section-title">En çok karıştırdıkların</div>
  ${zayif.length ? `<div class="list">${zayif.map(k => `<div class="row"><div class="n">${etiket(k)}</div></div>`).join('')}</div>
    <div class="actions"><button class="btn" onclick='quiz({keys:${JSON.stringify(zayif)}})'>Bunlarla test çöz</button></div>` : '<p class="empty">Henüz yanlış yok. Biraz test çözünce burada görünecek.</p>'}
  <div class="actions" style="margin-top:30px"><button class="btn sec" onclick="sifirla()">İlerlemeyi sıfırla</button></div>`;
}
function sifirla() {
  if (!confirm('Bütün ilerleme kaydın silinsin mi?')) return;
  stats = {}; boxes = {}; oral = {}; uStat = {};
  store.set('stats', stats); store.set('boxes', boxes); store.set('oral', oral); store.set('units', uStat); progress();
}

/* ---------- genel arama ---------- */
let SIDX = null;
function bTxt(b) {
  if (b.k === 'tbl') return b.r.map(r => r.filter(Boolean).map(plain).join(' – ')).join(' · ');
  if (b.k === 'steps') return b.x.map(plain).join(' · ');
  if (b.k === 'ar') return plain(b.x || '');
  if (b.k === 'sc') return plain(b.q + ' ' + b.x);
  if (b.k === 'ms') return plain([b.t, ...b.r.map(r => r.v + ' ' + r.p), b.c].filter(Boolean).join(' · '));
  if (b.k === 'al') return plain('Alıştırma: ' + b.v + ' ' + b.n);
  return plain((b.t ? b.t + ': ' : '') + b.x);
}
function buildIndex() {
  SIDX = [];
  UNITELER.forEach((u, ui) => u.s.forEach((s, si) => {
    SIDX.push({u: ui, s: si, kind: 'b', t: s.h, x: s.b.map(bTxt).join(' · ')});
  }));
  UNITELER.forEach((u, ui) => u.oz && u.oz.s.forEach((s, si) => {
    SIDX.push({u: ui, s: si, kind: 'o', t: s.h, x: s.b.map(bTxt).join(' · ')});
  }));
}
function openSearch() {
  if (!SIDX) buildIndex();
  $('#sov').classList.add('open');
  try { history.pushState(Object.assign({}, history.state, {search: true}), ''); } catch (e) {}
  $('#sq').value = ''; doGlobalSearch(); setTimeout(() => $('#sq').focus(), 30);
}
function closeSearch(viaPop) {
  $('#sov').classList.remove('open');
  if (!viaPop && history.state && history.state.search) { try { history.back(); } catch (e) {} }
}
function markText(text, t) {
  const n = norm(text); const i = n.indexOf(t);
  if (!t || i < 0) return esc(text.slice(0, 160)) + (text.length > 160 ? '…' : '');
  // norm uzunluğu yaklaşık korunduğundan konuma yakın bir pencere al
  const a = Math.max(0, i - 60), b = Math.min(text.length, i + t.length + 100);
  return (a ? '…' : '') + esc(text.slice(a, b)) + (b < text.length ? '…' : '');
}
function doGlobalSearch() {
  const t = norm($('#sq').value || '');
  if (t.length < 2) { $('#sres').innerHTML = '<p class="empty">En az iki harf yaz.</p>'; return; }
  const kav = TANIM.filter(d => norm(d.t).includes(t)).slice(0, 12);
  const bol = SIDX.filter(r => norm(r.t + ' ' + r.x).includes(t)).slice(0, 30);
  $('#sres').innerHTML = (kav.length ? `<div class="sgrp">Kavramlar</div>${kav.map(d => `<button class="sitem" onclick="hit(${d.u},${d.s})"><div class="w">Ünite ${d.u + 1}</div><div class="t">${fmt(d.t)}</div><div class="x">${esc(plain(d.x).slice(0, 140))}</div></button>`).join('')}` : '')
    + (bol.length ? `<div class="sgrp">Konu anlatımları</div>${bol.map(r => `<button class="sitem" onclick="hit(${r.u},${r.s},'${r.kind}')"><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].t)}${r.kind === 'o' ? ' · <b>Özet</b>' : ''}</div><div class="t">${esc(r.t)}</div><div class="x">${markText(r.x, t)}</div></button>`).join('')}` : '')
    || '<p class="empty">Sonuç yok.</p>';
}
function hit(u, s, kind) { $('#sov').classList.remove('open'); const oz = kind === 'o'; MOD = oz ? 'ozet' : 'kitap'; store.set('mod', MOD); pendingFocus = {id: `${oz ? 'os' : 'ls'}-${u}-${s}`}; if (history.state && history.state.search) { try { history.replaceState({view: curView, arg: curArg, d: (history.state.d || 0)}, ''); } catch (e) {} } go('unitView', u); }
function focusHit(f) { jump(f.id); }

/* ---------- başlat ---------- */
const ilkHash = (location.hash || '').slice(1);
try { history.replaceState({view: 'home', arg: null, d: 0}, '', location.pathname + location.search); } catch (e) {}
render('home');
// Alt çubuktaki "Devam et" / "Dersler" bağlantısıyla gelindiyse kaldığı yere aç (ör. #unitView-7)
(function () {
  const h = ilkHash; if (!h) return;
  const m = h.match(/^(\w+?)(?:-(\d+))?$/); if (!m) return;
  const v = m[1], a = m[2] === undefined ? undefined : +m[2];
  if (!['study', 'unitView', 'atolye', 'match', 'flash', 'oralView', 'review', 'exam', 'browse', 'progress'].includes(v)) return;
  if (v === 'unitView' && !(a >= 0 && a < UNITELER.length)) return;
  if (v === 'unitView') { go('study'); go('unitView', a); } else go(v);
})();
</script>
</body>
