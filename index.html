const UNITELER = [{"t":"Feraiz İlmine Giriş","intro":"Feraizin tanımı, bu alandaki eserler, İslam'dan önce miras, feraiz ilminin önemi, öne çıkan sahabeler ve miras ayetleri.","s":[{"h":"Feraiz Nedir?","b":[{"k":"d","t":"Feraiz (kelime)","x":"Kelime olarak “takdir edilen pay” anlamına gelen «فَرِيضَة» kelimesinin çoğuludur."},{"k":"p","x":"Bu şekilde isimlendirilmesinin sebebi Tevbe sûresinde geçen şu ayettir: «فَرِيضَةً مِنَ اللَّهِ» [Tevbe 9/60]. Aynı zamanda hadislerde de “feraiz” kelimesi yer almaktadır: «تَعَلَّمُوا الْفَرَائِضَ»."},{"k":"p","x":"Bundan dolayı bu ilme “ilmü’l-ferâiz” denmeye ve konu klasik fıkıh kitaplarında “kitâbü’l-ferâiz” başlığı altında ele alınmaya başlanmıştır. Bu konuda uzmanlaşan âlimlere de fâriz, ferâizî, farazî denilmiştir."},{"k":"p","x":"Istılahi anlamı ise alimler tarafından şu ifadelerle aktarılmıştır:"},{"k":"ar","a":"هُوَ قَوَاعِدُ فِقْهِيَّةٌ وَحِسَابِيَّةٌ يُعْرَفُ بِهَا نَصِيبُ كُلِّ وَارِثٍ مِنَ التَّرِكَةِ","x":""},{"k":"ar","a":"وَعَرَّفَهُ ابْنُ عَابِدِينَ بِقَوْلِهِ: هُوَ عِلْمٌ بِأُصُولٍ مِنْ فِقْهٍ وَحِسَابٍ تُعَرِّفُ حَقَّ كُلِّ وَاحِدٍ مِنَ الْوَرَثَةِ مِنَ التَّرِكَةِ وَالْحُقُوقِ","x":""},{"k":"d","t":"Feraiz (ıstılah)","x":"[[Terikeden her varisin payının bilindiği fıkhî ve hesabî kaideler (İbn Âbidîn: varislerden her birinin terikedeki ve haklardaki payını bildiren fıkıh ve hesap esaslarına dair ilim).]]"},{"k":"d","t":"Feraiz","x":"İslam miras hukukunu inceleyen ilim dalı; varislere verilmesi nass ile tayin edilen paylar."},{"k":"d","t":"Miras","x":"Ölen bir kimsenin mal varlığının akıbetini düzenleyen kuralların bütünü."}]},{"h":"Feraiz Alanındaki Eserler","b":[{"k":"p","x":"Ferâiz konusunda ilk eseri ashaptan **Zeyd b. Sâbit**’in (ö. 45/665) telif ettiği, tâbiînden **Ebü’z-Zinâd**’ın (ö. 130/748) bu esere şerh yazdığı, Eyyûb es-Sahtiyânî, İbn Şübrüme, İbn Ebû Leylâ gibi tâbiîn âlimlerinin de ferâizle ilgili eserlerinin bulunduğu şeklindeki rivayetler göz önüne alınarak bu alanda eser telif ve tedvinine fıkıh ekollerinin oluşumundan çok önce başlandığı söylenebilir."},{"k":"p","x":"Yine Süfyân es-Sevrî (ö. 161/778), Hasan b. Ziyâd, Ebû Hâzim el-Kādî, Muhammed b. Nasr el-Mervezî ve Tahâvî de bu alanda müstakil eser yazan ilk müellifler arasında gösterilir. Kâtib Çelebi ferâiz konusunda elliye yakın eser veya müelliften söz etmektedir. Bunlar arasında Hanefî ulemâsından **Secâvendî**’nin el-Ferâiżü’s-Sirâciyye, Şâfiî fakihi **İbnü’l-Mütefennine er-Rahbî**’nin el-Ferâiżü’r-Raḥbiyye adlı eserleri rağbet görmüş ve üzerlerinde birçok şerh ve hâşiye çalışması yapılmıştır."},{"k":"p","x":"Ferâiz ilmi Hanefi furû eserlerinde genelde “Kitâbu’l-Vesâyâ” veya “Kitâbu’l-Ferâiz” şeklinde eserlerin son bölümünde yer almaktadır. Meselâ; Kudûrî ve Muhtâr metinlerinde durum böyledir. Bazı eserlerde ise sadece “Kitâbu’l-Vesâyâ” zikredilmiş, ferâize yer verilmemiştir. Meselâ; İmam Muhammed’in “Câmiu’s-Sağîr” ve “Câmiu’l-Kebîr”inde yer almamıştır. “Kitâbu’l-Asl”da, hatta Merğînânî’nin “el-Hidâye”sinde de ferâiz bulunmamaktadır."},{"k":"p","x":"Ferâiz ilminin gelenekte müstakil olarak okunması onun ehemmiyetinden, matematik ilmiyle olan özel münasebetinden kaynaklanmış olabilir. Müslümanların inşa ettiği medreselerdeki ders sırasında da müstakil olarak okunması onun nev’i şahsına münhasır bir önemi hâiz olduğunu göstermektedir. Bu nedenle özel metinler yazılmış ve çok sayıda şerhler yapılmıştır."},{"k":"h","x":"Sirâciyye ve şerhleri"},{"k":"p","x":"Bu sahanın en meşhur metni, Ebû Tâhir Sirâcüddin Muhammed b. M. Abdürreşîd es-Secâvendî el-Hanefî’ye ait “**Metnu’s-Sirâciyye fi’l-Ferâiz**”dir. Doğum tarihi bilinmeyen müellifin 596/1200’lü yıllarda sağ olduğu kanaati yaygındır."},{"k":"p","x":"Es-Sirâciyye üzerine pek çok şerh ve haşiye çalışması yapılmıştır. Medreselerde mütedâvil olan **Seyyid Şerîf Cürcânî**’nin (816/1413) yaptığı şerh en meşhurudur. Diğer şerhler ise şunlardır:"},{"k":"n","n":1,"x":"Ebû Bekir el-Kelebâzî (700/1300), Dav’u’s-Sirâciyye"},{"k":"n","n":2,"x":"Hıdır el-Halebî el-Herevî (830/1427), Şerhu’s-Sirâciyye"},{"k":"n","n":3,"x":"İbnü’l-Hanbelî (971/1563), Şerhu’s-Sirâciyye"},{"k":"n","n":4,"x":"Bedrüddin (956/1549), Şerhu’s-Sirâciyye"},{"k":"n","n":5,"x":"Molla Fenârî, Şerhu’l-Ferâizi’s-Sirâciyye. En güzel şerhlerden biridir."},{"k":"n","n":6,"x":"Şehabeddin A. b. Mahmûd es-Sivâsî, el-Muhtâc ale’l-Ferâizi’s-Sirâciyye"},{"k":"n","n":7,"x":"İbnü’l-Hâc Muhammed b. el-Hâc Ahmed el-Farazî, et-Tahkîk fî Şerhi’l-Ferâizi’s-Sirâciyye"},{"k":"n","n":8,"x":"M. Muhyiddin Abdülhamîd (Sirâciyye’nin şerhidir)."},{"k":"n","n":9,"x":"İbn Kemal, Şerhu’l-Ferâizi’s-Sirâciyye"},{"k":"n","n":10,"x":"Şeyhzâde Muhyiddin Mehmed, Şerhu’l-Ferâizi’s-Sirâciyye"},{"k":"n","n":11,"x":"Mustafa Dîb el-Buğa, er-Rahbiyyetü fî İlmi’l-Ferâiz, Dımeşk 1994"},{"k":"h","x":"Rahbiyye ve şerhleri"},{"k":"p","x":"Şâfiî mezhebine göre yazılmış en meşhur eser, İbnü’l-Mütefennine er-Rahbî’nin (ö. 577/1182) manzum olarak kaleme aldığı “**Buğyetü’l-bâhis an cümeli’l-mevâris**” isimli eserdir. İlim çevrelerinde “Manzûmetü’r-Rahbiyye” diye meşhur olan bu eserin bazı şerhleri şunlardır:"},{"k":"n","n":1,"x":"Sıbtu’l-Mardînî, Şerḥu’r-Raḥbiyye"},{"k":"n","n":2,"x":"Abdullah b. Muhammed eş-Şinşevrî, el-Fevâʾidü’ş-Şinşevriyye fî Şerḥi’l-Manẓûmeti’r-Raḥbiyye"},{"k":"n","n":3,"x":"İbn Galbûn el-Mısrâtî, Tuḥfetü’l-iḫvâni’l-behiyye ʿale’l-Muḳaddimeti’r-Raḥbiyye"},{"k":"n","n":4,"x":"Ebû Bekir b. Ahmed es-Sebtî, Şerḥu’r-Raḥbiyye"},{"k":"p","x":"Bunlardan başka Cemâleddin el-İsnevî, Muhammed b. İbrâhim es-Sellâmî, Celâleddin es-Süyûtî’nin şerhleri anılabilir."},{"k":"h","x":"Günümüzdeki çalışmalar"},{"k":"p","x":"Günümüzde de ferâizle ilgili pek çok çalışma yapılmıştır. Bunlar;"},{"k":"n","n":1,"x":"Ali Haydar Efendi, Teshîlü’l-Ferâiz."},{"k":"n","n":2,"x":"Ali Himmet Berki – İrfan Yücel, İslam Hukukunda Ferâiz ve İntikal."},{"k":"n","n":3,"x":"Hamza Aktan, Mukayeseli İslam Miras Hukuku."},{"k":"n","n":4,"x":"Ömer Nasuhi Bilmen, Hukûk-ı İslâmiyye Kâmusu V."},{"k":"n","n":5,"x":"Hayreddin Karaman, Mukayeseli İslam Hukuku I."},{"k":"n","n":6,"x":"Ali Bardakoğlu, “Ferâiz”, DİA, TDV Yayınları, C. XII, 1995."},{"k":"n","n":7,"x":"Rifat Oral, Takrîbü’l-Ferâiz."}]},{"h":"İslam Miras Hukukundan Önceki Durum","b":[{"k":"h","x":"1. Roma hukukunda miras"},{"k":"p","x":"Romalılarda miras şifahi vasiyetlerle intikal etmiştir. Bu vasiyet bir satış akdi şeklini aldığından mûsâ leh, mûsînin mal ve ailesi üzerinde istediği tasarrufa sahip olurdu."},{"k":"p","x":"Daha sonra vasiyet yazılı şekle çevrilmiştir. Bu, ölüme bağlı bir tasarruf olarak kabul edilirdi. Eğer vasiyet yoksa miras akrabalara kalırdı. İmparator Jüstinyen 543 yılında neşrettiği 118 numaralı emirname ile tevârüste hısımlık esasını kabul etmiş, hısımları da sınıflara ayırmıştır. Şöyle ki:"},{"k":"tbl","r":[["Sınıf","Hısımlar"],["**Birinci sınıf**","Ne kadar aşağı giderse gitsin, furû"],["**İkinci sınıf**","Usul ve öz kardeşler"],["**Üçüncü sınıf**","Ana veya baba tarafından kardeşler"],["**Dördüncü sınıf**","Yukarıdakilerin dışında kalan hısımlar"]]},{"k":"p","x":"Buraya kadar sayılan hısımlar mevcut oldukça karı ve koca varis olamazdı. Terike, menkul, gayrimenkul mal, alacak ve borç olarak bütünüyle intikal ederdi. Buna **küllî halefiyet** denir. Dolayısıyla terike borca kâfi gelmediğinde vârisler borcu öderlerdi."},{"k":"h","x":"2. Eski Yunan'da miras"},{"k":"p","x":"Eski Yunan'da miras, meclis önünde muhakeme usulüyle intikal ederdi. Daha sonra sadece erkekler vasıtasıyla ölüye bağlı hısımlar vâris oldu. Üçüncü merhalede erkek hısımların yokluğu halinde kadınlara da miras verilmesi hükmü benimsendi. Kızların ve kadınların mahrumiyetini gidermek için evlenirken belirli bir meblağ (Drahoma) verilirdi."},{"k":"h","x":"3. Yahudilerde miras"},{"k":"p","x":"Nikâh veya zina mahsulü olup olmadığına bakılmaksızın bekar erkek çocuklar diğer kardeşlerinin iki katı miras alırdı. Kız çocuğu erkek kardeşleriyle beraber olsa da mirasçı olamıyordu. Ancak erkek kardeşi ona 12 yaşına kadar bakmakla mükellef tutulurdu. Ölenin erkek çocuğu ve oğlunun oğlu yoksa o zaman kızlar mirasçı olurdu. Çocukların olmadığı durumda miras baba gibi usule kalır, usulde bulunmazsa terike yan hısımlara intikal etmekteydi."},{"k":"p","x":"Yahudiliği terk eden kimse Yahudi hısımlarına varis olamıyor fakat Yahudi hısımları ona varis oluyorlardı. Yahudi dinine giren putperest kendi hısımlarına varis olur ama hısımları ona varis olamazdı. Anne ve babasını iz bırakacak şekilde döven kimseler ebeveynine varis olamazdı. Varisi kızlardan ibaret olan kimse başkalarına vasiyet edebilir ancak erkek çocukları varsa vasiyet edemezdi. Çocuğu olmadan ölen kadının mirasçısı ise kocası olurdu."},{"k":"h","x":"4. İslam’dan önce Araplarda miras"},{"k":"p","x":"Araplardaki göçebelik mirasa etki etmiştir. Bu yüzden silah taşımayan çocuklar ve kadınlar mirasçı sayılmamıştır. Hatta kadınlar mirasa konu olmamışlardır. Araplarda tevârüsün üç sebebi, iki şartı vardı."},{"k":"tbl","r":[["Miras sebepleri","Şartlar"],["1. Hısımlık","1. Erkek olmak"],["2. Velâ","2. Ergenlik çağı ve silah taşıma gücü olmak"],["3. Evlatlık","—"]]},{"k":"h","x":"5. Günümüz hukuk sistemlerinde miras"},{"k":"p","x":"Fransız, Alman, İngiliz ve Sovyetler Birliği’nde genelde miras kabul edilmiş üç aşağı beş yukarı birbirine yakın kanunlar benimsenmiştir. Sadece Komünizm döneminde ferdî mülkiyet kaldırıldığından miras hukuku da hayli hayli ortadan kalkmış ancak günümüzde yeni düzenlemeler yapılmaktadır."},{"k":"h","x":"6. İslâm’dan önce Türk toplumunda miras"},{"k":"p","x":"İslâm’dan önce Türk toplumlarında hem kanuni hem de vasiyet yoluyla veraset vardır. Prensip olarak bütün çocukların baba ve analarının mirasında hisseleri vardı. Babalardan ayrılan erkekler (bir miktar mal ile) ve yine aileden çeyiz alarak evlenen kızlar daha sonra mirasçı olamazdı. Kocanın vefatı halinde karısı malın ¼’ünü alır, oğulları olmadığı zaman babalar da varistir. Erkekler yoksa, evlenmiş kızlar da miras alırdı."},{"k":"p","x":"Babanın oturduğu evin varisi en küçük oğludur. Buna mukabil öz ve üvey analara bakar, evlenmemiş kız kardeşlerinin çeyizlerini hazırlarlar. Evlatlık da hukuki babasından miras alır. İslâmiyet’ten sonra miras hukukuna göre amel etmişlerdir. 1926’da yapılan hukuk inkılabından sonra halkımızın bir kısmı şer’î hukuka göre miras taksimi yaptırırken isteyen de mer’î hukuka göre miras taksimini yaptırmaktadır."}]},{"h":"Feraiz İlminin Önemi","b":[{"k":"h","x":"A. Ferâiz ilminin önemi ile ilgili ayetler"},{"k":"p","x":"Tarih boyunca mal bütün insanlar için çok önemli olmuştur. Bu öneme binaen Allah, malın taksimini ne bir peygambere ne bir meleğe ne de başka birine tevdi etmeden Kur’an-ı Kerim'de bizzat kendisi yapmıştır. Kur'an-ı Kerim'de geçen ve İslam'ın şartlarından olan namaz, oruç, zekât gibi ibadetler mücmel bir şekilde yer alırken, miras ayrıntılarıyla yer almaktadır. Bu da bu ilmin önemini göstermektedir."},{"k":"p","x":"Bununla beraber Kur’an-ı Kerim'de miras taksimi ile alakalı olan Nisâ sûresi 11. ve 12. ayetlerden sonra gelen şu ayet, bu ilme verilmesi gereken değeri ortaya koymakta ve yüz çevrilmesi halinde duçar olunacak cezayı gözler önüne sermektedir;"},{"k":"ar","a":"﴿تِلْكَ حُدُودُ اللَّهِ وَمَنْ يُطِعِ اللَّهَ وَرَسُولَهُ يُدْخِلْهُ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا وَذَلِكَ الْفَوْزُ الْعَظِيمُ﴾ [النساء ١٣] ﴿وَمَنْ يَعْصِ اللَّهَ وَرَسُولَهُ وَيَتَعَدَّ حُدُودَهُ يُدْخِلْهُ نَارًا خَالِدًا فِيهَا وَلَهُ عَذَابٌ مُهِينٌ﴾ [النساء ١٤]","x":""},{"k":"h","x":"B. Ferâiz ilminin önemi ile ilgili hadisler"},{"k":"ar","a":"عَنْ أَبِي هُرَيْرَةَ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: «يَا أَبَا هُرَيْرَةَ، تَعَلَّمُوا الْفَرَائِضَ وَعَلِّمُوهُ، فَإِنَّهُ نِصْفُ الْعِلْمِ، وَهُوَ يُنْسَى، وَهُوَ أَوَّلُ شَيْءٍ يُنْزَعُ مِنْ أُمَّتِي». (رواه ابن ماجه والدارقطني كلهم من حديث أبي هريرة وقد ضعفه الحافظ)","x":""},{"k":"sc","q":"Ferâiz neden ilmin yarısı sayılmıştır?","x":"Mirasla alakası olmayan insan yoktur. İlimler hayat ve memat ile ilgili olarak ikiye taksim edilirse; feraiz mematla ilgilidir, bu da ilmin yarısıdır. İlimleri nassa ve akla (kıyasa) dayalı diye ikiye ayırırsak, feraiz nassa dayananlardan olur. Mülkiyet edinme cebrî ve ihtiyarî olmak üzere ikiye ayrılırken, feraiz cebrî mülkiyet edinme kısmındandır. Feraiz kelimesinin lügat anlamı kastedilerek mükellefiyetleri farz olanlar ve olmayanlar diye ikiye ayırırsak, feraiz farz olanları ifade ederek diğer yarıyı gösterebilir. Feraiz ilmi bir kefede, diğerleri bir kefede kabul edilmiştir."},{"k":"ar","a":"عَنْ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: «الْعِلْمُ ثَلَاثَةٌ، وَمَا سِوَى ذَلِكَ فَهُوَ فَضْلٌ: آيَةٌ مُحْكَمَةٌ، أَوْ سُنَّةٌ قَائِمَةٌ، أَوْ فَرِيضَةٌ عَادِلَةٌ». رواه أبو داود وابن ماجه","x":""},{"k":"ar","a":"عَنِ ابْنِ مَسْعُودٍ رَفَعَهُ: «تَعَلَّمُوا الْفَرَائِضَ وَعَلِّمُوهَا النَّاسَ فَإِنِّي امْرُؤٌ مَقْبُوضٌ، وَإِنَّ الْعِلْمَ سَيُقْبَضُ حَتَّى يَخْتَلِفَ الِاثْنَانِ فِي الْفَرِيضَةِ فَلَا يَجِدَانِ مَنْ يَفْصِلُ بَيْنَهُمَا»","x":""},{"k":"ar","a":"عَنْ عَبْدِ اللَّهِ بْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: «أَلْحِقُوا الْفَرَائِضَ بِأَهْلِهَا، فَمَا بَقِيَ فَهُوَ لِأَوْلَى رَجُلٍ ذَكَرٍ». ق","x":""},{"k":"h","x":"C. Sahabeler ve selef âlimleri nezdinde feraiz ilminin önemi"},{"k":"p","x":"Hz. Ömer feraiz ilminin önemi ile ilgili şunları söylemektedir:"},{"k":"ar","a":"«تَعَلَّمُوا الْفَرَائِضَ فَإِنَّهَا مِنْ دِينِكُمْ» — «تَعَلَّمُوا الْفَرَائِضَ وَالنَّحْوَ وَالسُّنَّةَ كَمَا تَعَلَّمُونَ الْقُرْآنَ»","x":""},{"k":"p","x":"İbn Mes’ûd feraiz ilminin önemi ile ilgili şunları söylemektedir:"},{"k":"ar","a":"«مَنْ قَرَأَ الْقُرْآنَ فَلْيَتَعَلَّمِ الْفَرَائِضَ» — «تَعَلَّمُوا الْقُرْآنَ وَالْفَرَائِضَ فَإِنَّهُ يُوشِكُ أَنْ يَفْتَقِرَ النَّاسُ إِلَى عِلْمِ مَنْ يَعْلَمُهَا»","x":""},{"k":"ar","a":"وَقَالَ أَبُو مُوسَى الْأَشْعَرِيُّ رَضِيَ اللَّهُ عَنْهُ: «مَنْ عَلِمَ الْقُرْآنَ وَلَمْ يَعْلَمِ الْفَرَائِضَ فَإِنَّ مَثَلَهُ مَثَلُ الْبُرْنُسِ لَيْسَ لَهُ وَجْهٌ»","x":""}]},{"h":"Feraiz İlmi Konusunda Öne Çıkan Sahabeler","b":[{"k":"h","x":"1. Abdullah b. Mes’ûd"},{"k":"p","x":"Ebû Mûsâ el-Eş’arî onun hakkında şöyle demiştir:"},{"k":"ar","a":"«لَا تَسْأَلُونِي عَنْ أَشْيَاءَ مَا دَامَ هَذَا الْحَبْرُ فِيكُمْ»","x":""},{"k":"h","x":"2. İbn Abbas"},{"k":"p","x":"İbn Abbas feraiz ilmi konusunda en meşhur sahabelerdendir. Ancak İbn Abbas daha çok muhalefeti ile bilinir. Birçok meselede İbn Abbas sahabelerin genel görüşüne muhalefet etmiştir. Hatta bundan dolayı miras hukuku ile ilgili yazılmış müstakil bazı muasır eserlerde “Muhâlefetü İbn Abbas” başlığı açılmıştır."},{"k":"h","x":"3. Hz. Ali (kerremallâhu vechehû)"},{"k":"p","x":"Hz. Ali feraiz konusunda hazır cevaplılığı ile bilinen meşhur sahabelerdendir. Onun bu hazır cevaplılığı «مَسْأَلَةُ الْمِنْبَرِيَّة» diye bilinen şu olayda kendini göstermektedir: Hz. Ali camide kafiyeli bir vezin ile hutbe okurken bir anda cemaatten birisi kendisine “bir adam öldü. Geriye karısı, annesi, babası ve iki kızı kaldı. Taksim nasıl yapılır?” diye sorar. İmam Ali kafiyeyi hiç bozmadan ve hiç düşünmeden aynı vezin ile kendisine aşağıdaki şekilde cevap verir:"},{"k":"ar","a":"الْحَمْدُ لِلَّهِ الَّذِي يَحْكُمُ بِالْحَقِّ قَطْعًا، وَيَجْزِي كُلَّ نَفْسٍ بِمَا تَسْعَى، وَإِلَيْهِ الْمَآبُ وَالرُّجْعَى، زَوْجَةً وَبِنْتَيْنِ وَأَبًا وَأُمًّا، وَالْمَرْأَةُ صَارَ ثُمُنُهَا تُسْعًا","x":""},{"k":"ms","m":["24 → 27"],"t":"Minberiye meselesi","top":[],"r":[{"v":"زوجة","p":"1/8","s":["3"],"tl":""},{"v":"بنتين","p":"2/3","s":["16"],"tl":""},{"v":"أب","p":"1/6+ع","s":["4"],"tl":""},{"v":"أم","p":"1/6","s":["4"],"tl":""}],"alt":[],"c":"[[Mahreç 24 iken sihamların toplamı 27'dir: karının sekizde biri dokuzda bire döndü.]]"},{"k":"p","x":"Yine «مَسْأَلَةُ الدِّينَارِيَّة» diye bilinen şu mesele de Hz. Ali’nin feraiz alanındaki ilmini göstermesi açısından önemlidir: Rivayet edildiğine göre bir kadın Hz. Ali'nin yanına gelir ve “kardeşim vefat etti. Geriye 600 dinar bıraktı. Bana sadece bir dinar verdiler” der. Bunun üzerine Hz. Ali sadece kadına 600 dinardan bir dinar verilmesinden yola çıkarak geriye kalan bütün varisleri tek tek sayar ve hakkının 600'de bir olduğunu söyler."},{"k":"ms","m":["24"],"t":"Dinariye meselesi (600 dinar)","top":[],"r":[{"v":"زوجة","p":"1/8","s":["3"],"tl":"75"},{"v":"أم","p":"1/6","s":["4"],"tl":"100"},{"v":"بنت (2)","p":"2/3","s":["16"],"tl":"400"},{"v":"أخ ش (12)","p":"ع","s":["1"],"tl":"24"},{"v":"أخت ش","p":"ع","s":["1"],"tl":"1"}],"alt":[],"c":"[[Kalan 1 sehim 12 öz erkek kardeş ile 1 öz kız kardeş arasında ikili birli bölünür: 25 dinarın 24'ü erkek kardeşlere, 1'i kız kardeşe.]]"},{"k":"h","x":"4. Zeyd b. Sâbit"},{"k":"p","x":"Hz. Peygamber kendisi hakkında «أَفْرَضُكُمْ زَيْدُ بْنُ ثَابِتٍ» demiştir."},{"k":"d","t":"Minberiye meselesi","x":"Hz. Ali'ye minberde sorulan mesele: karı, anne, baba ve iki kız. Mahreç 24 iken 27'ye avleder; karının 1/8'i 1/9'a döner."},{"k":"d","t":"Dinariye meselesi","x":"Hz. Ali'ye 600 dinardan 1 dinar verilen kız kardeşin sorduğu mesele: karı, anne, iki kız, 12 öz erkek kardeş ve bir öz kız kardeş."}]},{"h":"Miras ile İlgili Ayetler","b":[{"k":"p","x":"Kur’an-ı Kerim’de miras taksimi ile alakalı başlıca üç ayet vardır. Nisâ sûresinde geçen bu ayetler şunlardır:"},{"k":"ar","a":"﴿يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنْثَيَيْنِ فَإِنْ كُنَّ نِسَاءً فَوْقَ اثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَ وَإِنْ كَانَتْ وَاحِدَةً فَلَهَا النِّصْفُ وَلِأَبَوَيْهِ لِكُلِّ وَاحِدٍ مِنْهُمَا السُّدُسُ مِمَّا تَرَكَ إِنْ كَانَ لَهُ وَلَدٌ فَإِنْ لَمْ يَكُنْ لَهُ وَلَدٌ وَوَرِثَهُ أَبَوَاهُ فَلِأُمِّهِ الثُّلُثُ فَإِنْ كَانَ لَهُ إِخْوَةٌ فَلِأُمِّهِ السُّدُسُ مِنْ بَعْدِ وَصِيَّةٍ يُوصِي بِهَا أَوْ دَيْنٍ آبَاؤُكُمْ وَأَبْنَاؤُكُمْ لَا تَدْرُونَ أَيُّهُمْ أَقْرَبُ لَكُمْ نَفْعًا فَرِيضَةً مِنَ اللَّهِ إِنَّ اللَّهَ كَانَ عَلِيمًا حَكِيمًا﴾ [النساء ١١]","x":"هذه الآية بينت إرث أولاد الميت الذكور والإناث كما بينت ميراث الأبوين"},{"k":"ar","a":"﴿وَلَكُمْ نِصْفُ مَا تَرَكَ أَزْوَاجُكُمْ إِنْ لَمْ يَكُنْ لَهُنَّ وَلَدٌ فَإِنْ كَانَ لَهُنَّ وَلَدٌ فَلَكُمُ الرُّبُعُ مِمَّا تَرَكْنَ مِنْ بَعْدِ وَصِيَّةٍ يُوصِينَ بِهَا أَوْ دَيْنٍ وَلَهُنَّ الرُّبُعُ مِمَّا تَرَكْتُمْ إِنْ لَمْ يَكُنْ لَكُمْ وَلَدٌ فَإِنْ كَانَ لَكُمْ وَلَدٌ فَلَهُنَّ الثُّمُنُ مِمَّا تَرَكْتُمْ مِنْ بَعْدِ وَصِيَّةٍ تُوصُونَ بِهَا أَوْ دَيْنٍ وَإِنْ كَانَ رَجُلٌ يُورَثُ كَلَالَةً أَوِ امْرَأَةٌ وَلَهُ أَخٌ أَوْ أُخْتٌ فَلِكُلِّ وَاحِدٍ مِنْهُمَا السُّدُسُ فَإِنْ كَانُوا أَكْثَرَ مِنْ ذَلِكَ فَهُمْ شُرَكَاءُ فِي الثُّلُثِ مِنْ بَعْدِ وَصِيَّةٍ يُوصَى بِهَا أَوْ دَيْنٍ غَيْرَ مُضَارٍّ وَصِيَّةً مِنَ اللَّهِ وَاللَّهُ عَلِيمٌ حَلِيمٌ﴾ [النساء ١٢]","x":"وهذه الآية بينت ميراث الزوجين وميراث الإخوة والأخوات لأم. وتسمى هذه الآية بآية الشتاء"},{"k":"ar","a":"﴿يَسْتَفْتُونَكَ قُلِ اللَّهُ يُفْتِيكُمْ فِي الْكَلَالَةِ إِنِ امْرُؤٌ هَلَكَ لَيْسَ لَهُ وَلَدٌ وَلَهُ أُخْتٌ فَلَهَا نِصْفُ مَا تَرَكَ وَهُوَ يَرِثُهَا إِنْ لَمْ يَكُنْ لَهَا وَلَدٌ فَإِنْ كَانَتَا اثْنَتَيْنِ فَلَهُمَا الثُّلُثَانِ مِمَّا تَرَكَ وَإِنْ كَانُوا إِخْوَةً رِجَالًا وَنِسَاءً فَلِلذَّكَرِ مِثْلُ حَظِّ الْأُنْثَيَيْنِ يُبَيِّنُ اللَّهُ لَكُمْ أَنْ تَضِلُّوا وَاللَّهُ بِكُلِّ شَيْءٍ عَلِيمٌ﴾ [النساء ١٧٦]","x":"وهذه الآية بينت ميراث الإخوة والأخوات الأشقاء أو لأب. وتسمى هذه الآية بآية الصيف لأنها نزلت في زمن الصيف، وقال البراء بن عازب: «هذه آخر آية نزلت من القرآن»"},{"k":"tbl","r":[["Ayet","Kimlerin mirasını beyan eder","Adı"],["**Nisâ 11**","Ölenin erkek ve kız çocukları ile anne-baba","—"],["**Nisâ 12**","Karı-koca ile anne bir kardeşler","Âyetü’ş-şitâ (kış ayeti)"],["**Nisâ 176**","Öz ve baba bir kardeşler","Âyetü’s-sayf (yaz ayeti); Berâ b. Âzib'e göre son inen ayet"]]},{"k":"sc","q":"Kur’an-ı Kerim'de feraiz ilmi ile alakalı bu üç ayetten başka bir ayet var mıdır?","x":"Evet, Kur’an-ı Kerim'de bu üç ayet dışında feraiz ile ilgili başka ayetler de vardır. Ancak bu ayetler icmâlî olarak feraizden bahsetmektedir. Herhangi bir tafsilata yer verilmemektedir."},{"k":"p","x":"Bu ayetler şunlardır:"},{"k":"ar","a":"﴿وَالَّذِينَ آمَنُوا مِنْ بَعْدُ وَهَاجَرُوا وَجَاهَدُوا مَعَكُمْ فَأُولَئِكَ مِنْكُمْ وَأُولُو الْأَرْحَامِ بَعْضُهُمْ أَوْلَى بِبَعْضٍ فِي كِتَابِ اللَّهِ إِنَّ اللَّهَ بِكُلِّ شَيْءٍ عَلِيمٌ﴾ [الأنفال ٧٥]","x":""},{"k":"ar","a":"﴿النَّبِيُّ أَوْلَى بِالْمُؤْمِنِينَ مِنْ أَنْفُسِهِمْ وَأَزْوَاجُهُ أُمَّهَاتُهُمْ وَأُولُو الْأَرْحَامِ بَعْضُهُمْ أَوْلَى بِبَعْضٍ فِي كِتَابِ اللَّهِ مِنَ الْمُؤْمِنِينَ وَالْمُهَاجِرِينَ إِلَّا أَنْ تَفْعَلُوا إِلَى أَوْلِيَائِكُمْ مَعْرُوفًا كَانَ ذَلِكَ فِي الْكِتَابِ مَسْطُورًا﴾ [الأحزاب ٦]","x":""},{"k":"ar","a":"﴿لِلرِّجَالِ نَصِيبٌ مِمَّا تَرَكَ الْوَالِدَانِ وَالْأَقْرَبُونَ وَلِلنِّسَاءِ نَصِيبٌ مِمَّا تَرَكَ الْوَالِدَانِ وَالْأَقْرَبُونَ مِمَّا قَلَّ مِنْهُ أَوْ كَثُرَ نَصِيبًا مَفْرُوضًا﴾ [النساء ٧]","x":""},{"k":"ar","a":"﴿وَإِذَا حَضَرَ الْقِسْمَةَ أُولُو الْقُرْبَى وَالْيَتَامَى وَالْمَسَاكِينُ فَارْزُقُوهُمْ مِنْهُ وَقُولُوا لَهُمْ قَوْلًا مَعْرُوفًا﴾ [النساء ٨]","x":""},{"k":"d","t":"Âyetü’ş-şitâ","x":"Karı-koca ile anne bir kardeşlerin mirasını beyan eden Nisâ 12. ayet (kışın indiği için “kış ayeti”)."},{"k":"d","t":"Âyetü’s-sayf","x":"Öz ve baba bir kardeşlerin mirasını beyan eden Nisâ 176. ayet (yazın indiği için “yaz ayeti”)."}]}],"ht":[{"s":0,"x":"Feraiz «فَرِيضَة» (takdir edilen pay) kelimesinin çoğuludur; adını Tevbe 9/60'taki «فَرِيضَةً مِنَ اللَّهِ» ifadesinden ve «تَعَلَّمُوا الْفَرَائِضَ» hadisinden alır."},{"s":1,"x":"İlk ferâiz eseri Zeyd b. Sâbit’e (ö. 45/665) nispet edilir; Ebü’z-Zinâd (ö. 130/748) şerh yazmıştır."},{"s":1,"x":"Hanefîlerin en meşhur metni Secâvendî’nin es-Sirâciyye’sidir; en meşhur şerhi Seyyid Şerîf Cürcânî’nin (816/1413) şerhidir."},{"s":1,"x":"Şâfiîlerin en meşhur eseri İbnü’l-Mütefennine er-Rahbî’nin (ö. 577/1182) manzum Buğyetü’l-bâhis’idir (Manzûmetü’r-Rahbiyye)."},{"s":1,"x":"Kudûrî ve Muhtâr’da ferâiz son bölümde yer alır; Câmiu’s-Sağîr, Câmiu’l-Kebîr, el-Asl ve el-Hidâye’de ferâiz yoktur."},{"s":2,"x":"Roma: Jüstinyen (543, 118 numaralı emirname) hısımları dört sınıfa ayırdı; bunlar varken karı-koca varis olamazdı; terike borçlarıyla bütünüyle intikal ederdi (küllî halefiyet)."},{"s":2,"x":"İslam öncesi Araplar: üç sebep (hısımlık, velâ, evlatlık), iki şart (erkek olmak, ergenlik ve silah taşıma gücü)."},{"s":2,"x":"İslam öncesi Türkler: kocanın vefatında karı malın ¼’ünü alır; babanın oturduğu evin varisi en küçük oğuldur."},{"s":3,"x":"Feraiz ilmin yarısı sayılır: herkesin mirasla ilgisi vardır; memata dairdir; nassa dayanır; cebrî mülkiyet edinme yoludur."},{"s":3,"x":"Nisâ 13–14. ayetler miras ayetlerinden sonra gelir; bu ilme verilmesi gereken değeri ve yüz çevirmenin cezasını gösterir."},{"s":4,"x":"Abdullah b. Mes’ûd: Ebû Mûsâ “bu âlim aranızda oldukça bana sormayın” demiştir."},{"s":4,"x":"İbn Abbas daha çok muhalefeti ile bilinir; muasır eserlerde “Muhâlefetü İbn Abbas” başlığı açılmıştır."},{"s":4,"x":"Hz. Ali: Minberiye ve Dinariye meseleleri; Zeyd b. Sâbit: «أَفْرَضُكُمْ زَيْدُ بْنُ ثَابِتٍ»."},{"s":5,"x":"Başlıca üç miras ayeti: Nisâ 11 (çocuklar ve anne-baba), Nisâ 12 (eşler ve anne bir kardeşler; kış ayeti), Nisâ 176 (öz ve baba bir kardeşler; yaz ayeti)."},{"s":5,"x":"İcmâlî miras ayetleri: Enfâl 75, Ahzâb 6, Nisâ 7, Nisâ 8."}],"oz":null},{"t":"Feraiz Istılahları","intro":"Feraiz ilminde kullanılan 33 temel terim: pay ve varis adları, kardeş grupları, asabe ve hacb, avl–red–âdile, tashih ve nisbetler, tehârüc ve münâsaha.","s":[{"h":"Pay ve Varislerle İlgili Terimler","b":[{"k":"d","t":"Farz «الْفَرْض»","x":"Şâriin vâris için takdir ettiği paydır. 1/6, 1/2, 1/8 gibi..."},{"k":"d","t":"Ashâb-ı ferâiz «أَصْحَابُ الْفَرَائِض»","x":"Kitapta (karı gibi), sünnette (nene gibi) veya icmâda (dede gibi) kendilerine mukadder bir pay verilen kimselerdir."},{"k":"d","t":"Sehm «السَّهْم»","x":"Her bir vârise verilen miktara denir."},{"k":"ornek","x":"Mahrecin 24 olduğu bir meselede ölen kişi geride bir kız çocuğu ve baba bırakmışsa bu kız çocuğunun aldığı pay 1/2'dir. Buna «فَرْض» denir. Bu 1/2 kızın 24'ten 12 pay alacağı anlamına gelir. Bu aldığı 12'ye ise «سَهْم» veya «نَصِيب» denir."},{"k":"d","t":"Mahreç","x":"Terikenin kaç sehime bölündüğünü gösteren sayı; ortak payda."},{"k":"d","t":"Cem’ ve aded «الْجَمْعُ وَالْعَدَد»","x":"Bir meseledeki birden fazla varis anlamına gelir. Mesela iki tane kız varsa buna cem’ denir. İbn Abbas’a göre cem’ olması için en az üç kız olmalı."},{"k":"d","t":"Asıl «الْأَصْل»","x":"Baba, anne, babanın babası ve yukarısı, anneanne ve babaanne. (Annenin babası ceddü’l-fâsid, annenin babasının annesi ceddetü’l-fâside.)"},{"k":"d","t":"Fer’ «الْفَرْع»","x":"Ölen kişinin oğlu, kızı, oğlunun oğlu, oğlunun kızı ve aşağısını ifade eder."},{"k":"d","t":"Havâşî «الْحَوَاشِي»","x":"Usul ve fürû dışındaki akrabalar. (Erkek ve kız kardeşler ve onların çocukları, amcalar ve çocukları)"},{"k":"d","t":"Vâris «الْوَارِث»","x":"Varis demektir; malı alacak kimse."},{"k":"d","t":"Mûris «الْمُورِث»","x":"Miras bırakan kişi."},{"k":"d","t":"Mevrûs / Terike","x":"Ölünün geride bıraktığı mal varlığı."},{"k":"d","t":"Tevrîs","x":"Varis kılmak."}]},{"h":"Kardeş Grupları","b":[{"k":"d","t":"Benü’l-a’yân «بَنُو الْأَعْيَان»","x":"Anne baba bir kız ve erkek kardeşlere denir: «الْأَخُ الشَّقِيقُ وَالْأُخْتُ الشَّقِيقَة». (Mesele çözerken «أخ ش»، «أخت ش» şeklinde yazılır.)"},{"k":"d","t":"Benü’l-allât «بَنُو الْعَلَّات»","x":"Baba bir kız ve erkek kardeşlere denir: «الْأَخُ لِأَبٍ وَالْأُخْتُ لِأَبٍ». (Mesele çözerken «أخ لأب»، «أخت لأب» şeklinde yazılır.)"},{"k":"d","t":"Benü’l-ahyâf «بَنُو الْأَخْيَاف»","x":"Anne bir kız kardeşlere ve erkek kardeşlere denir. (Mesele çözerken «أخ لأم»، «أخت لأم» şeklinde yazılır.)"},{"k":"tbl","r":[["Grup","Kimler","Tabloda yazılışı"],["**Benü’l-a’yân**","Anne baba bir (öz) kardeşler","«أخ ش» · «أخت ش»"],["**Benü’l-allât**","Baba bir kardeşler","«أخ لأب» · «أخت لأب»"],["**Benü’l-ahyâf**","Anne bir kardeşler","«أخ لأم» · «أخت لأم»"]]}]},{"h":"Asabe, Hacb ve Mahrumiyet","b":[{"k":"d","t":"Asabe «الْعَصَبَة»","x":"Sözlükte baba tarafından olan akraba demektir. Bir ve birden ziyade erkeğe ve kadına söylenir. (Mutlak olarak asabe denince akla asabe binefsihi gelir.) Muayyen hisse sahipleri yani ashâb-ı ferâiz kendi hisselerini aldıktan sonra geriye kalanı alırlar. Ashâb-ı ferâiz yoksa malın tamamını alırlar. (Mesele çözerken «ع» diye yazılır.)"},{"k":"d","t":"Hacb «الْحَجْب»","x":"Bir veya birkaç şahsın mirastan alacakları payların tamamının veya bir kısmının engellenmesidir."},{"k":"p","x":"Hacb ikiye ayrılır: 1. Hacb bilvasf, 2. Hacb bişşahs. Mirası engelleyen üç sebep vardır. Bu üç sebepten bir tanesi ile mirastan men olmaya hacb bilvasf (mahrum) denir."},{"k":"p","x":"Hacb bişşahs ikiye ayrılır: Hacb-ı hirman, hacb-ı noksan. Hacb-ı hirman bir kişinin mirastan alacağı payın tamamen engellenmesidir; oğlun kardeşleri hacbetmesi gibi. Hacb-ı noksan ise bir kişinin mirastan alacağı payın bir kısmının engellenmesidir; oğlun karının payını 1/4'ten 1/8’e düşürmesi gibi."},{"k":"d","t":"Mahcûb «الْمَحْجُوب»","x":"Hacbolan kişi demektir. (Mesele çözerken «م» diye yazılır.)"},{"k":"d","t":"Mahrûm «الْمَحْرُوم»","x":"Katl gibi bir sebepten dolayı normalde pay alacakken mirastan men olan kişi. (Mesele çözerken «مح» diye yazılır.)"},{"k":"d","t":"Sâkıt","x":"Mirastan tamamen düşen."},{"k":"tbl","r":[["İşaret","Anlamı"],["«ع»","Asabe (kalanı alır)"],["«م»","Mahcûb (başka bir varis yüzünden düştü)"],["«مح»","Mahrûm (katl gibi bir mâni yüzünden düştü)"]]}]},{"h":"Mesele Türleri: Avl, Red, Âdile","b":[{"k":"d","t":"Avl «الْعَوْل»","x":"Varislerin sehimlerinin/paylarının toplamının mahreçten büyük olduğu meselelerdir."},{"k":"ar","a":"أَنْ تَزِيدَ سِهَامُ الْفَرِيضَةِ عَنْ أَصْلِ هَذِهِ الْمَسْأَلَةِ فَيَدْخُلَ النُّقْصَانُ عَلَى أَهْلِ الْفَرَائِضِ","x":"Misal: «زوج، أخت ش، أخت لأب»"},{"k":"d","t":"Red «الرَّدّ»","x":"Varislerin paylarının toplamının mahreçten küçük olduğu meselelerdir. Bir meselenin reddiye olabilmesi için asabelerden kimsenin olmaması gerekir."},{"k":"ar","a":"نَقْصٌ فِي أَصْلِ الْمَسْأَلَةِ وَزِيَادَةٌ فِي مَقَادِيرِ السِّهَامِ الْمَفْرُوضَةِ","x":"Misal: «أخت ش، أخت لأب»"},{"k":"d","t":"Âdile «عَادِلَة»","x":"Varislerin paylarının toplamının mahrece eşit olduğu meselelerdir."},{"k":"d","t":"el-Aslü’l-âdil «الْأَصْلُ الْعَادِل»","x":"Âdile meselelerindeki mahrece denir."},{"k":"d","t":"el-Aslü’n-nâkıs «الْأَصْلُ النَّاقِص»","x":"Reddiye meselelerindeki mahrece denir. Mesela mahreç 6 iken payların toplamı 4 çıkıyorsa bu dörde aslü’n-nâkıs denir."},{"k":"d","t":"el-Aslü’l-âil «الْأَصْلُ الْعَائِل»","x":"Avliye meselelerindeki mahrece denir."},{"k":"tbl","r":[["Mesele","Sihamların toplamı","Mahrecin adı"],["**Âdile**","Mahrece eşit","el-Aslü’l-âdil"],["**Avliye**","Mahreçten büyük","el-Aslü’l-âil"],["**Reddiye**","Mahreçten küçük (asabe yok)","el-Aslü’n-nâkıs"]]}]},{"h":"Tashih ve Dört Nisbet","b":[{"k":"d","t":"Tashih «التَّصْحِيح»","x":"Varislerden bazılarının payının aded-i rüûsa tam bölünememesi sebebiyle yapılan işlemdir. Misal: Dinariye meselesi. (tashîhu’l-inkisâr)"},{"k":"d","t":"İnkisar «إِنْكِسَار»","x":"Varislerden bazılarının payının aded-i rüûsa tam bölünememesiyle ortaya çıkan küsuratlı duruma denir."},{"k":"d","t":"Cüz’ü’s-sehm «جُزْءُ السَّهْم»","x":"Mesele tashih edilirken payların çarpıldığı sayıdır."},{"k":"d","t":"en-Nisebü’l-erbaa «النِّسَبُ الْأَرْبَعَة»","x":"Aded-i rüûs ile sihâm arasındaki temâsül, tedâhül, tevâfuk ve tebâyün durumlarına denir."},{"k":"d","t":"Temâsül «التَّمَاثُل»","x":"Aded-i rüûs ile sihâm aynı ise buna temâsül denir. Mesela bir meselede üç amca varsa ve üç amcaya düşen pay da üç ise bu üçler arasında temâsül vardır."},{"k":"d","t":"Tedâhül «التَّدَاخُل»","x":"Aded-i rüûs ile sihâmın birbirine bölünebilmesidir. Misal: 3=6, 4=8. Diğer bir ifade ile sayılardan biri diğerinin katıdır."},{"k":"d","t":"Tevâfuk «التَّوَافُق»","x":"Aded-i rüûs ile sihâmın birbirine bölünemeyip üçüncü bir ortak bölene kalansız bölünebilmesidir. Bu ortak sayıya «الْقَاسِمُ الْمُشْتَرَك» denir. Misal: 4=6, ikisinin ortak böleni 2’dir."},{"k":"d","t":"Tebâyün «التَّبَايُن»","x":"Aded-i rüûs ile sihâmın birbirine bölünemeyip üçüncü bir ortak bölene de kalansız bölünememesidir. Misal: 4 ile 3 birbirine bölünmezler. Aynı zamanda aralarında ortak bir bölen de yoktur."},{"k":"tbl","r":[["Nisbet","Ne demek","Misal"],["**Temâsül**","İki sayı aynı","3 amca – 3 sehim"],["**Tedâhül**","Biri diğerinin katı","3–6, 4–8"],["**Tevâfuk**","Birbirine bölünmez, ortak böleni var","4–6 (ortak bölen 2)"],["**Tebâyün**","Birbirine bölünmez, ortak böleni yok","4–3"]]}]},{"h":"Tehârüc ve Münâsaha","b":[{"k":"d","t":"Tehârüc «التَّخَارُج»","x":"Varislerden birinin veya birkaçının terikeden muayyen bir miktar mal alarak mirastan çekilmek için diğer varisler ile sulh yapmasıdır."},{"k":"d","t":"Münâsaha «الْمُنَاسَخَة»","x":"Ölen kişinin mirası henüz paylaştırılmadan varislerden birinin ölmesidir. Münâsaha birkaç dereceli olabilir. Yani vefat eden kişinin malı paylaştırılmadan daha sonra gelen varisler vefat etmiş olabilir."}]}],"ht":[{"s":0,"x":"Farz = şâriin takdir ettiği pay (1/2, 1/6…); sehm = o payın mahreçteki karşılığı (24’te 12 gibi)."},{"s":0,"x":"Asıl: baba, anne, dedeler, neneler. Fer’: oğul, kız, oğlun oğlu, oğlun kızı ve aşağısı. Havâşî: kardeşler, amcalar ve çocukları."},{"s":1,"x":"Benü’l-a’yân öz, benü’l-allât baba bir, benü’l-ahyâf anne bir kardeşlerdir."},{"s":2,"x":"Tablo işaretleri: «ع» asabe, «م» mahcûb, «مح» mahrûm."},{"s":2,"x":"Hacb-ı hirman payın tamamen, hacb-ı noksan bir kısmının engellenmesidir (oğul karının payını 1/4’ten 1/8’e düşürür)."},{"s":3,"x":"Toplam = mahreç → âdile; toplam > mahreç → avliye; toplam < mahreç ve asabe yok → reddiye."},{"s":4,"x":"Dört nisbet (aded-i rüûs ile sihâm arasında): temâsül (eşit), tedâhül (biri diğerinin katı), tevâfuk (ortak böleni var), tebâyün (ortak böleni yok)."},{"s":4,"x":"Cüz’ü’s-sehm: tashihte payların çarpıldığı sayı."},{"s":5,"x":"Tehârüc: bir varisin mal karşılığında sulh ile mirastan çekilmesi. Münâsaha: miras paylaştırılmadan bir varisin de ölmesi."}],"oz":null},{"t":"Asabe","intro":"Asabenin tanımı ve kısımları: asabe binefsihi ve öncelik sırası (cihet, derece, kuvvet-i karâbet), asabe bi-gayrihi, asabe maa’l-gayr ve asabe-i sebebiyye.","s":[{"h":"Asabenin Tanımı ve Kısımları","b":[{"k":"d","t":"Asabe «الْعَصَبَة»","x":"Sözlükte baba tarafından olan akraba demektir. Bir ve birden ziyade erkeğe ve kadına söylenir. (Mutlak olarak asabe denince akla asabe binefsihi gelir.) Muayyen hisse sahipleri yani ashâb-ı ferâiz kendi hisselerini aldıktan sonra geriye kalanı alırlar. Ashâb-ı ferâiz yoksa malın tamamını alırlar."},{"k":"p","x":"Asabe ikiye ayrılır:"},{"k":"li","x":"a. Asabe-i nesebiyye"},{"k":"li","x":"b. Asabe-i sebebiyye"},{"k":"d","t":"Asabe-i nesebiyye","x":"Ölenle neseb/kan yönünden hısımlı olan kimselerdir ki bunlar üçe ayrılır: asabe binefsihi, asabe bi-gayrihi, asabe maa’l-gayr."},{"k":"tbl","r":[["Asabe","Kısmı","Kimler"],["**Asabe-i nesebiyye**","Binefsihi","Ölene araya kadın girmeden ulaşan erkekler"],["","Bi-gayrihi","Erkek kardeşleriyle asabe olan kadınlar"],["","Maa’l-gayr","Başka bir kadınla asabe olan kadınlar"],["**Asabe-i sebebiyye**","—","Mevle’l-atâka (azad eden)"]]}]},{"h":"Asabe Binefsihi","b":[{"k":"d","t":"Asabe binefsihi","x":"Vefat eden kimse ile araya kadın girmeden ulaşan erkek yakınlardır. Baba, oğul, babanın babası, oğlun oğlu gibi..."},{"k":"h","x":"Bu asabelerin öncelik sıralaması"},{"k":"n","n":1,"x":"Oğul"},{"k":"n","n":2,"x":"Oğlun oğlu"},{"k":"n","n":3,"x":"Oğlun oğlunun oğlu"},{"k":"n","n":4,"x":"Baba"},{"k":"n","n":5,"x":"Dede"},{"k":"n","n":6,"x":"Babanın babasının babası"},{"k":"n","n":7,"x":"Öz erkek kardeş"},{"k":"n","n":8,"x":"Baba bir erkek kardeş"},{"k":"n","n":9,"x":"Öz erkek kardeş oğlu"},{"k":"n","n":10,"x":"Baba bir erkek kardeş oğlu"},{"k":"n","n":11,"x":"Öz amca"},{"k":"n","n":12,"x":"Baba bir amca"},{"k":"n","n":13,"x":"Öz amca oğlu"},{"k":"n","n":14,"x":"Baba bir amca oğlu"},{"k":"li","x":"Bu asabeler bir meselede tek başına iseler malın tamamını alırlar. Misal: tek öz erkek kardeş."},{"k":"li","x":"Bu asabeler ashâb-ı ferâiz ile bulununca ashâb-ı ferâiz paylarını aldıktan sonra kalanı alırlar. Misal: karı, 4 tane baba bir kardeş ve amca."},{"k":"li","x":"Bazen ashâb-ı ferâiz paylarını aldıktan sonra geriye asabe için hiç mal kalmaz. Misal: koca, öz kız kardeş ve amca."}]},{"h":"Asabeler Arasında Öncelik","b":[{"k":"sc","q":"Asabelerde öncelik sıralaması nasıldır? Hangi asabenin diğer asabeden önce geldiği neye göre belirlenir?","x":"Bir asabenin diğer bir asabeye tercih edilmesi ve öncelenmesi sırasıyla şu 3 maddeye göre yapılır: kurb-i cihet, kurb-i derece, kuvvet-i karâbet."},{"k":"h","x":"1. Kurb-i cihet"},{"k":"ar","a":"بُنُوَّة، أُبُوَّة، أُخُوَّة، عُمُومَة","x":""},{"k":"p","x":"Bu 4 maddeden her birine cihet denir. Buna göre bir meselede oğul varsa baba veya dede asabe olmaz. Bir meselede baba varsa kardeş, kardeş varsa amcalardan biri asabe olamazlar. Diğer bir ifade ile cihet yönünden önce gelen sonra geleni hacbeder."},{"k":"p","x":"Burada akıllara şu soru gelebilir: Bir meselede baba ve oğul varsa, oğul babayı hacbedebilir mi? Buradaki öncelik sonralık sıralaması sadece asabeler arasındadır. Baba ise hem asabedir hem de ashâb-ı ferâizdendir. Dolayısıyla evet, bir meselede baba ve oğul varsa, oğul babanın asabelik yönünü hacbeder yani baba malın kalanını alamaz. Ancak babanın ashâb-ı ferâiz olma özelliğini hacbedemez. Bir meselede oğul varsa bile baba yine ashâb-ı ferâizdendir ve Kur'an-ı Kerim'de kendisine belirtilmiş olan 1/6 payını alır. Dede konusunda da aynı durum söz konusudur."},{"k":"ornek","x":"Misaller: «أب، ابن» — «أب، أخ ش» — «أخ ش، عم ش»"},{"k":"h","x":"2. Kurb-i derece"},{"k":"d","t":"Kurb-i derece","x":"Her bir cihet içerisindeki asabelerin yakından uzağa doğru olan sıralamasına denir."},{"k":"p","x":"Mesela «بُنُوَّة» ciheti içerisinde yer alan «ابن – ابن الابن – ابن ابن الابن» ayrı ayrı derecelerdirler. Buna göre bunuvvet ciheti içerisinde oğul varken oğlun oğlu, oğlun oğlu varken daha aşağısı asabe olamaz. Aynı şekilde ubuvvet ciheti içerisinde baba varken dede asabe olamaz. Uhuvvet ciheti içerisinde kardeş varken kardeşin oğlu asabe olamaz. Umûmet ciheti içerisinde amca varken amcanın oğlu asabe olamaz."},{"k":"ornek","x":"Misaller: «زوجة، ابن، ابن الابن» — «زوج، عم، ابن العم»"},{"k":"h","x":"3. Kuvvet-i karâbet"},{"k":"d","t":"Kuvvet-i karâbet","x":"Aynı cihet ve derece içerisinde yer alan asabelerin murise olan yakınlıklarının kuvvetini ifade eder."},{"k":"p","x":"Burada kastedilen sadece öz erkek kardeşin baba bir erkek kardeşe olan üstünlüğüdür. Bir meselede öz erkek kardeş varsa baba bir erkek kardeş asabe olamaz."},{"k":"ornek","x":"Misaller: «زوجة، أخ ش، أخ لأب» — «زوج، عم ش، عم لأب»"},{"k":"tbl","r":[["Ölçü","Ne demek","Örnek"],["**1. Kurb-i cihet**","Bunuvvet › ubuvvet › uhuvvet › umûmet","Oğul varken baba asabe olmaz"],["**2. Kurb-i derece**","Aynı cihette yakın olan uzağı düşürür","Oğul varken oğlun oğlu asabe olmaz"],["**3. Kuvvet-i karâbet**","Aynı cihet ve derecede öz olan baba bir olanı düşürür","Öz erkek kardeş varken baba bir erkek kardeş asabe olmaz"]]}]},{"h":"Asabe Bi-gayrihi","b":[{"k":"d","t":"Asabe bi-gayrihi","x":"Erkek kardeşleri ile birlikte olunca asabe olan, erkek kardeşleri olmayınca da belirli pay sahibi olan kadınlardır."},{"k":"p","x":"Bunlar 5 sınıftır:"},{"k":"li","x":"Kız oğlanla beraber,"},{"k":"li","x":"Oğlun kızı kendi derecesinde bulunan oğlunun oğlu ile beraber,"},{"k":"li","x":"Oğlun kızı kendisinden daha aşağıdaki bir oğul ile asabe bi-gayrihi olabilir. Ancak o oğlun kızının normalde mahcub olması şartıyla. Misal: 2 kız, 1 oğlun kızı bir de oğlun oğlunun oğlu. (Buradaki kardeş «ابن المبارك»)"},{"k":"li","x":"Ana baba bir kız kardeş ana baba bir erkek kardeşiyle beraber,"},{"k":"li","x":"Baba bir kız kardeş baba bir erkek kardeşiyle beraber asabe olur."},{"k":"not","x":"Bir meselede öz kız kardeş ve baba bir erkek kardeş varsa burada asabelik söz konusu olmaz. Öz kız kardeş 1/2 alır, baba bir erkek kardeş kalanı alır. Yani burada öz kız kardeş ile baba bir erkek kardeş beraber asabe olup ikili birli almazlar. Aynı şekilde öz erkek kardeş ile baba bir kız kardeş bir meselede bulunduğu zaman da asabe olup malı paylaşmaları söz konusu değildir. Öz erkek kardeş asabedir. Baba bir kız kardeş hacb olur."},{"k":"not","x":"Asabe bi-gayrihi murisin fürûu ne kadar aşağı inerse insin devam eder. Mesela dördüncü kuşaktaki oğul dördüncü kuşaktaki kızı asabe yapar. Ancak bu durum sadece murisin fürûu konusunda böyledir. Murisin kardeşlerinin çocukları böyle değildir. Mesela murisin kız kardeşi erkek kardeşiyle beraber asabe bi-gayrihi olur. Ancak murisin erkek kardeşinin oğlu murisin erkek kardeşinin kızını asabe yapmaz."},{"k":"d","t":"İbnü’l-mübârek «ابْنُ الْمُبَارَك»","x":"Kendisinden yukarıdaki, normalde mahcub olan oğlun kızını asabe bi-gayrihi yapan aşağı derecedeki oğul (misal: 2 kız, oğlun kızı, oğlun oğlunun oğlu)."}]},{"h":"Asabe Maa’l-gayr","b":[{"k":"d","t":"Asabe maa’l-gayr","x":"Diğer bir kadın ile bulunduklarında asabe olan kadınlardır."},{"k":"li","x":"Öz kız kardeş: kızla veya oğlun kızı veyahut oğlun oğlunun kızı ile beraber. (Örneğin bir meselede kız ve öz kız kardeş varsa kız malın yarısını alır, geri kalanı kız kardeş alır çünkü asabedir.)"},{"k":"li","x":"Baba bir kız kardeş: kızla veya oğlun kızı veyahut oğlunun oğlunun kızı ile beraber olunca asabe olurlar."},{"k":"sc","q":"Asabe bi-gayrihi ile maa’l-gayr arasında ne fark vardır?","x":"Aralarında 3 fark vardır: (1) Asabe bi-gayrihi, kadınların erkeklerle aynı meselede bulunması ile olur; asabe maa’l-gayr ise kadınların kadınlarla beraber aynı meselede olması ile olur. (2) Asabe bi-gayrihi'de kadın ile erkek beraber aynı malı ikili birli paylaşırlar: «وَلِلذَّكَرِ مِثْلُ حَظِّ الْأُنْثَيَيْنِ». (3) Asabe maa’l-gayr'de ise ashâb-ı ferâiz payını alır, asabe maa’l-gayr olan kişi kalanı alır. Bazen de hiçbir şey kalmaz. Misal: kız, oğlun kızı ve öz kız kardeş. Misal: koca, 2 kız, anne, öz kız kardeş."},{"k":"ornek","x":"Misaller: «بنت، أخت لأب، عم ش» — «بنت، أخت ش، عم ش» — «بنت، أخت ش» — «بنت (2)، بنت ابن، أخت ش، أخ لأب»"},{"k":"ar","a":"قَاعِدَة: إِذَا اجْتَمَعَتْ عَصَبَةٌ بِغَيْرِهِ وَعَصَبَةٌ مَعَ غَيْرِهِ تُقَدَّمُ عَصَبَةٌ بِغَيْرِهِ عَلَى عَصَبَةٍ مَعَ غَيْرِهِ","x":"Misal: «زوجة، بنت، أخت لأب، أخ لأب»"},{"k":"tbl","r":[["","Asabe bi-gayrihi","Asabe maa’l-gayr"],["**Kiminle**","Erkek kardeşiyle","Başka bir kadınla (kız, oğlun kızı)"],["**Kimler**","Kız, oğlun kızı, öz ve baba bir kız kardeş","Öz ve baba bir kız kardeş"],["**Nasıl alır**","Erkekle beraber ikili birli","Ashâb-ı ferâizden kalanı (bazen hiç kalmaz)"]]}]},{"h":"Asabe-i Sebebiyye","b":[{"k":"d","t":"Asabe-i sebebiyye","x":"Mevle’l-atâka: bir köle veya cariyeyi, gerek erkek olsun gerek kadın olsun, azad eden kimsedir ve onun asabesidir."},{"k":"p","x":"Mesela azad edilmiş bir köle veya cariye öldüğünde neseb yönünden asabesi yoksa sıra sebebî asabelere gelir ki o da kendisini azad eden efendisidir. Efendi onun varisi olur."},{"k":"d","t":"Mevle’l-muvâlât yoluyla asabe","x":"Bir kimse diğerine “sen benim velimsin; öldüğüm zaman bana varis olacaksın, bir cinayet işlediğim zaman benim yerime diyet ödeyeceksin” der ve o da kabul ederse aralarında asabelik oluşur."}]}],"ht":[{"s":0,"x":"Asabe ashâb-ı ferâizden kalanı, onlar yoksa malın tamamını alır. Kısımları: nesebiyye (binefsihi, bi-gayrihi, maa’l-gayr) ve sebebiyye."},{"s":1,"x":"Asabe binefsihi sırası: oğul › oğlun oğlu › baba › dede › öz erkek kardeş › baba bir erkek kardeş › bunların oğulları › öz amca › baba bir amca › amca oğulları."},{"s":2,"x":"Asabeler arasında öncelik sırasıyla: kurb-i cihet (bunuvvet, ubuvvet, uhuvvet, umûmet), kurb-i derece, kuvvet-i karâbet."},{"s":2,"x":"Oğul babanın asabelik yönünü hacbeder ama 1/6’sını hacbedemez; dede için de aynısı geçerlidir."},{"s":3,"x":"Asabe bi-gayrihi 5 sınıf: kız (oğulla), oğlun kızı (oğlun oğluyla veya aşağıdaki oğulla), öz kız kardeş (öz erkek kardeşle), baba bir kız kardeş (baba bir erkek kardeşle)."},{"s":3,"x":"Asabe bi-gayrihi fürûda ne kadar aşağı inerse insin devam eder; kardeş çocuklarında olmaz (kardeşin oğlu kız kardeşini asabe yapmaz)."},{"s":4,"x":"Asabe maa’l-gayr: öz veya baba bir kız kardeş, kız veya oğlun kızı ile beraber olunca kalanı alır."},{"s":4,"x":"Kaide: asabe bi-gayrihi ile asabe maa’l-gayr bir araya gelirse bi-gayrihi öne geçer."},{"s":5,"x":"Asabe-i sebebiyye: köleyi azad eden efendi (mevle’l-atâka); nesebî asabe yoksa varis olur."}],"oz":null},{"t":"Hacb ve Ashâb-ı Ferâiz","intro":"Hacbin kısımları ve kaideleri, hacb-ı noksanın meydana gelme şekilleri; on iki ashâb-ı ferâiz, kırk hal ve Kur'an'daki altı pay.","s":[{"h":"Hacbin Tanımı ve Önemi","b":[{"k":"d","t":"Hacb «الْحَجْب»","x":"Normalde mirastan pay alacak kimselerin belli durumlarda paylarının engellenmesidir."},{"k":"p","x":"Hacb konusu feraiz ilmindeki en önemli konulardan bir tanesidir. Hatta alimler bu konu hakkında şöyle demişlerdir:"},{"k":"ar","a":"يَحْرُمُ عَلَى مَنْ لَمْ يَعْرِفِ الْحَجْبَ أَنْ يُفْتِيَ فِي الْفَرَائِضِ","x":""},{"k":"p","x":"Hacb ikiye ayrılır: hacb bilvasf ve hacb bişşahs."},{"k":"d","t":"Hacb bilvasf «حَجْبٌ بِالْوَصْف»","x":"İleride okuyacağımız üzere mirası engelleyen 3 durum vardır: «الْقَتْل، الرِّقّ، اخْتِلَافُ الدِّين» (kölelik, öldürme, din değişikliği). Bu üç sebepten bir tanesi ile mirastan men olmaya hacb bilvasf denir. (hacb bilvasf = mahrum)"},{"k":"d","t":"Hacb bişşahs «حَجْبٌ بِالشَّخْص»","x":"Normalde mirastan pay alacak olan birinin cihet, derece veya kuvvet-i karâbet yönünden kendisinden önde olan birisi sebebiyle mirastan pay alamamasıdır."},{"k":"d","t":"Dede yetimi","x":"Babası, dedesinden daha önce öldüğü için mirastan (dedenin mirasından) mahrum kalan çocuktur."}]},{"h":"Hacb-ı Hirman","b":[{"k":"d","t":"Hacb-ı hirman","x":"Varislerden birinin mirastan tamamen men olmasıdır."},{"k":"p","x":"Hacb-ı hirmana hiç uğramayan 6 kişi vardır. Bunlar: oğul, kız, anne, baba, karı, koca. «الْأَبَوَانِ، الزَّوْجَانِ، الِابْنُ وَالْبِنْتُ»"},{"k":"h","x":"Hacb-ı hirmanın 3 kaidesi"},{"k":"ar","a":"الْقَاعِدَةُ الْأُولَى: كُلُّ مَنْ يَصِلُ إِلَى الْمَيِّتِ بِوَاسِطَةٍ فَتُحْجَبُ بِتِلْكَ الْوَاسِطَةِ","x":"[[Ölüye bir vasıta ile ulaşan, o vasıta ile hacbolur.]]"},{"k":"ar","a":"مِثَال: ابْنُ الِابْنِ يُحْجَبُ بِالِابْنِ، وَالْجَدُّ يُحْجَبُ بِالْأَبِ، وَأُمُّ الْأُمِّ تُحْجَبُ مَعَ الْأُمِّ، وَبِنْتُ الِابْنِ تُحْجَبُ مَعَ الِابْنِ","x":""},{"k":"ar","a":"اسْتِثْنَاء: وَاسْتُثْنِيَتْ مِنْ هَذِهِ الْقَاعِدَةِ الْأَخُ وَالْأُخْتُ لِأُمٍّ يَصِلَانِ إِلَى الْمَيِّتِ بِوَاسِطَةِ الْأُمِّ وَلَكِنَّهُمَا لَا يُحْجَبَانِ مَعَ وُجُودِ الْأُمِّ","x":""},{"k":"ar","a":"الْقَاعِدَةُ الثَّانِيَة: خَاصَّةٌ بِالْعَصَبَةِ، وَهِيَ التَّقْدِيمُ بِالْجِهَةِ وَالتَّقْدِيمُ بِالدَّرَجَةِ وَالتَّقْدِيمُ بِالْقَرَابَةِ","x":""},{"k":"ar","a":"الْقَاعِدَةُ الثَّالِثَة: الْأُصُولُ لَا يُحْجَبُونَ إِلَّا بِالْأُصُولِ، وَالْفُرُوعُ لَا يُحْجَبُونَ إِلَّا بِالْفُرُوعِ، وَالْحَوَاشِي يُحْجَبُونَ بِالْأُصُولِ وَالْفُرُوعِ وَالْحَوَاشِي","x":"(havâşî: usul ve fürû dışındaki asabeler)"},{"k":"tbl","r":[["Kaide","Özü","İstisna / not"],["**1. Vasıta kaidesi**","[[Ölüye bir vasıtayla ulaşan o vasıtayla düşer (oğlun oğlu oğulla, dede babayla)]]","[[Anne bir kardeşler anne ile düşmez]]"],["**2. Asabe kaidesi**","[[Cihet, derece ve karâbetle öncelik]]","[[Yalnız asabeler arasında]]"],["**3. Usul–fürû–havâşî**","[[Usul yalnız usulle, fürû yalnız fürûla düşer; havâşî üçüyle de düşer]]","—"]]}]},{"h":"Hacb-ı Noksan","b":[{"k":"d","t":"Hacb-ı noksan","x":"Varislerden birinin payının azalmasıdır."},{"k":"sc","q":"Hacb bilvasf ve hacb bişşahs arasında ne fark vardır?","x":"Hacb bilvasf olduğu zaman mahcub olan kişi yok hükmündedir. Kendisi mirastan pay alamadığı gibi hiç kimsenin payını da etkileyemez (misal: «زوجة، أب، ابن قاتل»). Hacb bişşahs ile mahcub olan kimse ise mirastan pay almamakla beraber başkasının payını etkiler. Yani pay almadığı halde var hükmündedir (misal: «أب، أم، أخ ش (2)»)."},{"k":"h","x":"Hacb-ı noksanın meydana gelme şekilleri"},{"k":"h5","x":" hakların sırası"},{"k":"tbl","r":[["Sıra","Hanefî, Şâfiî, Mâlikî","Hanbelî, Zâhirî"],["**1**","«الحقوق العينية»","«التجهيز والتكفين»"],["**2**","«التجهيز والتكفين»","«الحقوق العينية»"],["**3**","«الديون المرسلة»","«الديون المرسلة»"],["**4**","«تنفيذ الوصايا»","«تنفيذ الوصايا»"],["**5**","«تقسيم الميراث»","«تقسيم الميراث»"]]}]},{"h":"Başkasına Ait Haklar","b":[{"k":"p","x":"Terike üzerindeki haklar denilince kastedilen bu bölümdür. Bu haklar 4 tanedir."},{"k":"steps","x":["**Teçhiz ve tekfin** «التجهيز والتكفين»","**Kazâ-i düyûn** «قضاء الديون»","**Vasiyet** «تنفيذ الوصايا»","**Mirasın taksimi** «تقسيم التركة»"]},{"k":"h","x":"1. Teçhiz ve tekfin «التَّجْهِيزُ وَالتَّكْفِين»"},{"k":"p","x":"Bu maddeye ölünün yıkanması, kefenlenmesi, kabrinin [[kazılması]], kabre taşınması ve defnedilmesi gibi öldükten sonraki tüm masraflar girer."},{"k":"p","x":"Şafii mezhebine ve Ebû Yûsuf'a göre -ki Hanefilerde müftâ bih olan görüş budur- vefat eden muristen bir lahza dahi önce vefat etmiş olan ve nafakası murise bağlı olan baba, çocuk ve eş gibi kimselerin de teçhiz ve tekfinin masrafları murise bağlıdır. Yani muris kendisinden hemen önce vefat etmiş olan oğlunun, eşinin veya anne babasının bu masrafları da terikeden karşılanır."},{"k":"p","x":"Muris vefat edince geriye hiç mal bırakmazsa dünyada iken nafakası kimin üzerine lazım geliyorduysa teçhiz ve tekfin masrafları da o kimseye aittir. Mesela bir kimse ölse geriye oğlu ve annesi kalırsa teçhiz ve tekfin masrafları mirastaki hisse oranlarına göre bu iki varise aittir."},{"k":"p","x":"Teçhiz ve tekfin işlemleri tebzîr ve taktîre kaçmadan yapılır. Yani vefat eden kişinin kefenlenmesi veya mezarının yapılması konusunda israfa kaçılmamalıdır."},{"k":"d","t":"Tebzîr / taktîr","x":"Teçhiz ve tekfinde kaçınılması gereken aşırılık (israf) ve cimrilik."},{"k":"h","x":"2. Kazâ-i düyûn «قَضَاءُ الدُّيُون»"},{"k":"p","x":"Düyûnü’l-mürsele ve mutlaka «الدُّيُونُ الْمُرْسَلَةُ أَوِ الْمُطْلَقَة» diye de isimlendirilen bu borçlar Allah borçları ve kul borçları diye ikiye ayrılır."},{"k":"d","t":"Allah borçları «دُيُونُ اللَّه»","x":"Ölünün zekât, kefaret, adak, hac ve umre gibi borçlarıdır."},{"k":"p","x":"Hanefi mezhebine göre murisin vefat etmesi ile bu borçlar düşer. Ancak muris hayatta iken bunların ödenmesini vasiyet etmiş ise bu borçların malın üçte birinden karşılanması varislere vaciptir. Şayet vasiyet etmemişse varisler bu borçları eda etmek zorunda değiller. Şafiî mezhebine göre ise muris vasiyet etse de etmese de varisler bu borçları ödemek zorundalar."},{"k":"d","t":"Kul borçları «دُيُونُ الْعِبَاد»","x":"Karz-ı hasen, alınan bir eşyanın parası, işçi ücreti ve zevceye verilecek mehir gibi borçlardır."},{"k":"p","x":"Hanefi mezhebine göre önce kul borçları ölünün geriye bıraktığı malın tamamından çıkarılır. Bu borçlar çıkarıldıktan sonra malın üçte biri henüz bitmemiş ise sıra Allah borçlarına gelir. Şafii mezhebine göre ise önce Allah borçları, sonra kul borçları karşılanır."},{"k":"p","x":"Kul borçları da «دُيُونُ الصِّحَّة» ve «دُيُونُ الْمَرَض» diye ikiye ayrılır."},{"k":"d","t":"Sıhhat borçları «دُيُونُ الصِّحَّة»","x":"Kişinin henüz sağlığında iken üzerinde bulunduğundan söz ettiği borçlardır."},{"k":"d","t":"Hastalık borçları «دُيُونُ الْمَرَض»","x":"Kişi ölüm döşeğinde iken üzerinde var olduğunu ikrar ettiği borçlardır."},{"k":"p","x":"Cumhura göre sıhhat ile hastalık borçları arasında herhangi bir öncelik sıralaması yoktur. İkisi de eşittir. Hanefi mezhebine göre ise sıhhat borçları hastalık borçlarından önce gelir."},{"k":"tbl","r":[["Sıra","Şâfiî","Hanefî"],["**1**","«ديون الله»","«ديون الصحة»"],["**2**","«ديون العباد» (bu maddede sıhhat ve hastalık borçları eşittir)","«ديون المرض»"],["**3**","—","«ديون الله»"]]},{"k":"h","x":"3. Vasiyet «وَصِيَّة»"},{"k":"p","x":"Vefat eden kimsenin teçhiz-tekfin ve borçlarından sonra geriye kalan malın üçte birinden vasiyeti yerine getirilir. Kur'an-ı Kerim'de her ne kadar vasiyet «مِنْ بَعْدِ وَصِيَّةٍ يُوصِي بِهَا أَوْ دَيْنٍ» borçlardan önce zikredilmişse de sünnete baktığımız zaman uygulama, borçların vasiyetten önce gelmesi şeklindedir."},{"k":"ar","a":"عَنْ عَلِيٍّ: «أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَضَى بِالدَّيْنِ قَبْلَ الْوَصِيَّةِ»","x":""},{"k":"p","x":"Vasiyet, terike üzerindeki bütün haklar ödendikten sonra geriye kalan malın sadece üçte birinden yerine getirilir. Ancak vefat eden murisin varisleri duruma razı olurlarsa geriye kalan malın üçte birinden fazlası da verilebilir."},{"k":"ornek","x":"Muris vefat edip geriye sadece 90.000 lira bırakırsa, eğer bir yere bağışlanması için 45 bin lira verilmesini vasiyet etmişse sadece 30 bin lira verilir. Ancak varisler razı olurlarsa veya muris vefat ettikten sonra geriye hiç varisi yoksa 45 bin lira verilir. Eğer vefat eden muris geriye 100.000 liralık borç bırakmışsa mirasın tamamı borçlulara gider, vasiyeti de yerine getirilmez."},{"k":"h","x":"4. Mirasın taksimi «تَقْسِيمُ التَّرِكَة»"},{"k":"p","x":"Kişi vefat ettikten sonra geriye bıraktığı maldan evvela teçhiz ve tekfin masrafları karşılanır. Sonra geriye kalan malın tümünden kul borçları çıkarılır. Kul borçları da çıkarıldıktan sonra geriye kalan malın üçte birinden Allah borçları çıkarılır. Allah borçları da çıkarıldıktan sonra geriye kalan malın üçte birinden vasiyet yerine getirilir. Vasiyet yerine getirildikten sonra geriye mal kaldıysa varisler arasında İslam miras hukukuna göre taksim edilir."},{"k":"steps","x":["Teçhiz ve tekfin masrafları karşılanır.","Kalan malın tümünden kul borçları çıkarılır.","Kalanın üçte birinden Allah borçları çıkarılır.","Kalanın üçte birinden vasiyet yerine getirilir.","Kalan mal varisler arasında taksim edilir."]},{"k":"d","t":"Şer’î intikal","x":"Ölünün terikesinin mirasçılara intikali."},{"k":"d","t":"Âdî intikal","x":"Ölenin bıraktığı terikeden emîrî (mülkiyeti devlete ait) arazi ile müsakkafât ve müstağallât adı verilen vakıf arazi ve akarların özel kanunlara göre intikal hakkı sahiplerine geçmesidir."},{"k":"d","t":"Kazâ-i taksim","x":"Terikenin nass (ayet ve hadis) ile belirlenen şekilde taksim edilmesi."},{"k":"d","t":"Rızâ-i taksim","x":"Bütün varislerin anlaşıp rızalaşarak yaptığı taksim. Varisler arasında bulûğ çağına girmemiş çocuk varsa yapılamaz."}]}],"ht":[{"s":0,"x":"Aynî haklar (rehin, satılmış ama teslim edilmemiş mal, peşin kira, ariyet, emanet) Hanefî, Şâfiî ve Mâlikîlere göre teçhiz-tekfinden önce, Hanbelîlere göre sonra gelir."},{"s":1,"x":"Terikeden sırasıyla: teçhiz-tekfin › kul borçları (malın tamamından) › Allah borçları (kalanın üçte birinden) › vasiyet (kalanın üçte birinden) › taksim."},{"s":1,"x":"Hanefîlere göre Allah borçları ancak vasiyet edilmişse üçte birden ödenir; Şâfiîlere göre vasiyet edilmese de ödenir ve kul borçlarından önce gelir."},{"s":1,"x":"Ayette vasiyet borçtan önce anılsa da Hz. Peygamber borcu vasiyetten önce ödemiştir."},{"s":1,"x":"Vasiyet üçte birle sınırlıdır; varisler razı olursa ya da hiç varis yoksa fazlası verilir."}],"oz":null},{"t":"Mirasın Rükün, Şart, Sebep ve Mânileri","intro":"Mirasın üç rüknü ve üç şartı (murisin ölümü, varisin hayatta olması, yakınlık cihetinin bilinmesi), üç sebebi (neseb, nikâh, velâ) ve mirası engelleyen mâniler (kölelik, katl, din ve ülke ayrılığı).","s":[{"h":"Mirasın Rükünleri","b":[{"k":"p","x":"Mirasın rükün, şart ve sebepleri «أَرْكَانُ الْمِيرَاثِ وَشُرُوطُهُ وَأَسْبَابُهُ»:"},{"k":"n","n":1,"x":"Varis (miras alacaklar)"},{"k":"n","n":2,"x":"Muris (miras bırakan ölü)"},{"k":"n","n":3,"x":"Mevrûs (miras malı)"}]},{"h":"Mirasın Şartları","b":[{"k":"h","x":"1. Murisin ölümü «مَوْتُ الْمُورِث»"},{"k":"p","x":"Ölüm üç kısma ayrılır: hakikaten ölüm, hükmen ölüm, takdiren ölüm."},{"k":"d","t":"Hakikaten ölüm «الْمَوْتُ الْحَقِيقِيّ»","x":"Kişinin hakikaten ölmesidir. Bu da ya şahitlerin bildirmesi ya da duyma ile veya öldüğüne dair bir delilin elde edilmesiyle sabit olur."},{"k":"ar","a":"هُوَ انْعِدَامُ الْحَيَاةِ إِمَّا بِالْمُعَايَنَةِ كَمَا إِذَا شُوهِدَ مَيِّتًا، أَوْ بِالسَّمَاعِ أَوْ بِالْبَيِّنَةِ","x":""},{"k":"d","t":"Hükmen ölüm «الْمَوْتُ الْحُكْمِيّ»","x":"Hâkimin hükmüyle sabit olan ölüm; mefkûdun ölümü gibi."},{"k":"ar","a":"هُوَ أَنْ يَكُونَ بِحُكْمِ الْقَاضِي، مِثَالُهُ: الْمَفْقُودُ. وَمَوْتُ الْمَفْقُودِ يَثْبُتُ بِشَهَادَةِ شَاهِدَيْنِ أَوْ بِحُكْمِ الْقَاضِي. وَإِذَا قَضَى الْقَاضِي بِحُكْمِ مَوْتِ الْمَفْقُودِ فَتَارِيخُ وَفَاتِهِ مِنْ وَقْتِ قَرَارِ الْقَاضِي","x":""},{"k":"p","x":"Mefkûdun ölümü ya iki şahidin şehadetiyle veya kâdının/hâkimin hükmetmesi ile belli olur. Bir kişinin ölü olduğuna dair hâkim tarafından karar verilmedikçe o kişi hayatta sayılır. Hâkim karar verdikten sonra ise o kişinin ölüm tarihi hâkimin karar verdiği gündür. Mefkûd olan kişi bir başkasına varis olmuşsa sağ bir şekilde geri dönünceye kadar veya ölü olduğuna hükmedilinceye kadar kendi payı bekletilir. Diğer varisler arasında taksim edilmez."},{"k":"d","t":"Takdiren ölüm «الْمَوْتُ التَّقْدِيرِيّ»","x":"Ceza olarak düşürene ğurre (tam diyetin 20'de biri yani Hanefilere göre 500, cumhura göre 600 dirhem) diye bir tazminat ödettirilen, ana karnındaki yavrunun ölümüdür."},{"k":"ar","a":"هُوَ إِلْحَاقُ الشَّخْصِ بِالْمَوْتَى تَقْدِيرًا، وَذَلِكَ فِي الْجَنِينِ الَّذِي انْفَصَلَ بِجِنَايَةٍ عَلَى أُمِّهِ، وَهِيَ الَّتِي تُوجِبُ الْغُرَّةَ بِأَنْ يَضْرِبَ شَخْصٌ امْرَأَةً حَامِلًا فَتُلْقِيَ جَنِينًا مَيِّتًا فَتَجِبَ الْغُرَّةُ، وَتُقَدَّرُ بِنِصْفِ عُشْرِ الدِّيَةِ الْكَامِلَةِ. لَكِنِ اخْتَلَفَ الْفُقَهَاءُ فِي هَذَا الْجَنِينِ: قَالَ أَبُو حَنِيفَةَ إِنَّ هَذَا الْجَنِينَ يَرِثُ وَيُورَثُ لِأَنَّهُ يُقَدَّرُ أَنَّهُ كَانَ حَيًّا وَقْتَ الْجِنَايَةِ وَأَنَّهُ مَاتَ بِسَبَبِهَا، وَقَالَ الْجُمْهُورُ لَا يَرِثُ هَذَا الْجَنِينُ لِأَنَّهُ لَمْ تَتَحَقَّقْ حَيَاتُهُ فَلَمْ تَتَحَقَّقْ أَهْلِيَّتُهُ لِلتَّمَلُّكِ","x":""},{"k":"p","x":"Bu düşük çocuk takdiren ölmüş kabul edilir. Bu çocuk muris sayılır. Çocuğun düşmesine sebep olan muskitin «مُسْقِط» ödeyeceği ğurre ise terike sayılıp geri kalan varisler arasında paylaştırılır."},{"k":"p","x":"Eğer herhangi bir müdahale olmadan cenin kendisi anne karnında ölürse bütün alimlerin ittifakıyla o cenin mirastan pay alamaz «لَا يَرِثُ وَلَا يُورَثُ». Ancak cenin kürtaj veya anne karnına darp gibi dışarıdan bir müdahale ile ölürse bu durumda ceninin varis ve muris olup olamayacağı konusunda ihtilaf vardır:"},{"k":"tbl","r":[["Görüş","Hüküm","Gerekçe"],["**Cumhur**","«لا يرث ولا يورث»","Mirasın şartlarından biri hayatta olmaktır."],["**Hanefî**","«يرث ويورث»","Dışarıdan bir müdahale ile hayatına son verildiği için çocuk hükmen de olsa hayatta sayılır."]]},{"k":"d","t":"Ğurre","x":"Hamile kadına yapılan darp sonucu düşen cenin için ödenen tazminat; tam diyetin yirmide biri (Hanefilere göre 500, cumhura göre 600 dirhem)."},{"k":"h","x":"2. Vârisin hayatta olması «حَيَاةُ الْوَارِث»"},{"k":"ar","a":"قَالَ تَعَالَى: ﴿يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنْثَيَيْنِ﴾ فَحَرْفُ اللَّامِ لِلتَّمْلِيكِ، وَالتَّمْلِيكُ لَا يَكُونُ إِلَّا لِحَيٍّ، فَلَا بُدَّ مِنْ تَحْقِيقِ حَيَاةِ الْوَارِثِ بَعْدَ مَوْتِ الْمُورِثِ وَلَوْ لِلَحَظَاتٍ","x":""},{"k":"d","t":"Hakikaten hayatta olmak «الْحَيَاةُ الْحَقِيقِيَّة»","x":"Muris öldükten sonra varisin gerçek manada hayatta olması ve yaşıyor olmasıdır."},{"k":"d","t":"Hükmen hayatta olmak «الْحَيَاةُ الْحُكْمِيَّة»","x":"Anne karnındaki ceninin hayatı. Muris vefat ettiği anda ceninin hayatta olduğu biliniyorsa ister mudğa olsun ister alaka şeklinde olsun o cenin hükmen hayatta sayılır ve mirasçı olur."},{"k":"ar","a":"وَالْجَنِينُ يَرِثُ وَيُورَثُ بِشَرْطَيْنِ: الْأَوَّلُ: أَنْ يَكُونَ حَيًّا فِي بَطْنِ أُمِّهِ لَحْظَةَ وَفَاةِ الْمُورِثِ، وَالثَّانِي: أَنْ يَخْرُجَ مِنْ بَطْنِ أُمِّهِ حَيًّا","x":"[[Cenin iki şartla varis olur: murisin vefatı anında anne karnında hayatta olması ve anne karnından canlı doğması.]]"},{"k":"h","x":"3. Yakınlık cihetinin bilinmesi «الْعِلْمُ بِجِهَةِ الْمِيرَاث»"},{"k":"p","x":"Vefat eden kişinin ardında kalan kimselerin vefat eden kişiyle aralarındaki yakınlık bağının bilinmesi. Bu yakınlık zevciyet, neseb veya velâ olabilir. Şayet bu durum bilinmiyorsa mirasçı olamazlar."},{"k":"tbl","r":[["Şart","Kısımları"],["**1. Murisin ölümü**","Hakikaten · hükmen (mefkûd) · takdiren (ğurre gerektiren cenin)"],["**2. Varisin hayatta olması**","Hakikaten · hükmen (anne karnındaki cenin)"],["**3. Yakınlık cihetinin bilinmesi**","Zevciyet · neseb · velâ"]]}]},{"h":"Mirasın Sebepleri","b":[{"k":"h","x":"1. Neseb «نَسَب»"},{"k":"ar","a":"كُلُّ وَاحِدٍ مِنْ أَصْحَابِ الْفَرَائِضِ وَالْعَصَبَةِ وَذَوِي الْأَرْحَامِ يَصِلُونَ إِلَى الْمُورِثِ بِسَبَبِ النَّسَبِ، وَهُمْ يَتَشَكَّلُونَ مِنَ الْأُصُولِ وَالْفُرُوعِ وَالْحَوَاشِي","x":""},{"k":"p","x":"Varis ile muris arasındaki yakınlığın sebebinin kan bağı olmasıdır. Karı ve koca dışındaki bütün ashâb-ı ferâiz, asabe-i nesebiyye ve zevi'l-erhamın varis olmaları neseb sebebi ile gerçekleşmektedir."},{"k":"h","x":"2. Nikâh «نِكَاح»"},{"k":"ar","a":"إِذَا تَمَّ عَقْدُ النِّكَاحِ بَيْنَ الزَّوْجَيْنِ سَيَثْبُتُ التَّوَارُثُ بَيْنَهُمَا وَلَا يُشْتَرَطُ فِيهِ الدُّخُولُ وَالْخَلْوَةُ، وَإِذَا كَانَ الْعَقْدُ بَاطِلًا أَوْ فَاسِدًا لَا تَوَارُثَ بَيْنَهُمَا","x":""},{"k":"p","x":"Eşler arasında nikâh kıyıldıktan sonra zifaf ve halvet meydana gelmese bile birbirlerine mirasçı olurlar. Boşanma durumunda kadın ric'î talaktan dolayı iddet bekliyorsa kocasına mirasçı olur. Eğer talak bâin ise mirasçı olmazlar. Fasid ve batıl nikâhlarda ise tevârüs yoktur."},{"k":"h","x":"3. Velâ «وَلَاء»"},{"k":"p","x":"Velâ iki kısımdır:"},{"k":"d","t":"Mevle’l-atâka","x":"Bir kimsenin kölesini azad etmesi veya müdebber yahut cariye bulunan yakın akrabasını satın alması gibi. Burada köle değil onu azad eden mirasçı olur. Köle mirasçı olmaz."},{"k":"d","t":"Mevle’l-muvâlât","x":"Nesebi bilinmeyen bir kimsenin başka bir kimseye “sen benim mevlamsın. Ölürsem benim vârisimsin. Bir cinayet işlersem diyetimi sen ödersin” dese ve o kimse de öylece kabul etse bir muvâlât akdi yapılmış olur ki ikinci şahıs nesebi bilinmeyen birinci şahsın mevlası olur."}]},{"h":"Mirasın Mânileri","b":[{"k":"p","x":"Mezhep alimlerinin tamamı 3 mâni hakkında ittifak etmişlerdir «الرِّقُّ وَالْقَتْلُ وَاخْتِلَافُ الدِّين». Hanefi mezhebi mirası engelleyen bu üç maddeye ek olarak «اخْتِلَافُ الدَّار» maddesini eklemişlerdir. Maliki mezhebine göre ise mirası engelleyen maddeler 7 tanedir."},{"k":"h","x":"Hanefi mezhebine göre irsin mânileri"},{"k":"p","x":"Mirası engelleyen 3 durum vardır: Bunlar kölelik, katl ve din ayrılığıdır. Kölelik ve din ayrılığı iki tarafın da birbirine mirasçı olmasını engeller. Adam öldürme ise sadece katilin öldürülene varis olmasını engeller. Ancak maktul katile varis olabilir. Mesela katil maktulde öldürücü bir yaraya sebep olursa ve kendisi maktulden önce herhangi bir sebeple vefat ederse, şayet aralarında mirasın sebeplerinden biri varsa maktul katile mirasçı olabilir."},{"k":"ar","a":"مَوَانِعُ الْإِرْثِ ثَلَاثَةٌ: اثْنَانِ مِنْهَا تَمْنَعُ الْمِيرَاثَ مِنْ جَانِبَيْنِ وَهُمَا الرِّقُّ وَاخْتِلَافُ الدِّينِ، وَوَاحِدٌ مِنْهَا تَمْنَعُ الْإِرْثَ مِنْ جَانِبٍ وَاحِدٍ وَهُوَ الْقَتْلُ، فَالْقَاتِلُ لَا يَرِثُ مِنَ الْمَقْتُولِ وَلَكِنَّ الْمَقْتُولَ يَرِثُ مِنَ الْقَاتِلِ إِذَا تُوُفِّيَ الْقَاتِلُ قَبْلَ مَوْتِ الْمَقْتُولِ","x":""},{"k":"h","x":"1. Kölelik «الرِّقّ»"},{"k":"p","x":"Kölelik gerek tam olsun ve gerekse köle müdebber, ümm-i veled veya mu'teku'l-ba'z olsun mirastan mahrumiyete sebeptir."},{"k":"p","x":"Mesela bir kimse ölse ve oğlu Zeyd bir başkasının kölesi bulunsa, Zeyd babasına vâris olamaz. Çünkü kölenin malı efendisine aittir. Bu takdirde Zeyd babasına vâris olsaydı, yabancı bulunan efendisinin vâris olması anlamına gelirdi ki yabancının yabancıya vâris olması icmâ ile batıldır."},{"k":"d","t":"Müdebber","x":"Efendisi tarafından azad edilmesi efendisinin ölümüne bağlanmış köledir."},{"k":"d","t":"Ümmü veled","x":"Efendisinden çocuk doğurmuş bulunan cariyedir. Ümmü veled azad olmaktan başka bir surette mevlasının mülkünden çıkmaz. Mevla ölür ölmez ümmü veled azad olur."},{"k":"d","t":"Mu'teku'l-ba'z","x":"Kısmen azadlı köledir. Bir kölenin 1/3'ünün azad olması gibi. Böyle azadlama sadece İmam-ı Âzam'a göredir. İmameyn ve diğer üç mezhebe göre kısmen azad olunmuş bir köle, tamamen azad edilmiş olur."},{"k":"h","x":"2. Katl «الْقَتْل»"},{"k":"p","x":"İslam hukukunda katlin iki ana şekli vardır:"},{"k":"h5","x":"A. Özür veya hakka dayanan katl «قَتْلٌ بِحَقٍّ أَوْ عُذْرٍ»"},{"k":"n","n":1,"x":"Kısas «الْقِصَاص»: Celladın murisine kısas uygulaması,"},{"k":"n","n":2,"x":"Had «الْحَدّ»: Mürted olup dinden çıkanın öldürülmesi,"},{"k":"n","n":3,"x":"Nefsi müdafaa «دِفَاعٌ عَنِ النَّفْس»: Nefsini, malını veya ırzını korumak amacıyla birini öldürme."},{"k":"p","x":"Öldürme bu şekilde gerçekleşmiş ise burada kısas, diyet, kefaret ve günah yoktur. Aynı zamanda bu tarz bir öldürme mirasa engel de değildir."},{"k":"h5","x":"B. Özür veya hakka dayanmayan katl «قَتْلٌ بِغَيْرِ حَقٍّ أَوْ عُذْرٍ»"},{"k":"d","t":"Amden katl «الْقَتْلُ الْعَمْد»","x":"Öldürücü bir alet ile kasten vurup öldürme. Kısas gerektirir."},{"k":"d","t":"Şibh-i amd «شِبْهُ الْعَمْد»","x":"Öldürücü olmayan bir alet ile kasten vurup öldürme. Burada fiil kastı vardır. Ancak öldürme kastı yoktur. Kefaret (yani bir köle azad etme veya 60 gün oruç tutma) ve diyet (yani yüz deve) gerektirir."},{"k":"d","t":"Hataen katl «خَطَأً»","x":"Öldürme veya başka bir fiilin kastedilmediği halde ölümün cereyan ettiği durumlardır. Mesela kişinin bir avı vurmaya çalışırken hataen insanı vurması, arabayla birine çarpmak, elindeki taşın düşüp aşağıda birinin başına değmesi gibi... Kefaret ve diyet gerektirir."},{"k":"d","t":"Katl tesebbüben «الْقَتْلُ تَسَبُّبًا»","x":"Kişinin kendisine ait bir bahçede kuyu kazması ve birinin de o kuyuya düşüp ölmesi gibi ki bu durumda ölüme sebebiyet verilmiştir. Doğrudan bir müdahale yoktur. Sadece diyet gerekir."},{"k":"d","t":"Mâ cerâ mecrâ’l-hata «مَا جَرَى مَجْرَى الْخَطَأ»","x":"Uykudayken farkında olmadan bebeğini öldüren annenin durumu gibi. Diyet ve kefaret gerektirir."},{"k":"p","x":"Burada hata ile adam öldürmeden farkı şudur: Hata ile adam öldürmede kişiden bizzat isteği ile sadır olan bir fiil vardır. Burada ise böyle bir fiil yoktur."},{"k":"tbl","r":[["Katl çeşidi","Gerektirdiği","Hanefî: mirasa engel mi?","Şâfiî: mirasa engel mi?"],["**Amden**","Kısas","Evet","Evet"],["**Şibh-i amd**","Kefaret + diyet","Evet","Evet"],["**Hataen**","Kefaret + diyet","Evet","Evet"],["**Tesebbüben**","Yalnız diyet","Hayır","Evet"],["**Mâ cerâ mecrâ’l-hata**","Diyet + kefaret","Evet","Evet"]]},{"k":"not","x":"Şafii’ye göre bu 5 öldürme şeklinden hepsi mirasa engeldir. Yani Şafii’ye göre öldürme hangi sebeple olursa olsun öldürmenin her çeşidi katili mirastan alıkoyar. Hanefi mezhebine göre ise sadece 4. madde, yani öldürmeye sebep olmak mirasa engel değildir. Diğer 4 madde mirasa engeldir."},{"k":"p","x":"Özet olarak Şafii’ye göre öldürmenin her çeşidi mirasa engeldir. Hanefi mezhebine göre sadece kısas gerektiren veya diyet ve kefareti beraber gerektiren öldürme çeşitleri mirasa engeldir."},{"k":"h","x":"3. Din ayrılığı «اخْتِلَافُ الدِّين»"},{"k":"p","x":"Gayrimüslim, müslümana vâris olmaz. Bu meselede ittifak edilmiştir. Aynı şekilde Müslüman da gayrimüslime mirasçı olmaz. Sahabe ve tâbiînden bazıları müslümanın, gayrimüslime mirasçı olacağı görüşündedir."},{"k":"p","x":"Burada söz konusu olan ihtilâf-ı din, müslümanla gayrimüslim arasında mevcut olan din farklılığıdır. Yoksa gayrimüslim milletlerin kendileri arasındaki din farklılığı irse mâni değildir. Buna göre Yahudiler Hıristiyanlara, Hıristiyanlar Yahudilere, her iki taife Mecusilere, Mecusiler onlara mirasçı olabilir. Nitekim Hıristiyanlığın çeşitli mezhepleri birbirlerine muhalif olsalar bile yine birbirlerinin mirasçısı olabilirler. Ermeni, Rum, Ortodoks ve Katolik gibi."},{"k":"h","x":"4. İhtilâf-ı dâr (tebaa ayrılığı)"},{"k":"d","t":"İhtilâf-ı dâr","x":"Uyruk (tebaa) ayrılığı; vâris ile muris arasında velayetin inkıtaına sebebiyet verdiği için irse mâni haller arasında sayılmıştır. Çünkü irs, velayete dayalıdır."},{"k":"p","x":"İhtilâf-ı dâr devlet başkanı ve ordunun ayrı olmasıyla meydana gelir. Bu şekilde meydana gelecek olan ihtilâf-ı dâr, iki devlet arasında güvenlik yok olacağından ve her biri diğerine karşı harp açabileceğinden iki devlet fertleri arasında velayeti yok eder fakat iki devlet arasında düşmanlarına karşı savunma ortaklığı varsa dâr birleşmiş ve veraset cereyan etmiş olur."}]}],"ht":[{"s":0,"x":"Mirasın rükünleri: varis, muris, mevrûs."},{"s":1,"x":"Mirasın şartları: murisin ölümü (hakikî, hükmî, takdirî), varisin hayatta olması (hakikî, hükmî), yakınlık cihetinin bilinmesi."},{"s":1,"x":"Mefkûdun ölüm tarihi hâkimin karar günüdür; o güne kadar mefkûdun payı bekletilir."},{"s":1,"x":"Müdahale ile düşen cenin: Hanefîlere göre varis olur ve kendisine varis olunur; cumhura göre olmaz. Kendiliğinden ölen cenin ittifakla varis olmaz."},{"s":2,"x":"Mirasın sebepleri: neseb (eşler dışındaki bütün varisler), nikâh (zifaf şart değil; ric'î talakın iddetinde miras var, bâinde yok; fasid ve batıl nikâhta yok), velâ (atâka ve muvâlât)."},{"s":3,"x":"İttifakla üç mâni: kölelik, katl, din ayrılığı; Hanefîler ihtilâf-ı dârı ekler, Mâlikîlere göre mâniler 7’dir."},{"s":3,"x":"Kölelik ve din ayrılığı iki taraflı, katl tek taraflı mânidir: katil maktule varis olamaz ama maktul (katil ondan önce ölürse) katile varis olabilir."},{"s":3,"x":"Hanefîlere göre yalnız tesebbüben öldürme mirasa engel değildir; Şâfiîlere göre her çeşidi engeldir."},{"s":3,"x":"İhtilâf-ı din yalnız müslüman ile gayrimüslim arasındadır; gayrimüslimler birbirine varis olur."}],"oz":null},{"t":"Kırk Hal (1): Baba, Dede, Eşler ve Anne Bir Kardeşler","intro":"Babanın üç, dedenin dört, kocanın ve karının ikişer, anne bir kardeşlerin üç hali; boşanmış kadının mirası ve Müştereke meselesi.","s":[{"h":"Baba","b":[{"k":"ar","a":"الْأَبُ: هُوَ أَصْلٌ وَارِثٌ مُذَكَّرٌ مُبَاشِرٌ يَرِثُ دَائِمًا وَلَا يُحْجَبُ إِلَّا بِإِحْدَى مَوَانِعِ الْإِرْثِ، وَلَهُ ثَلَاثُ حَالَاتٍ","x":""},{"k":"p","x":"Babanın üç hali yı kendi aralarında ikili birli olmadan paylaşırlar."},{"k":"p","x":"Miras taksiminde pay alabilmeleri için meselenin kelâle olması gerekir. Kelâle hakkında alimler ihtilaf etseler de en doğru görüşe göre ölüp de geriye usul ve fürûu kalmayan kimse demektir. Bu görüş Hz. Ebûbekir, Hz. Ömer, Hz. Ali, Zeyd b. Sâbit ve İbn Mes’ûd gibi sahabelerden birçoğuna aittir."},{"k":"ar","a":"وَيُقْصَدُ بِهِ أَخُ الْمَيِّتِ مِنْ أُمِّهِ دُونَ أَبِيهِ، أَيْ أُمُّهُمْ وَاحِدَةٌ وَآبَاؤُهُمْ شَتَّى، وَلَا يَرِثُ إِلَّا بِالْفَرْضِ، وَلَا يَكُونُ مِنَ الْعَصَبَةِ أَبَدًا، وَلَا يَرِثُ إِلَّا إِذَا كَانَ مُورِثُهُمْ كَلَالَةً. وَقَدِ اخْتَلَفَ الْمُفَسِّرُونَ وَأَهْلُ اللُّغَةِ اخْتِلَافًا كَثِيرًا فِي مَعْنَى الْكَلَالَةِ، وَلَكِنَّ مُعْظَمَ الصَّحَابَةِ رِضْوَانُ اللَّهِ تَعَالَى عَلَيْهِمْ فَسَّرُوا الْكَلَالَةَ بِأَنَّهَا مَنْ لَا وَلَدَ لَهُ وَلَا وَالِدَ، وَهُوَ قَوْلُ أَبِي بَكْرٍ الصِّدِّيقِ، وَإِحْدَى الرِّوَايَتَيْنِ عَنْ عُمَرَ، وَعَلِيٍّ، وَزَيْدٍ، وَابْنِ مَسْعُودٍ","x":""},{"k":"d","t":"Kelâle «الْكَلَالَة»","x":"En doğru görüşe göre ölüp de geriye usul ve fürûu kalmayan kimse. (Kimilerine göre ölenin kardeşlerini ifade eder.)"},{"k":"h","x":"Anne bir kardeşlerin üç hâli"},{"k":"n","n":1,"x":"Tek ise ve hacbeden yoksa 1/6 alır. «السُّدُسُ عِنْدَ الْإِنْفِرَادِ وَعَدَمِ الْحَاجِبِ»"},{"k":"n","n":2,"x":"Birden fazla iseler ve hacbeden yoksa 1/3 alırlar. «الثُّلُثُ عِنْدَ التَّعَدُّدِ وَعَدَمِ الْحَاجِبِ»"},{"k":"n","n":3,"x":"Ölenin fürûu ve erkek usulü ile hacbolur. «يُحْجَبُ بِالْفَرْعِ مُطْلَقًا وَالْأَصْلِ الْمُذَكَّرِ»"},{"k":"not","x":"Bazı kitaplarda anne bir kardeşler için altı hal sayılır. Bu da anne bir kardeşlerin hacbolma durumunu erkek çocuk, kız çocuk, baba ve dede şeklinde dört ayrı maddede ele almalarından kaynaklanmaktadır."},{"k":"ar","a":"﴿وَإِنْ كَانَ رَجُلٌ يُورَثُ كَلَالَةً أَوِ امْرَأَةٌ وَلَهُ أَخٌ أَوْ أُخْتٌ فَلِكُلِّ وَاحِدٍ مِنْهُمَا السُّدُسُ فَإِنْ كَانُوا أَكْثَرَ مِنْ ذَلِكَ فَهُمْ شُرَكَاءُ فِي الثُّلُثِ﴾","x":"Delil"},{"k":"p","x":"Bu ayette anne bir kız ve erkek kardeşlerden söz edilmektedir. Bu ayete miras hukukunda «كَلَالَةُ الشِّتَاء» denir. Çünkü bu ayet kışın inmiştir. Nisâ sûresi 176. ayette ise «كَلَالَةُ الصَّيْف» denir. Nisâ sûresinde iki defa kelâle ismi zikredilmektedir. Hangisinin anne bir kardeşlerden, hangisinin öz kız kardeşler ve baba bir kız kardeşlerden söz ettiğini ifade etmek için yaz ve kış kelâlesi ifadeleri kullanılmaktadır. Öz kız kardeşler ve baba bir kız kardeşler Nisâ sûresinin sonunda zikredilmektedir."},{"k":"p","x":"Bu ayette anne bir kardeşlerden söz edildiğinin bir diğer delili de Sa'd b. Ebî Vakkâs'ın şu kıraatidir: «وَلَهُ أَخٌ أَوْ أُخْتٌ مِنْ أُمٍّ»."},{"k":"d","t":"Kelâletü’ş-şitâ","x":"Anne bir kardeşlerden bahseden Nisâ 12. ayet (kışın indi)."},{"k":"d","t":"Kelâletü’s-sayf","x":"Öz ve baba bir kız kardeşlerden bahseden Nisâ 176. ayet (yazın indi)."},{"k":"h","x":"Anne bir kardeşlere özel durumlar"},{"k":"li","x":"Anne bir erkek kardeş anne bir kız kardeşi asabe yapmaz. «الْأَخُ لَا يُعَصِّبُ أُخْتَهُ»"},{"k":"li","x":"Anne bir erkek kardeş anne bir kız kardeş ile eşit pay alır. İkili birli almazlar. «لِلذَّكَرِ مِثْلُ الْأُنْثَى»"},{"k":"li","x":"Anne bir kardeşler «كُلُّ مَنْ أَدْلَى بِوَاسِطَةٍ حَجَبَتْهُ تِلْكَ الْوَاسِطَةُ» kuralına aykırı bir şekilde pay alırlar. «الْأَخُ لِأُمٍّ يَرِثُ خِلَافًا لِقَاعِدَةِ الْإِدْلَاءِ»"},{"k":"li","x":"Anne bir kardeşler ölüye kadın vasıtasıyla ulaşmalarına rağmen pay alırlar. «الْأَخُ لِأُمٍّ يَرِثُ مَعَ أَنَّهُ يُدْلِي بِأُنْثَى»"},{"k":"li","x":"Anne bir kardeşlerin dede ile mahcub olduğu konusunda 4 mezhep ittifak etmiştir. «الْأَخُ لِأُمٍّ يُحْجَبُ بِالْجَدِّ إِجْمَاعًا»"},{"k":"li","x":"Öz ve baba bir kız kardeşler ölenin kızı ile mahcub olmazken anne bir kardeşler mahcub olur. «الْأَخُ لِأُمٍّ يُحْجَبُ بِالْبِنْتِ بِخِلَافِ الْأَخِ ش وَالْأَخِ لِأَبٍ»"},{"k":"ms","m":["6"],"t":"","top":[],"r":[{"v":"زوج","p":"1/2","s":["3"],"tl":""},{"v":"أخ لأم","p":"1/3","s":["2"],"tl":""},{"v":"أخت لأم","p":"^","s":["^"],"tl
