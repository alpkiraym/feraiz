<style>
:root{
  --paper:#f7f3ea; --card:#fffdf8; --ink:#1f2a24; --muted:#6b7068; --line:#e3dccb;
  --green:#1f5a45; --green-2:#2f7a5f; --green-soft:#e4efe8; --gold:#b08a3e; --gold-soft:#f4ead3;
  --red:#a8432f; --red-soft:#f6e1db; --radius:14px; --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ar:Amiri,"Traditional Arabic","Scheherazade New","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body{padding-bottom:34px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:5;background:rgba(247,243,234,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.15rem;font-weight:700;color:var(--green);background:none;border:0;padding:0}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto}
.crumb .brand{min-width:0}.crumb .bt{overflow:hidden;text-overflow:ellipsis}
.ga{display:grid;text-decoration:none;border-radius:8px}
.ga .mark,.brand .pmark{width:30px;height:30px;border-radius:8px;background:var(--green);color:#f4c430;display:grid;place-items:center;flex:none}
.ga:hover .mark{background:var(--green-2)}
.csep{color:var(--line);font-size:1.3rem;line-height:1;margin:0 1px}
.brand .pmark{background:var(--gold-soft);color:var(--green);border:1px solid #e6d6ae}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;color:var(--muted)}
.ghost:hover{border-color:var(--green-2);color:var(--green)}
.iconbtn{padding:6px 10px;display:inline-grid;place-items:center}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0}
h1{font-size:1.7rem;color:var(--green)}
h2{font-size:1.3rem}
.lead{color:var(--muted);margin:6px 0 0}
.hero{padding:28px 0 8px}
.hero .arn{font-family:var(--ar);font-size:1.5rem;color:var(--gold);margin-top:2px;text-align:left}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-family:var(--serif);font-size:1.35rem;color:var(--green)}
.stat span{font-size:.8rem;color:var(--muted)}
.section-title{margin:26px 0 10px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mode{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--green-2)}
.mode .ico{font-size:1.4rem;width:40px;height:40px;border-radius:10px;background:var(--green-soft);display:grid;place-items:center;margin-bottom:10px}
.mode h3{font-size:1.08rem;margin-bottom:4px}
.mode p{margin:0;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.bar{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.progress{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green-2);transition:width .3s}
.count{font-size:.85rem;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;background:var(--gold-soft);color:#7a5c1e;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.q{font-family:var(--serif);font-size:1.25rem;margin:4px 0 18px}
.q.long{font-family:var(--sans);font-size:1.02rem;line-height:1.6;background:var(--paper);border-radius:12px;padding:12px 14px}
.q em{font-style:normal;color:var(--green);font-weight:700}
.q small{display:block;font-family:var(--sans);font-size:.85rem;color:var(--muted);margin-bottom:6px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--paper);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--green-2)}
.opt.ok{border-color:var(--green-2);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--paper);font-size:.93rem;display:none}
.explain.show{display:block}
.explain b{color:var(--green)}
.explain .src{display:block;color:var(--muted);font-size:.82rem;margin-top:6px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 18px;background:var(--green);color:#fff;font-weight:600}
.btn:hover{background:var(--green-2)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center;padding:30px 20px}
.big{font-family:var(--serif);font-size:3rem;color:var(--green);line-height:1}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:8px;align-content:start}
.col h4{margin:0 0 2px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.93rem;min-height:52px;transition:all .15s}
.tile.sel{border-color:var(--gold);background:var(--gold-soft)}
.tile.done{border-color:var(--green-soft);background:var(--green-soft);color:var(--green);opacity:.75}
.tile.wrong{animation:shake .3s;border-color:var(--red);background:var(--red-soft)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.flash{perspective:1200px;min-height:280px;cursor:pointer;margin-top:4px}
.flash-in{position:relative;min-height:280px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.face.back{transform:rotateY(180deg);background:#fbf7ec}
.face .t{font-family:var(--serif);font-size:1.5rem;color:var(--green)}
.face .s{color:var(--ink);font-size:.98rem;margin-top:10px;max-width:560px;line-height:1.6}
.face .hint{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
.answer{display:none;margin-top:6px;border-top:1px dashed var(--line);padding-top:14px}
.answer.show{display:block}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:1rem}
.search:focus{outline:none;border-color:var(--green-2)}
.list{margin-top:12px;display:grid;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;display:block}
button.row:hover{border-color:var(--green-2)}
.row .e{font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--green)}
.row .n{font-size:.93rem;margin-top:3px;line-height:1.55}
.row .w{font-size:.76rem;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:30px}
.meter{display:grid;grid-template-columns:minmax(120px,240px) 1fr 54px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.meter span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .progress{height:10px}
.select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:.9rem;max-width:100%}
.rowctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.kaynak{margin:28px auto 8px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem;text-align:center}
.foot{margin-top:40px;color:var(--muted);font-size:.8rem;text-align:center}
.sig{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 12px calc(5px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);font-family:var(--sans);font-size:.7rem;letter-spacing:.02em;color:var(--muted)}
.sig b{color:var(--green);font-weight:600}
.sig i{font-style:normal;opacity:.5}
.study-cta{display:flex;gap:14px;align-items:center;background:var(--green);color:#fff;border:0;border-radius:var(--radius);padding:18px;text-align:left;width:100%;box-shadow:var(--shadow);margin-bottom:12px}
.study-cta:hover{background:var(--green-2)}
.study-cta .ico{font-size:1.5rem;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.study-cta h3{font-size:1.15rem;margin-bottom:2px;color:#fff}
.study-cta p{margin:0;opacity:.85;font-size:.9rem}
.ulist{display:grid;gap:8px}
.unit{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.unit:hover{border-color:var(--green-2)}
.unit .st{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-weight:700}
.unit.done .st{background:var(--green-2);border-color:var(--green-2);color:#fff}
.unit.next .st{border-color:var(--gold);color:var(--gold)}
.unit .ut{flex:1}.unit .ut b{display:block;font-weight:600}.unit .ut small{color:var(--muted)}
.intro{font-size:1.02rem;margin:10px 0 14px}
.tipbox{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:.95rem}
.tipbox b.lb{color:#7a5c1e;display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
details.oq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
details.oq summary{cursor:pointer;font-weight:600}
.sticky-go{position:sticky;bottom:40px;display:flex;justify-content:center;margin-top:20px}
.sticky-go .btn{box-shadow:0 6px 20px rgba(31,90,69,.3);padding:11px 20px;font-size:.95rem}
.backlink{background:none;border:0;color:var(--green);font-weight:600;padding:14px 0 0;font-size:.95rem}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.toc button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.toc button:hover{border-color:var(--green-2);color:var(--green)}
.lesson section.ls{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;scroll-margin-top:70px}
.lesson h3{font-family:var(--serif);font-size:1.12rem;color:var(--ink);display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;line-height:1.35}
.lesson h3 .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--green-soft);color:var(--green);font-family:var(--sans);font-size:.8rem;font-weight:700;display:grid;place-items:center;margin-top:1px}
.lesson h4{font-family:var(--sans);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}
.lesson p{margin:0 0 8px;font-size:.98rem;line-height:1.65}
.lesson p.li{padding-left:16px;position:relative}.lesson p.li:before{content:"•";position:absolute;left:3px;color:var(--gold);font-weight:700}
.lesson p.num{padding-left:24px;position:relative}.lesson p.num .nn{position:absolute;left:0;color:var(--green);font-weight:700}
.lesson b{color:var(--green)}
.def{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:4px 14px;padding:10px 12px;border-radius:10px;background:var(--green-soft);margin:8px 0}
.def dt{font-family:var(--serif);font-weight:700;color:var(--green)}
.def dd{margin:0;line-height:1.6}
.ar{font-family:var(--ar);font-size:1.18em;line-height:1.9;direction:rtl;unicode-bidi:isolate;color:#5b3f86}
.ar.blk{display:block;text-align:right;margin:4px 0}
.ayet{display:block;font-family:var(--ar);font-size:1.3rem;line-height:2.1;direction:rtl;text-align:right;color:#5b3f86;margin:4px 0 2px}
.sov{position:fixed;inset:0;z-index:90;background:rgba(20,25,20,.35);display:none}
.sov.open{display:block}
.sbox{background:var(--paper);max-width:860px;margin:0 auto;height:100%;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.sbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);color:var(--muted)}
.sbar input{flex:1;border:0;background:transparent;font-size:1.05rem;padding:8px 2px;color:var(--ink);outline:none;min-width:0}
.sres{overflow:auto;padding:4px 14px 80px;flex:1}
.sgrp{margin:16px 0 6px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.sitem:hover{border-color:var(--green-2)}
.sitem .t{font-weight:600}.sitem .w{font-size:.78rem;color:var(--green);font-weight:600;margin-bottom:2px}
.sitem .x{font-size:.88rem;color:var(--muted);margin-top:3px}
mark{background:#f6df9b;color:inherit;border-radius:3px;padding:0 1px}
.flash-target{animation:ft 2.2s ease}
@keyframes ft{0%,40%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:none}}
.how{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:8px 0 14px}
.how summary{cursor:pointer;font-weight:700;color:var(--green);font-family:var(--serif);font-size:1.05rem}
.how .steps{margin:10px 0 6px;padding-left:22px;display:grid;gap:8px;font-size:.94rem}
.how .steps li::marker{color:var(--gold);font-weight:700}
.hownote{margin:6px 0 2px;color:var(--muted);font-size:.86rem}
.exq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.exq .qq{font-family:var(--serif);font-size:1.05rem;font-weight:700;display:flex;gap:10px}
.exq .qq .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--gold-soft);color:#7a5c1e;font-family:var(--sans);font-size:.8rem;display:grid;place-items:center}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links button{border:1px solid var(--line);background:var(--green-soft);color:var(--green);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600}
.oralbody{max-height:none}
.snote{font-size:.86rem;color:var(--muted);margin-top:8px;font-family:var(--sans)}
.lesson h3 .rep{margin-left:auto;flex:none;margin-top:2px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exq .qq .rep{margin-left:auto;flex:none}
.hide{display:none!important}

/* ---------- Feraiz: öğretici görünüm ---------- */
.lesson h5{font-family:var(--sans);font-size:.92rem;color:var(--green);margin:12px 0 6px}
.box{border-radius:10px;padding:11px 14px;margin:10px 0;font-size:.95rem;line-height:1.6;border-left:4px solid}
.box b.lb{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.box.bn{background:var(--gold-soft);border-color:var(--gold)}.box.bn b.lb{color:#7a5c1e}
.box.bk{background:var(--red-soft);border-color:var(--red)}.box.bk b.lb{color:var(--red)}
.box.bo{background:#fff;border:1px dashed var(--green-2);border-left:4px solid var(--green-2)}.box.bo b.lb{color:var(--green-2)}
.box.bs{background:#eef1f6;border-color:#4a6283}.box.bs b.lb{color:#4a6283}
.box.bs .sq{font-weight:600;margin:0 0 6px!important}.box.bs .sa{margin:0!important}.box.bs .sa b{color:#4a6283}
.arb{background:#f8f5fb;border-radius:10px;padding:8px 14px;margin:8px 0}
.arb .ayet{margin:2px 0}
.arb .meal{display:block;font-size:.88rem;color:var(--muted);margin-top:2px;line-height:1.5}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.5}
.tbl th,.tbl td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl thead th{background:var(--green);color:#fff;font-weight:600;font-size:.82rem;letter-spacing:.02em;white-space:nowrap}
.tbl thead th b{color:#fff}
.tbl tbody th{font-weight:600;color:var(--green);background:#fbf8f1;min-width:110px}
.tbl tbody tr:last-child th,.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even) td{background:#fcfaf5}
.tbl .ar{font-size:1.05em;line-height:1.8}
.tbl td.arc .ar{display:block;text-align:right;font-size:1.2em;line-height:1.9}
.tbl.cmp thead th:first-child{background:var(--green-2)}
.stp{list-style:none;counter-reset:st;margin:10px 0;padding:0 0 0 4px}
.stp li{counter-increment:st;position:relative;padding:0 0 12px 36px;font-size:.95rem;line-height:1.6}
.stp li:before{content:counter(st);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#fff;font-size:.78rem;font-weight:700;display:grid;place-items:center}
.stp li:after{content:"";position:absolute;left:11px;top:26px;bottom:2px;border-left:2px solid var(--gold-soft)}
.stp li:last-child{padding-bottom:2px}.stp li:last-child:after{display:none}
details.ht{background:var(--green-soft);border:1px solid #cfe0d6;border-radius:var(--radius);margin:16px 0 10px;padding:0}

<style>

<script>
/* Kullanım: düğme → <button class="rep" data-k="benzersiz-anahtar" data-yer="Ünite 3 · Bölüm" data-bas="Kayıt başlığı">⚑ Bildir</button>
   Programda önceden tanımlanır: window.BLD_APP = 'Program adı'; window.BLD_PREFIX = 'kayıt ön eki';
   İsteğe bağlı: "Bildirimlerim" düğmesinin konacağı yer → window.BLD_SLOT = 'css seçici' */
(function () {
  const APP = window.BLD_APP || 'Program', MAIL = 'alpkiraymehmet@gmail.com';
  const KEY = (window.BLD_PREFIX || 'bld_') + 'reports';
  const TYPES = ['Bilgi yanlış', 'Eksik ya da karışık anlatım', 'Soru, şık veya cevap hatalı', 'Arapça metin bozuk', 'Yazım hatası', 'Diğer'];
  const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const getL = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
  const setL = l => { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (e) {} sync(); };
  const modal = document.getElementById('bldModal'), box = document.getElementById('bldBox');
  let lbtn = null;
  function slot() {
    if (lbtn || !window.BLD_SLOT) return;
    const s = document.querySelector(window.BLD_SLOT); if (!s) return;
    lbtn = document.createElement('button'); lbtn.type = 'button'; lbtn.className = 'bld-lbtn'; lbtn.title = 'Listeye eklediğin hata bildirimleri';
    lbtn.onclick = openList; s.appendChild(lbtn);
  }
  function sync() { slot(); if (lbtn) { const n = getL().length; lbtn.classList.toggle('has', n > 0); lbtn.innerHTML = `⚑<span class="bld-lg"> Bildirimlerim</span> (${n})`; } mark(); }
  function mark() { const l = getL(); document.querySelectorAll('.rep[data-k]').forEach(b => b.classList.toggle('on', l.some(x => x.k === b.dataset.k))); }
  const TR = {'ç': 'c', 'ğ': 'g', 'ı': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u', 'â': 'a', 'î': 'i', 'û': 'u', 'Ç': 'C', 'Ğ': 'G', 'İ': 'I', 'Ö': 'O', 'Ş': 'S', 'Ü': 'U', 'Â': 'A', 'Î': 'I', 'Û': 'U'};
  const ascii = t => String(t).normalize('NFC').replace(/[çğıöşüâîûÇĞİÖŞÜÂÎÛ]/g, c => TR[c]).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E\n]/g, '');
  const plain = t => String(t).replace(/[“”«»]/g, '"').replace(/[‘’ʿʾ]/g, "'").replace(/[·—–…]/g, '-').replace(/\s{2,}/g, ' ').trim();
  const body1 = r => `Program: ${APP}\nYer: ${r.yer}\nKayit: ${r.bas}\nKayit no: ${r.k}\nHata turu: ${r.type}\nNot: ${r.note || '-'}\nSayfa: ${r.url}`;
  const subj = r => `[${APP} Hata] ${r.k}`;
  const mailto = (su, bo) => `mailto:${MAIL}?subject=${encodeURIComponent(ascii(plain(su)))}&body=${encodeURIComponent(ascii(bo.split('\n').map(plain).join('\n'))).replace(/%0A/g, '%0D%0A')}`;
  const gmail = (su, bo) => `https://mail.google.com/mail/?view=cm&fs=1&to=${MAIL}&su=${encodeURIComponent(su)}&body=${encodeURIComponent(bo)}`;
  function copy(t, msg) {
    const done = () => { msg.textContent = `Kopyalandı. Yeni bir e-posta aç, alıcıya ${MAIL} yaz ve metni mesajın içine yapıştır.`; };
    const fb = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { msg.textContent = 'Kopyalanamadı; metni elle seçip kopyalayabilirsin.'; } ta.remove(); };
    try { if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(t).then(done, fb); else fb(); } catch (e) { fb(); }
  }
  let pushed = false;
  function open(html) {
    box.innerHTML = html;
    if (!modal.classList.contains('open')) { try { history.pushState(Object.assign({}, history.state, {bld: 1}), ''); pushed = true; } catch (e) { pushed = false; } }
    modal.classList.add('open'); const f = box.querySelector('textarea,input,button'); f && f.focus();
  }
  let closing = false;
  function close() { if (!modal.classList.contains('open')) return; modal.classList.remove('open'); if (pushed) { pushed = false; closing = true; try { history.back(); } catch (e) { closing = false; } } }
  // Telefonda geri hareketi önce pencereyi kapatsın, programın kendi gezinmesine geçmesin
  window.addEventListener('popstate', e => {
    if (closing) { closing = false; e.stopImmediatePropagation(); return; }
    if (modal.classList.contains('open') || pushed || (history.state && history.state.bld)) {
      const wasOpen = modal.classList.contains('open');
      modal.classList.remove('open'); pushed = false; e.stopImmediatePropagation();
      if (!wasOpen && history.state && history.state.bld) { try { history.back(); } catch (er) {} }
    }
  }, true);
  modal.addEventListener('click', e => { if (e.target === modal || e.target.closest('[data-x=close]')) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) close(); });
  function report(b) {
    const r = {k: b.dataset.k, yer: b.dataset.yer || '', bas: b.dataset.bas || '', url: location.href};
    open(`<h3 id="bldTitle">Hata bildir</h3><div class="bld-loc">${E(r.yer)}</div><div class="bld-q">${E(r.bas)}</div>
      ${TYPES.map((t, i) => `<label><input type="radio" name="bldt" value="${i}" ${i === 0 ? 'checked' : ''}> ${E(t)}</label>`).join('')}
      <textarea id="bldNote" placeholder="Not (isteğe bağlı): doğrusu ne olmalı, kaynağı nedir…"></textarea>
      <div class="bld-btns"><button class="pri" data-a="mail">E-posta ile gönder</button><a data-a="gmail" href="#" target="_blank" rel="noopener">Gmail'de aç</a><button data-a="copy">Metni kopyala</button><button data-a="add">Listeye ekle</button><button data-x="close">Kapat</button></div>
      <div class="bld-msg" id="bldMsg" aria-live="polite"></div>
      <div class="bld-hint">“E-posta ile gönder” bilgisayarındaki/telefonundaki e-posta uygulamasını açar. Açılmazsa “Gmail'de aç”ı ya da “Metni kopyala”yı kullan. Adres: ${MAIL}. Birden çok hata bulacaksan “Listeye ekle” deyip sonra üstteki “Bildirimlerim” ile hepsini tek e-postada gönderebilirsin.</div>`);
    const get = () => Object.assign({}, r, {type: TYPES[+box.querySelector('input[name=bldt]:checked').value], note: box.querySelector('#bldNote').value.trim()});
    const msg = box.querySelector('#bldMsg'), q = a => box.querySelector(`[data-a=${a}]`);
    q('mail').onclick = () => { const x = get(); try { navigator.clipboard && navigator.clipboard.writeText(body1(x)).catch(() => {}); } catch (e) {} location.href = mailto(subj(x), body1(x)); msg.textContent = 'E-posta uygulaman açılıyor… Metin ayrıca panoya kopyalandı: mesaj boş ya da bozuk görünürse içini silip yapıştırabilirsin.'; };
    q('gmail').onclick = function () { const x = get(); this.href = gmail(subj(x), body1(x)); };
    q('copy').onclick = () => copy(body1(get()), msg);
    q('add').onclick = () => { const l = getL(); l.push(get()); setL(l); msg.textContent = `Listeye eklendi (${l.length}). Üstteki “Bildirimlerim” ile topluca gönderebilirsin.`; };
  }
  function openList() {
    const l = getL(), su = `[${APP} Hata] Toplu bildirim (${l.length} hata)`, bo = l.map((r, i) => `--- ${i + 1} ---\n${body1(r)}`).join('\n\n');
    open(`<h3 id="bldTitle">Bildirimlerim (${l.length})</h3>
      ${l.length ? `<ul class="bld-list">${l.map((r, i) => `<li><div><b>${E(r.bas.slice(0, 90))}</b><br><small>${E(r.yer)} · ${E(r.type)}${r.note ? ' — ' + E(r.note) : ''}</small></div><button data-del="${i}" title="Listeden çıkar">✕</button></li>`).join('')}</ul>` : '<p>Liste boş.</p>'}
      <div class="bld-btns">${l.length ? `<button class="pri" data-a="mail">Hepsini e-postayla gönder</button><a data-a="gmail" href="#" target="_blank" rel="noopener">Gmail'de aç</a><button data-a="copy">Metni kopyala</button><button data-a="clear">Listeyi temizle</button>` : ''}<button data-x="close">Kapat</button></div>
      <div class="bld-msg" id="bldMsg" aria-live="polite"></div><div class="bld-hint">Gönderdikten sonra “Listeyi temizle” diyebilirsin. Liste yalnızca bu tarayıcıda saklanır.</div>`);
    const msg = box.querySelector('#bldMsg'), q = a => box.querySelector(`[data-a=${a}]`);

  function toast(m){ var d=document.createElement('div'); d.className='gab-toast'; d.textContent=m; document.body.appendChild(d); clearTimeout(tt); tt=setTimeout(function(){ d.remove(); }, 2600); }

  function dersler(){
    var all=rd('ga_ozet',{});
    return GA_PROGS.map(function(p){
      var o=all[p.k], cur=p.k===APP, u=(o&&o.yer&&o.yer.url)||p.url;
      var alt = cur ? '' : (o&&o.yer ? 'Kaldığınız yer: '+esc(o.yer.ad) : '');
      return '<a class="gab-li'+(cur?' cur':'')+'" href="'+esc(p.url)+'" '+(cur?'data-cur="1"':'data-u="'+esc(u)+'"')+'><span class="gab-pm">'+svg(p.i)+'</span><span class="gab-tx"><b>'+esc(p.ad)+'</b>'+(alt?'<small>'+alt+'</small>':'')+'</span>'+(cur?'<span class="gab-tag">buradasınız</span>':'')+'</a>';
    }).join('') + '<p class="gab-note">Diğer dersler hazırlanıyor; hazır oldukça bu listeye eklenecek.</p>';
  }
  function seri(){
    var g=rd('ga_gunler',[]); if(!g.length) return 0;
    var set={}; g.forEach(function(x){ set[x]=1; });
    var d=new Date(), n=0; if(!set[gun(d)]) d.setDate(d.getDate()-1);
    while(set[gun(d)]){ n++; d.setDate(d.getDate()-1); }
    return n;
  }
  function karne(){
    var all=rd('ga_ozet',{}), D=0, Y=0, K=0, var_=false;
    var rows = GA_PROGS.map(function(p){
      var o=all[p.k];
      if(!o) return '<button class="gab-kr bos" type="button" data-u="'+esc(p.url)+'"><span class="nm"><b>'+esc(p.ad)+'</b><small>Henüz başlanmadı</small></span><span class="n gab-g e">—</span><span class="n gab-g e">—</span></button>';
      var_=true; var d=o.d||0, y=o.y||0; D+=d; Y+=y; K+=o.kart||0;
      var b=Math.round((o.bitti||0)*100), q=d+y?Math.round(d/(d+y)*100):null;
      var c=q===null?'e':(q>=75?'':(q>=50?'o':'z'));
      return '<button class="gab-kr" type="button" data-u="'+esc((o.yer&&o.yer.url)||p.url)+'"><span class="nm"><b>'+esc(p.ad)+'</b><small>'+esc(o.etiket||'')+'</small></span><span class="n">%'+b+'</span><span class="n gab-g '+c+'">'+(q===null?'—':'%'+q)+'</span><span class="gab-bar"><i style="width:'+b+'%"></i></span></button>';
    }).join('');
    var S=D+Y, P=S?Math.round(D/S*100):null, sr=seri();
    return '<div class="gab-st"><div><b>'+S+'</b><span>soru çözüldü</span></div><div><b>'+(P===null?'—':'%'+P)+'</b><span>doğru</span></div><div><b>'+K+'</b><span>kart biliniyor</span></div></div>'
      + (sr>1 ? '<div class="gab-streak">🔥 '+sr+' gündür aralıksız çalışıyorsunuz</div>' : (sr===1 ? '<div class="gab-streak">🔥 Bugün çalıştınız. Yarın da gelirseniz seri başlar.</div>' : ''))
      + '<div class="gab-k"><div class="gab-kr gab-kh"><span>Ders</span><span class="n">Bitti</span><span class="n">Doğru</span></div>'+rows+'</div>'
      + '<p class="gab-note">'+(var_?'Bir derse dokunursanız kaldığınız yere gidersiniz. ':'')+'İlerlemeniz yalnızca bu cihazda, bu tarayıcıda saklanır.</p>'
      + '<a class="gab-mail" href="mailto:'+MAIL+'?subject='+encodeURIComponent('[Giray Akademi] Öneri / soru')+'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>İletişim · öneri ve soru gönderin</a>';
  }
})();

<script>
/* Feraiz hesaplayıcı (Hanefî; ders notundaki kurallar).
   coz({anahtar: sayı, ...}) → {satirlar, mahrec, tur, ...} */
const VARISLER = [
  // anahtar, Arapça, Türkçe, en çok
  ['zevc', 'زوج', 'Koca', 1], ['zevce', 'زوجة', 'Karı', 4],
  ['eb', 'أب', 'Baba', 1], ['cedd', 'جد', 'Dede (babanın babası)', 1],
  ['um', 'أم', 'Anne', 1], ['ceddeU', 'أم الأم', 'Anneanne', 1], ['ceddeB', 'أم الأب', 'Babaanne', 1],
  ['ceddeUU', 'أم أم الأم', 'Anneannenin annesi', 1], ['ceddeUB', 'أم أم الأب', 'Babaannenin annesi', 1], ['ceddeBB', 'أم أب الأب', 'Dedenin annesi', 1], ['ceddeUUU', 'أم أم أم الأم', 'Anneannenin anneannesi', 1],
  ['ibn', 'ابن', 'Oğul', 20], ['bint', 'بنت', 'Kız', 20],
  ['ibnIbn', 'ابن ابن', 'Oğlun oğlu', 20], ['bintIbn', 'بنت ابن', 'Oğlun kızı', 20],
  ['ibn3', 'ابن ابن الابن', 'Oğlun oğlunun oğlu', 20], ['bint3', 'بنت ابن الابن', 'Oğlun oğlunun kızı', 20],
  ['ibn4', 'ابن ابن ابن الابن', 'Oğlun oğlunun oğlunun oğlu', 20], ['bint4', 'بنت ابن ابن الابن', 'Oğlun oğlunun oğlunun kızı', 20],
  ['ahS', 'أخ ش', 'Öz erkek kardeş', 20], ['uhtS', 'أخت ش', 'Öz kız kardeş', 20],
  ['ahB', 'أخ لأب', 'Baba bir erkek kardeş', 20], ['uhtB', 'أخت لأب', 'Baba bir kız kardeş', 20],
  ['ahU', 'أخ لأم', 'Anne bir erkek kardeş', 20], ['uhtU', 'أخت لأم', 'Anne bir kız kardeş', 20],
  ['ibnAhS', 'ابن أخ ش', 'Öz erkek kardeşin oğlu', 20], ['ibnAhB', 'ابن أخ لأب', 'Baba bir erkek kardeşin oğlu', 20],
  ['amS', 'عم ش', 'Öz amca', 20], ['amB', 'عم لأب', 'Baba bir amca', 20],
  ['ibnAmS', 'ابن عم ش', 'Öz amcanın oğlu', 20], ['ibnAmB', 'ابن عم لأب', 'Baba bir amcanın oğlu', 20],
  // zevi'l-erhâm (önceki beş sınıftan biri varken «لا»)
  ['ebUm', 'أب الأم', 'Annenin babası (fasid dede)', 1], ['ceddeF', 'أم أب الأم', 'Fasid nene', 1],
  ['bintBint', 'بنت البنت', 'Kızın kızı', 20], ['ibnBint', 'ابن البنت', 'Kızın oğlu', 20],
];
const ZEVI = ['ebUm', 'ceddeF', 'bintBint', 'ibnBint'];
// nene: [anahtar, derece, baba tarafından mı, dede üzerinden mi]
const NENE = [['ceddeU', 1, false], ['ceddeB', 1, true], ['ceddeUU', 2, false], ['ceddeUB', 2, true], ['ceddeBB', 2, true, true], ['ceddeUUU', 3, false]];
const VAR = Object.fromEntries(VARISLER.map(([k, a, t, m]) => [k, {k, a, t, m}]));
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const lcm = (a, b) => a / gcd(a, b) * b;
// Bir öncelik sırası: asabe binefsihi (uhtS/uhtB maa'l-gayr, öz/baba bir erkek kardeş yerinde)
const ASABE_SIRA = ['ibn', 'ibnIbn', 'ibn3', 'ibn4', 'eb', 'cedd', 'ahS', 'uhtS*', 'ahB', 'uhtB*', 'ibnAhS', 'ibnAhB', 'amS', 'amB', 'ibnAmS', 'ibnAmB'];

function coz(g) {
  const n = k => g[k] || 0, var_ = k => n(k) > 0;
  const ERK = ['ibn', 'ibnIbn', 'ibn3', 'ibn4'], KIZ = ['bint', 'bintIbn', 'bint3', 'bint4'];
  const furuErkek = ERK.some(var_);
  const furu = furuErkek || KIZ.some(var_);
  const kardes = n('ahS') + n('uhtS') + n('ahB') + n('uhtB') + n('ahU') + n('uhtU');
  const R = {};   // anahtar → {hal, f:[pay, payda] | null, asabe:bool, m:'م'|null, neden}
  const set = (k, o) => { if (var_(k)) R[k] = Object.assign({f: null, asabe: false, m: null, neden: ''}, o); };
  const mahcub = (k, neden) => set(k, {hal: 'م', m: 'م', neden});

  // ---- eşler
  set('zevc', furu ? {hal: '1/4', f: [1, 4], neden: 'Ölenin fürûu var: koca 1/4 alır.'} : {hal: '1/2', f: [1, 2], neden: 'Ölenin fürûu yok: koca 1/2 alır.'});
  set('zevce', furu ? {hal: '1/8', f: [1, 8], neden: 'Ölenin fürûu var: karı 1/8 alır.'} : {hal: '1/4', f: [1, 4], neden: 'Ölenin fürûu yok: karı 1/4 alır.'});
  // ---- baba, dede
  const babaHal = who => furuErkek ? {hal: '1/6', f: [1, 6], neden: `Erkek fürû var: ${who} yalnız 1/6 alır.`}
    : furu ? {hal: '1/6+ع', f: [1, 6], asabe: true, neden: `Yalnız kız fürû var: ${who} 1/6 ve kalanı alır.`}
    : {hal: 'ع', asabe: true, neden: `Fürû yok: ${who} asabe olarak kalanı alır.`};
  set('eb', babaHal('baba'));
  if (var_('eb')) mahcub('cedd', 'Dede baba ile mahcub olur.'); else set('cedd', babaHal('dede'));
  // ---- anne
  const omeriyye = var_('eb') && (var_('zevc') || var_('zevce')) && !furu && kardes < 2;
  if (furu || kardes >= 2) set('um', {hal: '1/6', f: [1, 6], neden: furu ? 'Ölenin fürûu var: anne 1/6 alır.' : 'Birden fazla kardeş var (mahcub olsalar da): anne 1/6 alır.'});
  else if (omeriyye) set('um', {hal: '1/3 الباقي', f: var_('zevc') ? [1, 6] : [1, 4], omer: true, neden: 'Ömeriyye: anne, baba ve eşle beraber; eşin payından kalanın 1/3’ünü alır.'});
  else set('um', {hal: '1/3', f: [1, 3], neden: 'Fürû ve birden fazla kardeş yok: anne 1/3 alır.'});
  // ---- neneler (Hanefî): anne hepsini, baba baba tarafındakileri, dede kendi üzerinden gelenleri, yakın nene uzak neneyi hacbeder
  {
    const var_n = NENE.filter(([k]) => var_(k));
    const uygun = [];
    var_n.forEach(([k, d, bt, dd]) => {
      if (var_('um')) mahcub(k, 'Anne bütün neneleri hacbeder.');
      else if (bt && var_('eb')) mahcub(k, 'Baba, baba tarafındaki neneleri hacbeder.');
      else if (dd && var_('cedd')) mahcub(k, 'Dede, kendisi vasıtasıyla ölüye ulaşan neneyi hacbeder.');
      else uygun.push([k, d]);
    });
    const en = Math.min(...uygun.map(x => x[1]));
    const yakin = uygun.filter(x => x[1] === en);
    uygun.forEach(([k, d]) => { if (d > en) mahcub(k, 'Yakın nene uzak neneyi hacbeder.'); });
    yakin.forEach(([k]) => set(k, {hal: '1/6', f: [1, 6], grup: 'cedde', neden: yakin.length > 1 ? 'Aynı derecedeki neneler 1/6’yı paylaşır.' : 'Hacbeden yok: nene 1/6 alır.'}));
  }
  // ---- fürû (oğul, kız ve aşağısı; ibnü'l-mübârek dahil)
  {
    const Lm = ERK.findIndex(var_);   // en yakın erkek fürûnun derecesi (0 = oğul)
    let alinan = 0;                   // 0: yok, 1: 1/2 alındı, 2: 2/3 doldu
    const DAD = ['Kız', 'Oğlun kızı', 'Oğlun oğlunun kızı', 'Dördüncü derece kız'];
    for (let L = 0; L < 4; L++) {
      const e = ERK[L], k = KIZ[L];
      if (Lm >= 0 && L > Lm) { mahcub(e, `${VAR[e].t}, daha yakın erkek fürû ile mahcub olur.`); mahcub(k, `${VAR[k].t}, daha yakın erkek fürû ile mahcub olur.`); continue; }
      if (L === Lm) {
        set(e, {hal: 'ع', asabe: true, neden: `${VAR[e].t} asabedir.`});
        set(k, {hal: 'ع', asabe: true, neden: `${VAR[k].t}, kendi derecesindeki erkekle asabe bi-gayrihi olur.`});
        continue;
      }
      if (!var_(k)) continue;
      if (alinan === 2) {
        if (Lm > L) set(k, {hal: 'ع', asabe: true, mubarek: true, neden: `Normalde mahcub olan ${VAR[k].t.toLowerCase()}, aşağıdaki erkek fürû (ibnü’l-mübârek) ile asabe bi-gayrihi olur.`});
        else mahcub(k, `Üsttekiler 2/3’ü tamamladığı için ${VAR[k].t.toLowerCase()} mahcub olur.`);
      } else if (alinan === 1) { set(k, {hal: '1/6', f: [1, 6], neden: `Üstte tek kız 1/2 aldığı için ${VAR[k].t.toLowerCase()} 1/6 alır (tekmiletü’s-sülüseyn).`}); alinan = 2; }
      else if (n(k) === 1) { set(k, {hal: '1/2', f: [1, 2], neden: `Tek ${VAR[k].t.toLowerCase()} 1/2 alır.`}); alinan = 1; }
      else { set(k, {hal: '2/3', f: [2, 3], neden: `Birden fazla ${VAR[k].t.toLowerCase()} 2/3 alır.`}); alinan = 2; }
    }
  }
  // ---- kardeşler
  const usulErkek = var_('eb') || var_('cedd');
  const kizFuru = KIZ.some(k => var_(k) && R[k] && !R[k].m);
  const kHacb = furuErkek ? 'erkek fürû' : var_('eb') ? 'baba' : var_('cedd') ? 'dede' : null;
  if (kHacb) ['ahS', 'uhtS', 'ahB', 'uhtB'].forEach(k => mahcub(k, `Öz ve baba bir kardeşler ${kHacb} ile mahcub olur.`));
  else {
    set('ahS', {hal: 'ع', asabe: true, neden: 'Öz erkek kardeş asabedir.'});
    if (var_('ahS')) set('uhtS', {hal: 'ع', asabe: true, neden: 'Öz kız kardeş, öz erkek kardeşle asabe bi-gayrihi olur.'});
    else if (kizFuru) set('uhtS', {hal: 'ع', asabe: true, maa: true, neden: 'Öz kız kardeş, kız/oğlun kızı ile asabe maa’l-gayr olur.'});
    else set('uhtS', n('uhtS') === 1 ? {hal: '1/2', f: [1, 2], neden: 'Tek öz kız kardeş 1/2 alır.'} : {hal: '2/3', f: [2, 3], neden: 'Birden fazla öz kız kardeş 2/3 alır.'});
    const uhtSmaa = R.uhtS && R.uhtS.maa;
    if (var_('ahS')) { mahcub('ahB', 'Baba bir erkek kardeş öz erkek kardeş ile mahcub olur.'); mahcub('uhtB', 'Baba bir kız kardeş öz erkek kardeş ile mahcub olur.'); }
    else if (uhtSmaa) { mahcub('ahB', 'Asabe maa’l-gayr olan öz kız kardeş, öz erkek kardeş gibidir.'); mahcub('uhtB', 'Asabe maa’l-gayr olan öz kız kardeş baba bir kız kardeşi hacbeder.'); }
    else {
